# A graph split across nodes: gate's two imports are satisfied at runtime, so
# every call crosses the bus and the hop cost is what is being measured.

version: comp/v1
app: split
tenant: alice
strategy: linked

components:
  - id: gate
    placement:
      mode: spread
      constraints:
        role: web
  # Pinned to the data node, not left to the planner. The comment at the top of
  # this file has always claimed every call crosses the bus, and an unconstrained
  # shaper can land beside `gate` — which is exactly what happened the first time
  # `comp-hopcost` used this fixture, producing a "split" arm with no hop in it
  # and a cost of -0.1% (ADR-0074).
  - id: shaper
    placement:
      mode: spread
      constraints:
        role: data
  - id: record-store
    placement:
      mode: spread
      constraints:
        role: data

links:
  - from: gate
    import: records:store/store@0.1.0
    to: record-store
  - from: gate
    import: shaper:limit/limiter@0.1.0
    to: shaper

ingress:
  host: split.alice.test
  component: gate
