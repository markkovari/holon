# The real driver graph for a live run: probe → driver → writer → the model,
# and driver → gate (checks-runner → comp-checks).
#
# The model is REAL (openai-provider against whatever `--llm-base-url` names —
# api.openai.com, vLLM, or a self-hosted mlx server — key from the vault) and the gate is REAL (checks-runner dials comp-checks over loopback,
# which runs `uv run pytest`). This is the whole agent, unmocked.
#
# Egress is declared per component here because a fixture writes it directly —
# the model host for the writer's provider, the loopback checks port for the
# gate. The key is a secret by reference, never config (ADR-0051).
#
# LLM_MODEL, CHECKS_URL and CHECKS_AUTHORITY are rewritten by the runner before
# start. A URL and an authority rather than a port, because the runner is not
# necessarily on this machine — `comp-goalrun --checks-url` points the gate at a
# second box, and the egress allow-list has to name whatever host that is or the
# call is refused before it leaves (ADR-0008).
#
# The gate's token is a SECRET, never config: the thing it authenticates to runs
# commands, so a bearer token in a config map that every debug endpoint dumps is
# a remote code execution with extra steps. Always granted — the runner mints one
# even for a loopback gate, so there is one code path rather than an
# authenticated one nobody exercises locally.

version: comp/v1
app: goalrun
tenant: acme
strategy: linked

components:
  - id: probe
    host_needs:
      - wasi:http/incoming-handler

  - id: driver
    host_needs: []

  - id: writer
    host_needs: []

  - id: llm
    config:
      PROVIDER:model: LLM_MODEL
      PROVIDER:max-tokens: "MAX_TOKENS"
      PROVIDER:base-url: LLM_BASE_URL
      PROVIDER:timeout: "LLM_TIMEOUT"
    secrets:
      - key: PROVIDER-api-key
        ref: vault://acme/llmkey
    host_needs:
      - wasi:http/outgoing-handler
      - wasi:config/store
      - comp:secrets/reader
    egress:
      - LLM_HOST

  - id: gate
    config:
      checks-url: CHECKS_URL
    secrets:
      - key: checks-token
        ref: vault://acme/checkstoken
    host_needs:
      - wasi:http/outgoing-handler
      - wasi:config/store
      - comp:secrets/reader
    egress:
      - CHECKS_AUTHORITY

links:
  - from: probe
    import: graph:run/driver@0.2.0
    to: driver
  - from: driver
    import: graph:agent/writer@0.2.0
    to: writer
  - from: driver
    import: graph:fitness/evaluator@0.2.0
    to: gate
  - from: writer
    import: llm:inference/inference@0.1.0
    to: llm

ingress:
  host: goalrun.acme.test
  component: probe
