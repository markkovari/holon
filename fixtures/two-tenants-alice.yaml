# One of TWO tenants sharing a single host process — the isolation measurement
# (ADR-0023). Each tenant is its own file: one app per document reads better and
# stops a converter quietly dropping the second one, which is how this was
# nearly lost.

version: comp/v1
app: probe
tenant: alice
strategy: fused

components:
  - id: adversary
    egress:
      - "127.0.0.1:4222"
      - "localhost:4222"
      - "127.0.0.1:3401"
      - "169.254.169.254:80"
      - "100.64.0.1:3401"
      - "100.127.255.254:80"
      - "10.0.0.1:80"
      - "192.168.1.1:80"
      - "[::1]:4222"
      - "example.com:80"

ingress:
  host: probe.alice.test
  component: adversary
