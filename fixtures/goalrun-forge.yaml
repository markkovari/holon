# The landing graph for a live run: select-probe → graph-selector → github-forge.
#
# The selector picks the winner among the branches and hands ONLY the winner to
# the forge, which opens a real pull request on GitHub. The gate is enforced by
# the shape of `land` (it takes runs, not files), so nothing that failed its
# checks can reach the repository.
#
# The PAT is a secret by reference; the repository and API host are config. Egress
# is api.github.com.
#
# FORGE_REPO is rewritten by the runner (owner/name).

version: comp/v1
app: goalland
tenant: acme
strategy: linked

components:
  - id: sprobe
    host_needs:
      - wasi:http/incoming-handler

  - id: selector
    host_needs: []

  # `land`'s Jev advisory (see `graph-selector`'s module doc) — mocked here for
  # the same reason `goalrun.rs`'s own `artifacts()` defaults to
  # `mock_jev_provider.wasm`: this demo/self-host path stays free and
  # deterministic. A real `typesafe-provider` + a secret is a deployment
  # choice, not this default.
  - id: jev
    config:
      mock-model: mock-jev-1
      mock-script: '{"rules": [{"when": "*", "probability": 0.05}]}'
    host_needs:
      - wasi:config/store

  - id: forge
    config:
      forge-repo: FORGE_REPO
      forge-base: main
      forge-api: https://api.github.com
    secrets:
      - key: forge-token
        ref: vault://acme/forge
    host_needs:
      - wasi:http/outgoing-handler
      - wasi:config/store
      - comp:secrets/reader
    egress:
      - api.github.com

links:
  - from: sprobe
    import: graph:select/selector@0.2.0
    to: selector
  - from: selector
    import: git:forge/repo@0.1.0
    to: forge
  - from: selector
    import: jev:decision/decision@0.1.0
    to: jev

ingress:
  host: goalland.acme.test
  component: sprobe
