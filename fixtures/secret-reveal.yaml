# One component granted one secret by REFERENCE. The value appears nowhere in this
# file and never will (ADR-0010) — the platform resolves the reference, the host
# fetches it on the first reveal, and the manifest holds a pointer.

version: comp/v1
app: probe
tenant: acme
strategy: linked

components:
  - id: gate
    secrets:
      - key: stripe
        ref: vault://acme/stripe
    # Normally stamped from the component's WIT by `wit-reflect`, never authored.
    # Written out here because it is what makes the host check its capability list,
    # and `comp:secrets/reader` being ON that list is half of what is under test.
    host_needs:
      - comp:secrets/reader

ingress:
  host: probe.acme.test
  component: gate
