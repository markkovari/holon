# A probe wired to `openai-provider`, and the provider's API key in the vault.
#
# The key appears nowhere in this file, which is the whole point: `secrets` holds
# a REFERENCE the platform resolves (ADR-0010), and a manifest that carried the
# token would be a manifest that leaks it to everything that can read a
# deployment. `config` holds the things that are genuinely deployment choices —
# which endpoint, which model.
#
# `base-url` carries a placeholder port. The test rewrites it, because the
# stand-in provider it starts binds whatever port was free.

version: comp/v1
app: llm
tenant: acme
strategy: linked

components:
  - id: gate
    host_needs:
      - wasi:http/incoming-handler

  - id: llm
    config:
      openai:base-url: http://127.0.0.1:OPENAI_PORT/v1
      openai:model: gpt-4o-mini
    secrets:
      - key: openai-api-key
        ref: vault://acme/openai
    host_needs:
      - wasi:http/outgoing-handler
      - wasi:config/store
      - comp:secrets/reader
    egress:
      - 127.0.0.1:OPENAI_PORT

links:
  - from: gate
    import: llm:inference/inference@0.1.0
    to: llm

ingress:
  host: llm.acme.test
  component: gate
