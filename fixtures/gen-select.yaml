# A probe → selector → github-forge, and the forge's token in the vault.
#
# The selector sits between the probe and the forge on purpose. The assertion
# this deployment exists for is a NEGATIVE one — when no branch passed its gate,
# the forge must see no request at all — and that is only checkable with a real
# forge behind a real selector, because a component that never dialled out looks
# identical to one that was never asked to.
#
# The token appears nowhere in this file. It can push code, so it is the last
# thing that belongs in a manifest (ADR-0010) — `secrets` carries a reference the
# platform resolves. `config` carries the deployment choices: which repository,
# which API host, which base branch.
#
# `forge-api` holds a placeholder port. The test rewrites it, because the stand-in
# forge it starts binds whatever port was free.

version: comp/v1
app: genselect
tenant: acme
strategy: linked

components:
  - id: sprobe
    host_needs:
      - wasi:http/incoming-handler

  - id: gforge
    config:
      forge-repo: acme/widgets
      forge-base: main
      forge-api: http://127.0.0.1:FORGE_PORT
    secrets:
      - key: forge-token
        ref: vault://acme/forge
    host_needs:
      - wasi:http/outgoing-handler
      - wasi:config/store
      - comp:secrets/reader
    egress:
      - 127.0.0.1:FORGE_PORT

  - id: gselect
    host_needs: []

links:
  - from: sprobe
    import: graph:select/selector@0.1.0
    to: gselect
  - from: gselect
    import: git:forge/repo@0.1.0
    to: gforge

ingress:
  host: genselect.acme.test
  component: sprobe
