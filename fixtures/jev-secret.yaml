version: comp/v1
app: jev
tenant: acme
strategy: linked

components:
  - id: router
    host_needs:
      - wasi:http/incoming-handler
  - id: jev
    config:
      typesafe:base-url: https://api.typesafe.ai
    secrets:
      - key: typesafe-api-key
        ref: vault://acme/typesafe
    host_needs:
      - wasi:http/outgoing-handler
      - wasi:config/store
      - comp:secrets/reader
    egress:
      - api.typesafe.ai:443

links:
  - from: router
    import: jev:decision/decision@0.1.0
    to: jev

ingress:
  host: jev.acme.test
  component: router
