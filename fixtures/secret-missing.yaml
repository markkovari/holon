# The same app, granted a reference the vault does not hold — a secret that was
# deleted, renamed, or never created.
#
# ADR-0013's rule is that omission fails closed AT START. This must therefore never
# serve: the alternative is an instance that runs fine until the first request that
# happens to reach the reveal, which is the failure the rule exists to prevent.

version: comp/v1
app: probe
tenant: acme
strategy: linked

components:
  - id: gate
    secrets:
      - key: stripe
        ref: vault://acme/gone
    host_needs:
      - comp:secrets/reader

ingress:
  host: gone.acme.test
  component: gate
