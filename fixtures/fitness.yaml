# A probe wired to `checks-runner`, and the runner pointed at `comp-checks`.
#
# The split this fixture demonstrates is the whole design of the gate: all of the
# JUDGEMENT is in a component — what is required, what a score means — and all of
# the PROCESS SPAWNING is in a native runner, because a component cannot do it and
# should not pretend to. The component reaches it the way it reaches a database or
# a model provider: over HTTP, through an egress allow-list it did not write
# (ADR-0008).
#
# `checks-url` carries a placeholder port. The test rewrites it, because the
# runner it starts binds whatever port was free.
#
# `checks-token` is a SECRET, never config: the thing on the other end runs
# commands, so a bearer token in a config map that every debug endpoint dumps is
# a remote code execution with extra steps. Granted here in every case — an EMPTY
# grant is how "this runner wants no token" is spelled, so there is one wiring
# rather than two, and the component decides by whether the value is empty.

version: comp/v1
app: fitness
tenant: acme
strategy: linked

components:
  - id: gate
    host_needs:
      - wasi:http/incoming-handler

  - id: fitness
    config:
      checks-url: http://127.0.0.1:CHECKS_PORT/check
    secrets:
      - key: checks-token
        ref: vault://acme/checkstoken
    host_needs:
      - wasi:http/outgoing-handler
      - wasi:config/store
      - comp:secrets/reader
    egress:
      - 127.0.0.1:CHECKS_PORT

links:
  - from: gate
    import: graph:fitness/evaluator@0.2.0
    to: fitness

ingress:
  host: fitness.acme.test
  component: gate
