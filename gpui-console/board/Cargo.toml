[package]
name = "agent-board"
version = "0.1.0"
edition = "2021"
publish = false
description = "The agent board (ADR-0119): the sessions, the tree of agents and coding sessions each goal started, the components and what the goal runs left, drawn with GPUI. Builds natively and for a browser, so it takes what happened as agent-wire's data and not agent-runtime's."

[lib]
name = "agent_board"
path = "src/lib.rs"

[[bin]]
name = "agents-board"
path = "src/bin/agents_board.rs"

[dependencies]
agent-wire = { path = "../../crates/agent-wire" }
comp-fuel = { path = "../../reconciler/fuel" }
# exact: snapshots break weekly; font-kit or macOS draws no text
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["runtime_shaders", "font-kit"] }
anyhow = "1"
serde_json = "1"
web-time = "1"
gif = "0.14"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Request", "RequestInit", "Response", "Headers"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
png = "0.17"

[dev-dependencies]
tempfile = "3"
