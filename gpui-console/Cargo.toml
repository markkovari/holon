[package]
name = "gpui-console"
version = "0.1.0"
edition = "2021"
publish = false
description = "A GPUI desktop console for the lattice's dynamic agent CRUD: lists deployed agents, spawns new ones live via platform-domain, and shows each one's last output. Boots its own local dev lattice (reconciler/src/fleet.rs's Fleet) on launch."

# Native, and deliberately outside the components/ (wasm32) workspace — same
# arrangement as cli/, host/ and reconciler/. Path-depends on comp-reconciler,
# which is its own [workspace] root too; Cargo does not merge the two.
[workspace]

[[bin]]
name = "gpui-console"
path = "src/main.rs"

[dependencies]
comp-reconciler = { path = "../reconciler" }
# `runtime_shaders`: this machine has only Xcode Command Line Tools, not full
# Xcode.app, so `xcrun metal` (gpui's default AOT shader compile) isn't
# available at build time. This feature defers shader compilation to runtime
# instead, which needs no `xcrun metal` — no functional difference otherwise.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
