[package]
name = "gpui-console"
version = "0.1.0"
edition = "2021"
publish = false
description = "A GPUI desktop console for autonomous agents: create them with capabilities and schedule/event triggers, watch them work, approve what they ask to do. Boots its own local dev lattice (reconciler/fleet/src/fleet.rs's Fleet) and embeds the agent runtime."

# native, so outside the components/ (wasm32) workspace, like cli/, host/ and reconciler/
[workspace]
members = ["board"]

[[bin]]
name = "gpui-console"
path = "src/main.rs"

[dependencies]
holon-fleet = { path = "../reconciler/fleet" }
agent-runtime = { path = "../agent-runtime" }
agent-board = { path = "board" }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["runtime_shaders", "font-kit"] }
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
