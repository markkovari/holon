[package]
name = "gpui-console"
version = "0.1.0"
edition = "2021"
publish = false
description = "A GPUI desktop console for autonomous agents: create them with capabilities and schedule/event triggers, watch them work, approve what they ask to do. Boots its own local dev lattice (reconciler/fleet/src/fleet.rs's Fleet) and embeds the agent runtime."

# Native, and deliberately outside the components/ (wasm32) workspace — same
# arrangement as cli/, host/ and reconciler/. Path-depends on comp-fleet, which is a
# member of reconciler/'s [workspace]; Cargo does not merge the two.
[workspace]

[lib]
name = "gpui_console"
path = "src/lib.rs"

[[bin]]
name = "gpui-console"
path = "src/main.rs"

[[bin]]
name = "agents-board"
path = "src/bin/agents_board.rs"

[dependencies]
comp-fleet = { path = "../reconciler/fleet" }
# Prices a run's tokens the way the session daemon prices its own (`cost_usd_micros`).
comp-fuel = { path = "../reconciler/fuel" }
# Agents are specs + a tool-using loop + triggers, run by this crate (also
# available headless as `agent-runtime`). The console embeds it in-process.
agent-runtime = { path = "../agent-runtime" }
# `runtime_shaders`: this machine has only Xcode Command Line Tools, not full
# Xcode.app, so `xcrun metal` (gpui's default AOT shader compile) isn't
# available at build time. This feature defers shader compilation to runtime
# instead, which needs no `xcrun metal` — no functional difference otherwise.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# For the spawn-progress channel: the background build/upload/deploy work
# reports checkpoints ("building…", "deploying…") back to the foreground
# entity as they happen, rather than only a single result at the end.
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# The board's own screenshots (src/capture.rs): a process may read back its OWN windows without the
# Screen Recording permission another process would need, so the capture is made from inside.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
png = "0.17"
