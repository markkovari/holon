[package]
name = "selfhost"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Renders an app spec into systemd + a per-app URL for the comp-host lane (tier 1 of docs/SELFHOST.md). The same spec is what the Kubernetes lane consumes later."

# Native, and deliberately outside the components/ (wasm32) workspace — same reason
# as host/ and applier/.
[workspace]

[[bin]]
name = "selfhost"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
