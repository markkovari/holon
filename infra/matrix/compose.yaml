# A private Matrix homeserver for talking to agents from Element X / Element.
# Bound to loopback only: it is exposed to your devices through `tailscale
# serve` (see tailscale.sh), never to the LAN or the internet.
services:
  synapse:
    image: matrixdotorg/synapse:${SYNAPSE_TAG:-latest}
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${SYNAPSE_PORT:-8008}:8008"
