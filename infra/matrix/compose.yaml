# A private Matrix homeserver for talking to agents from Element X / Element.
# Bound to loopback only: it is exposed to your devices through `tailscale
# serve` (see tailscale.sh), never to the LAN or the internet.
services:
  synapse:
    image: matrixdotorg/synapse:${SYNAPSE_TAG:-latest}
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./data:/data
    # So an appservice running on the host (the bridge) is reachable as
    # host.docker.internal on Docker Desktop, OrbStack and Linux alike.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${SYNAPSE_PORT:-8008}:8008"
