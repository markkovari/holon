[package]
name = "holon-plug"
description = "Derives a WASM component composition from binary imports and exports via wac-graph and wasmparser (ADR-0087, ADR-0115)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sha2.workspace = true
# wasmparser is pinned to the one wac-graph carries (0.10 reads with 0.247): two component-model
# readers in one graph is a type error waiting to happen; tests/workspace.rs fails when it is two.
wac-graph = "0.10"
wasmparser.workspace = true
