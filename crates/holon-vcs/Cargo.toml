[package]
name = "holon-vcs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "An agent-native code store: an operation log over a commutative, symbol-level patch graph (ADR-0099)."

# default is I/O-free so it builds for wasm32-wasip2; native adds the NATS/SurrealDB adapters (ADR-0095).
[features]
default = []
native = ["dep:tokio", "dep:async-nats", "dep:surrealdb", "dep:futures"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha1.workspace = true
hex.workspace = true
base64.workspace = true
thiserror.workspace = true
syn.workspace = true
proc-macro2.workspace = true
quote.workspace = true

tokio = { workspace = true, optional = true }
async-nats = { workspace = true, optional = true }
surrealdb = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
