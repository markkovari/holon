[package]
name = "holon-vcs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "An agent-native code store: an operation log over a commutative, symbol-level patch graph (ADR-0099)."

# Two layers, one crate:
#
#   default     the core — patch algebra, conflict detection, the oplog — over
#               storage TRAITS. No I/O, no async runtime, so it compiles for
#               wasm32-wasip2 and runs inside a component.
#   native      the adapters behind those traits: NATS JetStream ObjectStore (blobs)
#               and KV (CAS pointers), and SurrealDB (the symbol/patch graph).
#               Sockets and a runtime, so native only (ADR-0095).
[features]
default = []
native = ["dep:tokio", "dep:async-nats", "dep:surrealdb", "dep:futures"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true

tokio = { workspace = true, optional = true }
async-nats = { workspace = true, optional = true }
surrealdb = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
