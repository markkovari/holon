[package]
name = "holon-park"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A durable record of an outstanding call, instead of a thread blocked on its answer (ADR-0100)."

# Two layers, one crate — the same split as `holon-vcs` and for the same
# reason (its Cargo.toml's own comment):
#
#   default     the engine and the wire format, over the `ParkStore` trait. No
#               I/O, no async runtime: compiles for wasm32-wasip2 too.
#   native      the adapter behind that trait — JetStream KV for ticket
#               records and the `PARK_WAKE` work-queue stream. A socket and a
#               runtime, so native only (ADR-0095).
[features]
default = []
native = ["dep:tokio", "dep:async-nats", "dep:futures"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true

tokio = { workspace = true, optional = true }
async-nats = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
