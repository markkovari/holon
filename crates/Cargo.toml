# Libraries that are neither a component nor a native binary, and are built for
# BOTH targets: `wasm32-wasip2` (inside a component) and the host (inside a daemon
# or a test). Its own workspace root, like host/, lattice/, reconciler/ and cli/.
#
#   cargo test  --manifest-path crates/Cargo.toml --features holon-vcs/native
#   cargo build --manifest-path crates/Cargo.toml --target wasm32-wasip2
[workspace]
resolver = "2"
members = ["holon-vcs", "holon-park"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
# the wire format's bytes (src/wire.rs)
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
thiserror = "2"
# symbol extraction (src/extract.rs): syn for Rust, with real byte offsets —
# `span-locations`, and no `proc-macro` feature, so spans are always the
# pure-Rust fallback and work outside a macro and on wasm32-wasip2.
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing"] }
proc-macro2 = { version = "1.0.91", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
# native only — see holon-vcs's `native` feature
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }
async-nats = "0.50"
surrealdb = { version = "3.3", default-features = false, features = ["protocol-ws", "rustls"] }
futures = "0.3"
