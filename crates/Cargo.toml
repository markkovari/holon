# Built for both wasm32-wasip2 (inside a component) and the host (daemon, tests).
[workspace]
resolver = "2"
members = ["holon-vcs", "holon-park", "holon-llm", "agent-wire"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
thiserror = "2"
# span-locations without proc-macro: spans use the pure-Rust fallback, so they work on wasm32-wasip2.
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing"] }
proc-macro2 = { version = "1.0.91", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }
# Must match the async-nats the host's wRPC transport uses (tests/workspace.rs checks the locks).
async-nats = "0.49"
surrealdb = { version = "3.3", default-features = false, features = ["protocol-ws", "rustls"] }
futures = "0.3"
