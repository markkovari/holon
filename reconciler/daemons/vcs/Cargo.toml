[package]
name = "comp-vcs"
description = "The agent-native code store (docs/adr/0099): the holon-vcs engine's NATS and SurrealDB adapters behind loopback HTTP, for components/vcs-store."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
holon-daemon-kit.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
# The code store's engine and its native adapters. Its surrealdb rides along; its NATS client is
# the workspace's own version, because there is one async-nats everywhere (tests/workspace.rs).
holon-vcs = { path = "../../../crates/holon-vcs", features = ["native"] }

# tests/e2e_vcs.rs drives the real binary through comp-host, NATS and SurrealDB, with the gate
# harness the root's suites share (tests/gatelib/mod.rs, included by path), which signs a TOTP
# code with hmac and sha1 and talks to the host with a blocking reqwest client.
[dev-dependencies]
holon-fleet.workspace = true
hmac.workspace = true
reqwest.workspace = true
sha1.workspace = true
