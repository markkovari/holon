[package]
name = "comp-agent"
description = "The pull half of continuous deployment: reads a digest lock and updates the apps this box already runs. No inbound port, and no CI credential on this network (docs/adr/0006, docs/adr/0096). std only, no dependencies."
version.workspace = true
edition.workspace = true
publish.workspace = true

# No dependencies: it reads a file, runs `comp-oci` and `systemctl`, and writes a file. A box that
# only deploys has no reason to compile a tree of crates for that (docs/adr/0115).
