[package]
name = "holon-mdns"
description = "What a device is announcing on the local network, for a component that cannot browse mDNS. Fronts components/mdns-discovery (docs/adr/0095, ADR-0118)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "holon-mdns"
path = "src/main.rs"

[dependencies]
holon-daemon-kit.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
mdns-sd = "0.11"  # browses mDNS/DNS-SD
