[package]
name = "holon-clipboard"
description = "The desktop clipboard, for a component that has no session. Fronts components/desktop-clipboard (docs/adr/0095, ADR-0118)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "holon-clipboard"
path = "src/main.rs"

[dependencies]
holon-daemon-kit.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
arboard = "3"  # reads the desktop clipboard
