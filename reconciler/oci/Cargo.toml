[package]
name = "comp-oci"
description = "Artifacts by digest: the pull and the push of a wasm component as an OCI artifact over plain HTTP, and the content addressing around them (docs/adr/0006, docs/adr/0024). No registry crate: four calls on the reqwest client."
version.workspace = true
edition.workspace = true
publish.workspace = true

# A library, so the reconciler can pull and the loop's tools can name an artifact without either
# depending on the other (docs/adr/0115). The `comp-oci` command line, which also composes, stays
# with the binaries that need `comp-fleet` for it.
[dependencies]
anyhow.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
# The OCI tests stand up a fake registry with axum.
axum.workspace = true
tokio.workspace = true
