[package]
name = "comp-reconciler"
version = "0.1.0"
edition = "2021"
publish = false
description = "Diffs desired manifests against observed lattice inventory and issues start/stop commands over NATS. Holds the lattice credential; holds no business logic (docs/adr/0022)."

# A NATIVE binary, deliberately outside the components/ (wasm32) workspace — same
# arrangement as host/. It exists because a wasm component has no background: this
# needs a held subscription and a timer. Same reason `applier` existed (ADR-0003),
# different dangerous credential.
[workspace]

[lib]
name = "comp_reconciler"
path = "src/lib.rs"

[[bin]]
name = "comp-reconciler"
path = "src/main.rs"

[[bin]]
name = "comp-ingress"
path = "src/bin/ingress.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
# The fabric, as traits. The reconciler holds `Arc<dyn ...>` and never names a
# broker; `--nats-url` selects the one implementation that ships.
comp-lattice = { path = "../lattice" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_norway = "0.9"
tempfile = "3"
# comp-stub serves HTTP; the OCI test also stands up a fake registry with it.
axum = "0.8"
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# For content addressing. The optional OCI mirror push is four HTTP calls on the
# reqwest client we already have, so it needs no registry crate — see src/oci.rs.
sha2 = "0.10"

# comp-ingress: terminates HTTP and spreads it across an app's replicas. A second
# binary here rather than a sixth crate, because it needs exactly two things this
# crate already has — the NodeInventory shape and the lattice client.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"

async-trait = "0.1"

[dev-dependencies]
# The publisher side of ADR-0073: a test has to SIGN, which means holding a
# private key the platform never sees.
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }

[[bin]]
name = "comp-stub"
path = "src/bin/stub.rs"

# The one part of the loop that genuinely needs an operating system: a gate has
# to run the project's own tests, and a component cannot spawn a process.
[[bin]]
name = "comp-checks"
path = "src/bin/checks.rs"

[[bin]]
name = "comp-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "comp-matrix"
path = "src/bin/matrix.rs"

[[bin]]
name = "comp-hopcost"
path = "src/bin/hopcost.rs"

[[bin]]
name = "comp-planscale"
path = "src/bin/planscale.rs"
