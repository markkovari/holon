[package]
name = "comp-reconciler"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Diffs desired manifests against observed lattice inventory and issues start/stop commands over NATS. Holds the lattice credential; holds no business logic (docs/adr/0022)."

# A NATIVE binary, deliberately outside the components/ (wasm32) workspace — same
# arrangement as host/. It exists because a wasm component has no background: this
# needs a held subscription and a timer. Same reason `applier` existed (ADR-0003),
# different dangerous credential.
#
# This directory is a workspace of single-purpose packages, not one crate with a long
# list of bins (docs/adr/0115): a package's `[dependencies]` are built for ANY of its
# targets, so `cargo build --bin comp-mailrelay` — std only — used to compile bollard,
# image, headless_chrome and the rest first. A daemon now lives in `daemons/<name>/`
# with its one heavy crate, and what several of them share is a package of its own.
#
# The packages are members of the repository's root workspace: one lockfile and one `target/`, at the root.
[lib]
name = "comp_reconciler"
path = "src/lib.rs"

[[bin]]
name = "comp-reconciler"
path = "src/main.rs"

[[bin]]
name = "comp-ingress"
path = "src/bin/ingress.rs"


[dependencies]
tokio.workspace = true
# The fabric, as traits. The reconciler holds `Arc<dyn ...>` and never names a
# broker; `--nats-url` selects the one implementation that ships.
comp-lattice.workspace = true
serde.workspace = true
toml.workspace = true
serde_norway = "0.9"
# comp-stub serves HTTP; the OCI test also stands up a fake registry with it.
axum.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
# Artifacts by digest (oci/): `comp_reconciler::oci` is the crate, re-exported.
holon-oci.workspace = true

# comp-ingress: terminates HTTP and spreads it across an app's replicas. A second
# binary here rather than a sixth crate, because it needs exactly two things this
# crate already has — the NodeInventory shape and the lattice client.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes.workspace = true

async-trait = "0.1"

# What only the suites use, which is most of what this package once declared: the shared
# harness and gate library (tests/harness, tests/gatelib), JetStream for juan_live, and the
# TOTP gate's HMAC-SHA1 (RFC 6238 fixes the algorithm; there is no newer one to prefer).
[dev-dependencies]
# The fleet harness the suites start a platform with, and the composition it needs (fleet/): the
# wasm toolchain lives there, with the pin that explains it, and is not in this package's own tree.
comp-fleet.workspace = true
async-nats.workspace = true
futures.workspace = true
hmac.workspace = true
rusty-s3.workspace = true
sha1.workspace = true
sha2.workspace = true
tempfile.workspace = true
miniz_oxide = "0.8"
# The publisher side of ADR-0073: a test has to SIGN, which means holding a
# private key the platform never sees.
p256 = { version = "0.13", features = ["ecdsa"] }
base64.workspace = true
rand_core = { version = "0.6", features = ["getrandom"] }

[[bin]]
name = "comp-stub"
path = "src/bin/stub.rs"

# The one part of the loop that genuinely needs an operating system: a gate has
# to run the project's own tests, and a component cannot spawn a process.
[[bin]]
name = "comp-checks"
path = "src/bin/checks.rs"

[[bin]]
name = "comp-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "comp-planscale"
path = "src/bin/planscale.rs"

