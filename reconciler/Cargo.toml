[package]
name = "comp-reconciler"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Diffs desired manifests against observed lattice inventory and issues start/stop commands over NATS. Holds the lattice credential; holds no business logic (docs/adr/0022)."

# A NATIVE binary, deliberately outside the components/ (wasm32) workspace — same
# arrangement as host/. It exists because a wasm component has no background: this
# needs a held subscription and a timer. Same reason `applier` existed (ADR-0003),
# different dangerous credential.
#
# This directory is a workspace of single-purpose packages, not one crate with forty
# bins (docs/adr/0115): a package's `[dependencies]` are built for ANY of its targets,
# so `cargo build --bin comp-mailrelay` — std only — used to compile bollard, image,
# headless_chrome and the rest first. A daemon now lives in `daemons/<name>/` with its
# one heavy crate, and what several of them share is a package of its own.
#
# `default-members` lists every package, so everything that says `cd reconciler &&
# cargo build --bin comp-x`, `--test x` or `clippy` — CI, the release and Docker builds,
# the e2e scripts, xtask — means what it always did. One lockfile, and one `target/` here:
# the 100-odd paths to `reconciler/target/release/comp-*` are unchanged.
[workspace]
resolver = "2"
members = ["daemons/*"]
default-members = [".", "daemons/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# What more than one package here needs, said once, so the versions cannot drift apart.
[workspace.dependencies]
axum = { version = "0.8", features = ["http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "process", "sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
image = "0.25"
comp-daemon-kit = { path = "daemons/kit" }

[lib]
name = "comp_reconciler"
path = "src/lib.rs"

[[bin]]
name = "comp-reconciler"
path = "src/main.rs"

[[bin]]
name = "comp-ingress"
path = "src/bin/ingress.rs"

# A shim over src/plug.rs, for gates — which are shell scripts and cannot call a
# Rust function. The composition itself is the library.
[[bin]]
name = "comp-oci"
path = "src/bin/oci.rs"

[[bin]]
name = "comp-offpeak"
path = "src/bin/offpeak.rs"

[[bin]]
name = "comp-plug"
path = "src/bin/plug.rs"

# Write one run's history, so the console's browser test has a run to look at.
[[bin]]
name = "comp-trace-seed"
path = "src/bin/traceseed.rs"

[[bin]]
name = "comp-relay"
path = "src/bin/relay.rs"

# HTTP in, real SMTP out — what lets a wasm component reach MailHog, since the host
# wires no wasi:sockets and MailHog ingests SMTP only. std-only, no dependencies.
[[bin]]
name = "comp-mailrelay"
path = "src/bin/mailrelay.rs"

# The pull half of continuous deployment: reads a digest lock and updates the apps
# this box already runs. No inbound port, and no CI credential on this network.
[[bin]]
name = "comp-agent"
path = "src/bin/agent.rs"

# Drains a project's goal queue, N runs at a time (ADR-0082's missing loop).
[[bin]]
name = "comp-goald"
path = "src/bin/goald.rs"

# The capability graph: who imports what from whom, derived from the artifacts.
[[bin]]
name = "comp-capgraph"
path = "src/bin/capgraph.rs"

# What a goal's app is made of, and how much of it the run had to write —
# formerly tools/reuse-ratio.py.
[[bin]]
name = "comp-reuse-ratio"
path = "src/bin/reuseratio.rs"

# The component catalogue, derived from the SOURCES. Deliberately a second binary
# rather than a `--format` on capgraph: that one reads built artifacts and answers
# what a component really imports, this reads sources and answers what it is FOR, and
# a component that does not build has the second and not the first.
[[bin]]
name = "comp-catalog"
path = "src/bin/catalog.rs"


[dependencies]
comp-metadata = { path = "../comp-metadata" }
# The shared-secret check the ADR-0095 daemons put in front of their loopback HTTP.
comp-daemon-kit.workspace = true
tokio.workspace = true
# The fabric, as traits. The reconciler holds `Arc<dyn ...>` and never names a
# broker; `--nats-url` selects the one implementation that ships.
comp-lattice = { path = "../lattice" }
futures.workspace = true
serde.workspace = true
toml = "0.8"
serde_norway = "0.9"
tempfile = "3"
# comp-stub serves HTTP; the OCI test also stands up a fake registry with it.
axum.workspace = true
serde_json.workspace = true
regex = "1"
anyhow.workspace = true
# Capability versions are semver, so the self-improve gate orders them by
# major/minor/patch rather than as strings ("2.0.0" > "10.0.0" the wrong way).
semver = "1"
clap.workspace = true
reqwest.workspace = true
# For content addressing. The optional OCI mirror push is four HTTP calls on the
# reqwest client we already have, so it needs no registry crate — see src/oci.rs.
sha2 = "0.10"
# HMAC-SHA1, for the one gate that computes a TOTP code from the secret the part
# provisions. RFC 6238 fixes the algorithm; there is no newer one to prefer.
sha1 = "0.10"
hmac = "0.12"
# Composition as a library call (src/plug.rs): `wac` is a crate before it is a
# command. Pinned to the pair `components/wit-reflect` uses — wac-graph carries
# its own wasmparser, and two versions of the component model in one graph is a
# type error waiting to happen.
wac-graph = "0.10"
wasmparser = "0.244"

# comp-ingress: terminates HTTP and spreads it across an app's replicas. A second
# binary here rather than a sixth crate, because it needs exactly two things this
# crate already has — the NodeInventory shape and the lattice client.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"

async-trait = "0.1"

# The daemons that have not moved out yet (docs/adr/0115) — the twelve behind the
# ADR-0095 capabilities each have a package of their own in daemons/. What is below
# is used by comp-media, comp-backup, comp-vcs, comp-park, comp-resume and comp-agentd.
image.workspace = true   # comp-media: encodes and resizes a developed photo
# comp-media (ADR-0098): decodes camera raw, signs S3 requests, holds the
# MEDIA_JOBS work queue. rusty-s3 is sans-IO — it signs, the reqwest client we
# already have sends — so there is no second HTTP stack and no SDK. async-nats
# is pinned to lattice's version so the two never disagree about the protocol.
rawler = "0.8"
rusty-s3 = "0.10"
async-nats = "0.49"
md-5 = "0.10"          # comp-media: PutBucketCors requires a Content-MD5
base64 = "0.22"
kamadak-exif = "0.6"   # comp-media: EXIF of a JPEG original (bounds-checked; rawler's TIFF reader is not)
# comp-backup: JetStream streams and SurrealDB exports to S3/R2, gzip'd and
# sealed. ChaCha20-Poly1305 because `secrets-vault` already trusts it; jiff is
# already in the tree through rusty-s3 and names each backup by its UTC time.
flate2 = "1"
chacha20poly1305 = "0.10"
getrandom = "0.2"
jiff = "0.2"
hex = "0.4"
# comp-vcs (ADR-0099): the code store's engine and its native adapters. Its own
# async-nats (0.50) and surrealdb ride along; the engine never shares a client
# with the rest of this crate.
holon-vcs = { path = "../crates/holon-vcs", features = ["native"] }
# comp-park (ADR-0100): a durable record of an outstanding call, over JetStream
# KV and the PARK_WAKE work-queue stream. No SurrealDB — unlike vcs, there is
# no graph here, one ticket is one mutable record.
holon-park = { path = "../crates/holon-park", features = ["native"] }
# comp-agentd (ADR-0102): the gRPC half of api/holon/v1/agent.proto, served on
# the same port as the REST half. tonic is already in the tree (surrealdb).
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-web = "0.14"

[build-dependencies]
# build.rs: agent.proto -> Rust, with protox standing in for protoc.
tonic-prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
miniz_oxide = "0.8"
# The publisher side of ADR-0073: a test has to SIGN, which means holding a
# private key the platform never sees.
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }

[[bin]]
name = "comp-stub"
path = "src/bin/stub.rs"

[[bin]]
name = "comp-goalrun"
path = "src/bin/goalrun.rs"

# The one part of the loop that genuinely needs an operating system: a gate has
# to run the project's own tests, and a component cannot spawn a process.
[[bin]]
name = "comp-checks"
path = "src/bin/checks.rs"

[[bin]]
name = "comp-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "comp-matrix"
path = "src/bin/matrix.rs"

[[bin]]
name = "comp-hopcost"
path = "src/bin/hopcost.rs"

[[bin]]
name = "comp-planscale"
path = "src/bin/planscale.rs"

[[bin]]
name = "comp-selfimprove"
path = "src/bin/selfimprove.rs"

[[bin]]
name = "comp-photoserve"
path = "src/bin/photoserve.rs"

[[bin]]
name = "comp-contrastserve"
path = "src/bin/contrastserve.rs"

# Uploads, evaluates and renders large photos by key (ADR-0098). The only
# daemon with a queue of its own: the Mac's GPU is the bottleneck, one photo at
# a time.
[[bin]]
name = "comp-media"
path = "src/bin/media.rs"

# Backs up JetStream streams (KV buckets, object stores, queues) and SurrealDB
# databases to an S3-compatible bucket, and restores them.
[[bin]]
name = "comp-backup"
path = "src/bin/backup.rs"

# The agent-native code store (ADR-0099): the engine's NATS + SurrealDB
# adapters behind loopback HTTP, for `components/vcs-store`.
[[bin]]
name = "comp-vcs"
path = "src/bin/vcs.rs"

# A durable record of an outstanding call, instead of a thread blocked on its
# answer (ADR-0100), for `components/park-store`.
[[bin]]
name = "comp-park"
path = "src/bin/park.rs"

# The resumer ADR-0100 left unbuilt (ADR-0106): delivers resolved tickets to
# whatever drives the turn, and gives up on the calls that never answered.
[[bin]]
name = "comp-resume"
path = "src/bin/resume.rs"

[[bin]]
name = "comp-agentd"
path = "src/bin/agentd.rs"
