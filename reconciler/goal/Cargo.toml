[package]
name = "holon-goal"
description = "The goal loop: generate candidates, join the parts of a decomposed goal, judge them through a gate, remember what each attempt taught, and the tools that drive it and read what it left (docs/adr/0081 to 0092)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "comp-goald"
path = "src/bin/goald.rs"

[[bin]]
name = "comp-goalrun"
path = "src/bin/goalrun.rs"

[[bin]]
name = "comp-selfimprove"
path = "src/bin/selfimprove.rs"

[[bin]]
name = "comp-offpeak"
path = "src/bin/offpeak.rs"

[[bin]]
name = "comp-trace-seed"
path = "src/bin/traceseed.rs"

[[bin]]
name = "comp-capgraph"
path = "src/bin/capgraph.rs"

# A second binary, not capgraph's `--format`: it reads sources, capgraph reads built artifacts.
[[bin]]
name = "comp-catalog"
path = "src/bin/catalog.rs"

[dependencies]
holon-fleet.workspace = true
holon-fuel.workspace = true
comp-metadata.workspace = true
holon-oci.workspace = true
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
# Versions order by semver, not as strings ("10.0.0" > "2.0.0").
semver = "1"
regex = "1"
rusqlite.workspace = true
async-nats.workspace = true

# The root's shared test harness signs S3 requests.
[dev-dependencies]
rusty-s3.workspace = true
