[package]
name = "comp-fleet"
description = "A fleet of hosts on a NATS lattice to start, drive and read, the composition it needs as a library call, and the two command lines over composition and artifacts. What the integration tests, the benchmarks and the goal loop share (docs/adr/0115)."
version.workspace = true
edition.workspace = true
publish.workspace = true

# A shim over src/plug.rs, for gates — which are shell scripts and cannot call a Rust function.
# The composition itself is the library.
[[bin]]
name = "comp-plug"
path = "src/bin/plug.rs"

# Put a built component in a registry, and get one back out (ADR-0017, ADR-0024). It is here and
# not with the artifacts library because it prints a pulled component's surface, which is
# `plug::surface`, and the library must not carry the wasm toolchain.
[[bin]]
name = "comp-oci"
path = "src/bin/oci.rs"

[dependencies]
comp-lattice.workspace = true
comp-oci.workspace = true
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
# Composition as a library call (src/plug.rs): `wac` is a crate before it is a command. wasmparser is
# pinned to the one wac-graph carries (0.10 reads with 0.247): two versions of the component model's
# reader in one graph is a type error waiting to happen, and was this package's state for as long as
# this pin said 0.244. tests/workspace.rs fails when it is two again.
wac-graph = "0.10"
wasmparser = "0.247"
