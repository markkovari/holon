[package]
name = "holon-fleet"
description = "A fleet of hosts on a NATS lattice to start, drive and read, the composition it needs as a library call, and the two command lines over composition and artifacts. What the integration tests, the benchmarks and the goal loop share (docs/adr/0115)."
version.workspace = true
edition.workspace = true
publish.workspace = true

# A CLI over src/plug.rs for gates, which are shell scripts.
[[bin]]
name = "comp-plug"
path = "src/bin/plug.rs"

# Here, not in the artifacts library, which must not carry the wasm toolchain (`plug::surface`).
[[bin]]
name = "comp-oci"
path = "src/bin/oci.rs"

[dependencies]
comp-lattice.workspace = true
holon-oci.workspace = true
anyhow.workspace = true
base64.workspace = true
getrandom.workspace = true
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
# wasmparser is pinned to the one wac-graph carries (0.10 reads with 0.247): two component-model
# readers in one graph is a type error waiting to happen; tests/workspace.rs fails when it is two.
wac-graph = "0.10"
wasmparser = "0.247"
