[package]
name = "abtest-domain"
description = "A/B/n experiment console with SSE server-push, composing experiment:assign + metrics:collect + event-bus + id-generate (abtest:app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.component]
package = "abtest:component"

[package.metadata.component.target]
path = "wit"
world = "abtest-domain"

[package.metadata.component.target.dependencies]
"experiment:assign" = { path = "../experiment-assign/wit" }
"metrics:collect" = { path = "../metrics-collect/wit" }
"event:bus" = { path = "../event-bus/wit" }
"id:generate" = { path = "../id-generate/wit" }
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:keyvalue" = { path = "../../wit/deps/wasi-keyvalue-0.2.0-draft" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
