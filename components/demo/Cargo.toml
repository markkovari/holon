[package]
name = "demo"
description = "Paging, as a component — one half of a two-part goal (demo:shape)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib for the component, rlib so `tests/paginate.rs` can call `paginate_ids`.
#
# The rlib is load-bearing: that test is a HELD-OUT gate (ADR-0081) and lives in
# `tests/` precisely because the goal's `writable` list does not include it, so a
# candidate cannot make it pass by editing it. Moving it into `src/lib.rs` as a
# unit test would hand it to the model.
#
# The cost is that `cargo test --workspace` on the HOST tries to link libdemo.dylib,
# where this component's wit-bindgen exports are undefined symbols. `just test`
# excludes this crate from the native pass for that reason and runs its held-out
# test on its own.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[package.metadata.component]
package = "demo:component"

[package.metadata.component.target]
path = "wit"
world = "demo"

[package.metadata.component.target.dependencies]
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
