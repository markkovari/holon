[package]
name = "media-pipeline"
description = "media:pipeline — presigned uploads and evaluation jobs, reached over HTTP in comp-media (ADR-0098)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[lib]
crate-type = ["cdylib"]
[dependencies]
wit-bindgen-rt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
[package.metadata.component]
package = "media:pipeline"
[package.metadata.component.target]
path = "wit"
world = "component"

# The daemon is reached over HTTP and told where it is by config — see
# CONTRACT.md and ADR-0098. Both come from the repo-root vendored WASI packages.
[package.metadata.component.target.dependencies]
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
