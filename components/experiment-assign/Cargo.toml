[package]
name = "experiment-assign"
description = "Weighted, sticky, named-variant assignment — the A/B/n primitive (experiment:assign)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[package.metadata.component]
package = "experiment:component"

[package.metadata.component.target]
path = "wit"
world = "experiment-assign"

[package.metadata.component.target.dependencies]
"wasi:keyvalue" = { path = "../../wit/deps/wasi-keyvalue-0.2.0-draft" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
