[package]
name = "park-store"
description = "holon:park/lot for components: each call is one HTTP request to the native comp-park daemon (ADR-0100)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The contract's records as serde types (`holon_park::model`, `::wire`): the
# JSON this component sends comp-park is exactly what the daemon deserializes,
# from ONE definition. Default features only — no I/O, which is what builds
# for wasm32-wasip2 (ADR-0095); nothing here calls the engine.
holon-park = { path = "../../crates/holon-park" }

[package.metadata.component]
package = "holon:park-store"

[package.metadata.component.target]
path = "wit"
world = "component"

[package.metadata.component.target.dependencies]
"holon:park" = { path = "../../wit/park" }
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
