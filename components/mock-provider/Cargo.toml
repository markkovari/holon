[package]
name = "mock-provider"
description = "llm:inference, scripted — deterministic, offline, and unable to reach a network by construction (mock:provider)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[package.metadata.component]
package = "mock:component"

[package.metadata.component.target]
path = "wit"
world = "mock-provider"

[package.metadata.component.target.dependencies]
"llm:inference" = { path = "../llm-inference/wit" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
