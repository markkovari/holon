[package]
name = "rrule"
description = "Expand RFC 5545 recurrence rules (FREQ daily/weekly, INTERVAL, BYDAY, COUNT, UNTIL) to occurrence dates (rrule:recur)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[package.metadata.component]
package = "rrule:component"

[package.metadata.component.target]
path = "wit"
world = "rrule"
