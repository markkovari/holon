[package]
name = "platform-domain"
description = "The multi-tenant wasm deployment platform's control plane: accounts, catalog, deployments, and the manifest renderer (platform:app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
guestio = { path = "../guestio" }
guestfmt = { path = "../guestfmt" }
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# ECDSA P-256 (ADR-0073): the curve auth-guard already verifies ES256 with; pure Rust, so it builds for wasm32-wasip2.
p256 = { workspace = true }
sha2 = { workspace = true }
