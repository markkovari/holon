[package]
name = "vcs-gateway"
description = "holon:vcs/code-store as HTTP routes, for agents and tests: typed JSON in, one import call, typed JSON out (ADR-0099)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
guestio = { path = "../guestio" }
wit-bindgen-rt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# The contract's records as serde types — see vcs-store's Cargo.toml.
holon-vcs = { path = "../../crates/holon-vcs" }

[package.metadata.component]
package = "holon:vcs-gateway"

[package.metadata.component.target]
path = "wit"
world = "gateway"

[package.metadata.component.target.dependencies]
"holon:vcs" = { path = "../../wit/vcs" }
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
