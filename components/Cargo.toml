[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
wit-bindgen-rt = { version = "0.41", features = ["bitflags"] }
# p3 async `generate!` needs 0.58 (cargo-component's 0.41 cannot); the ABI must match comp-host's wasmtime.
wit-bindgen = { version = "0.58.0", features = ["async-spawn", "inter-task-wakeup"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

# Pure-Rust crypto so wasm32-wasip2 builds without `ring` or native openssl.
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10", default-features = false }
# SHA-1: the interoperable default TOTP/HOTP authenticator hash (RFC 6238/4226).
sha1 = { version = "0.10", default-features = false }
# Vetted HMAC, for its constant-time `verify_slice`.
hmac = { version = "0.12", default-features = false }

argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
password-hash = { version = "0.5", default-features = false, features = ["alloc"] }

chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 16

