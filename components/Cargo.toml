[workspace]
resolver = "2"
members = ["photo-critic", "expr", "bigadd", "calc", "glob", "roman", "ordinal", "slug-probe", "capman", "abtest-domain", "accounts-app", "adversary", "agent-driver", "agent-probe", "agent-writer", "ai-inference", "anthropic-provider", "arena-domain", "artifact-cache", "artifact-probe", "audit-log", "auth-guard", "bench-suite", "billing-ledger", "blob-store", "booked-domain", "books-domain", "buzz-domain", "cache", "cache-backing", "checks-runner", "conduit-domain", "config-store", "contract-probe", "contract-registry", "crdt", "cron", "csv", "csv-report", "dashboards-domain", "dev-portal", "driver-probe", "email-render", "eshop-basket", "eshop-catalog", "eshop-gateway", "eshop-ordering", "eshop-payment", "event-bus", "event-pusher", "experiment-assign", "feature-flags", "fitness-probe", "flags-domain", "forge-probe", "fsm-workflow", "gate-domain", "geo", "github-forge", "golem-bridge", "graph-probe", "graph-selector", "helpdesk-domain", "i18n-catalog", "iban", "ical", "id-generate", "idempotency-guard", "inproc-workflow", "jobs-domain", "jsonpatch", "knowledge-graph", "knowledge-memory", "kv-probe", "ledger", "link-shortener", "llm-inference", "llm-probe", "lms-domain", "lock-mutex", "login-app", "markdown", "memory-probe", "mesh-domain", "metrics-collect", "mfa-authgate", "mock-fitness", "mock-provider", "money", "notify-dispatch", "openai-provider", "otp", "outbox", "pagination", "passkey-domain", "paste-bin", "payees-domain", "pdf", "pii-redact", "pipeline-domain", "platform-domain", "policy-guard", "proxy-route", "pulse-domain", "qr", "quiz-grade", "quota", "rate-limiter", "record-store", "resilience", "rot13", "rrule", "saga-domain", "sample-consumer", "scheduler-timer", "scribe-domain", "search-domain", "search-index", "secret-probe", "secrets-vault", "select-probe", "session-store", "shaper", "slug", "stash-domain", "static-assets", "status-page", "studio-domain", "svg-chart", "tempo-domain", "textdiff", "throttle-domain", "track-assets", "track-domain", "transit-domain", "twofile", "upload-drop", "upload-policy", "validate", "version-probe", "vet-domain", "vgit-probe", "virt-git", "webauthn", "webhook-ingest", "webhook-relay", "webhook-sign", "wit-reflect", "zip"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
wit-bindgen-rt = { version = "0.41", features = ["bitflags"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

# Pure-Rust crypto so the component builds clean for wasm32-wasip2 (no `ring`,
# no native openssl). Covers RS256 (rsa+sha2) and ES256 (p256).
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10", default-features = false }
# SHA-1 for TOTP/HOTP (RFC 6238/4226) — the interoperable default authenticator
# hash (Google Authenticator et al.). Used by the `otp` component only.
sha1 = { version = "0.10", default-features = false }
# Vetted RFC2104 HMAC (RustCrypto) — replaces hand-rolled HMAC-SHA256; provides
# constant-time `verify_slice`.
hmac = { version = "0.12", default-features = false }

# Password hashing for local accounts. Pure-Rust, wasm-clean.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
password-hash = { version = "0.5", default-features = false, features = ["alloc"] }

# AEAD for secrets-vault envelope encryption. Pure-Rust, wasm-clean.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
