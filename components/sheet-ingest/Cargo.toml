[package]
name = "sheet-ingest"
description = "a .csv or .xlsx someone exported, turned into header + rows for a bulk insert — composes csv:codec and zip:archive (sheet:ingest)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# rlib so `cargo test` links the crate; the bindings are gated on wasm32 (see `components/demo`).
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[dev-dependencies]
# The spec reads the real `.xlsx` with the composed component's reader, not a test-only one.
zip = { path = "../zip" }

[package.metadata.component]
package = "sheet:component"

[package.metadata.component.target]
path = "wit"
world = "sheet-ingest"

[package.metadata.component.target.dependencies]
"csv:codec" = { path = "../csv/wit" }
"zip:archive" = { path = "../zip/wit" }
