[package]
name = "track-domain"
description = "A Linear-lite project tracker: projects/issues/comments over auth+RBAC, search, an SSE activity feed, background sweeps, signed webhooks, and AI thread-summary (track:app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
guestfmt = { path = "../guestfmt" }
guestio = { path = "../guestio" }
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
