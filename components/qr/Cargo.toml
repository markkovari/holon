[package]
name = "qr"
description = "QR code generation — SVG / unicode / matrix (qr:encode)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }
# Encoder only: the module grid is rendered here, so no renderer features or `image`.
qrcode = { version = "0.14", default-features = false }

[package.metadata.component]
package = "qr:component"

[package.metadata.component.target]
path = "wit"
world = "qr"
