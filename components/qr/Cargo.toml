[package]
name = "qr"
description = "QR code generation — SVG / unicode / matrix (qr:encode)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }
# Vetted pure-Rust QR (Reed-Solomon + masking). Encoder only — we render the
# module grid ourselves (svg/unicode/matrix), so no renderer features / `image`.
qrcode = { version = "0.14", default-features = false }

[package.metadata.component]
package = "qr:component"

[package.metadata.component.target]
path = "wit"
world = "qr"
