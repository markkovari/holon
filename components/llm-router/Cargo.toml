[package]
name = "llm-router"
description = "Smart cascading LLM router with free-tier pool bubbling and circuit breaking (holon:llm-router)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
holon-llm = { path = "../../crates/holon-llm" }

[package.metadata.component]
package = "holon:component"

[package.metadata.component.target]
path = "wit"
world = "llm-router"

[package.metadata.component.target.dependencies]
"llm:inference" = { path = "../llm-inference/wit" }
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
"comp:secrets" = { path = "../../host/wit/deps/comp-secrets" }
