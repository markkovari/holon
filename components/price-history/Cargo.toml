[package]
name = "price-history"
description = "Sparse quotes into a price series, carried never interpolated (price:history)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# rlib too: the held-out spec tests the pure core; testing through bindings would test wit-bindgen.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[package.metadata.component]
package = "price:component"

[package.metadata.component.target]
path = "wit"
world = "price-history"
