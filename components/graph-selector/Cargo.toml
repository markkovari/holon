[package]
name = "graph-selector"
description = "graph:select over git:forge — which branch won, and the only path to a pull request (selector:graph)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[package.metadata.component]
package = "selector:graph"

[package.metadata.component.target]
path = "wit"
world = "graph-selector"

[package.metadata.component.target.dependencies]
"graph:select" = { path = "../graph-select/wit" }
"graph:agent" = { path = "../graph-agent/wit" }
"git:forge" = { path = "../git-forge/wit" }
"llm:inference" = { path = "../llm-inference/wit" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
