[package]
name = "shaper"
description = "Stateless traffic-shaping algorithms — token bucket + GCRA smoothing (shaper:limit)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[package.metadata.component]
package = "shaper:component"

[package.metadata.component.target]
path = "wit"
world = "shaper"
