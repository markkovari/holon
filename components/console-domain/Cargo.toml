[package]
name = "console-domain"
description = "The Holon console: the worklist and goal authoring over the platform API, with a goal's spec proposed to git as a pull request (console:app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.component]
package = "console-app:component"

[package.metadata.component.target]
path = "wit"
world = "console-domain"

[package.metadata.component.target.dependencies]
"ui:assets" = { path = "../console-assets/wit" }
"git:forge" = { path = "../git-forge/wit" }
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
# wasi:http's own world imports these; needed to merge the wasi:http package.
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
