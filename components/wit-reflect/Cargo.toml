[package]
name = "wit-reflect"
description = "Components describe and compose themselves: read a component's real import/export surface, subtype-check a plug against a socket, and compose for real via wac-graph (wit:reflect)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }
sha2 = { workspace = true }
# Pinned to wac-graph's version so the artifact holds exactly one copy.
wasmparser = "0.244"
# `wac`'s own graph and SubtypeChecker, the CLI's code path; pure Rust, builds for wasm32-wasip2.
wac-graph = "0.10"
