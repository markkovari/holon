[package]
name = "billing-ledger"
description = "Billing ledger HTTP component composing money + record-store + idempotency-guard + quota + csv + outbox (ledger:app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
guestio = { path = "../guestio" }
wit-bindgen-rt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.component]
package = "ledger:component"

[package.metadata.component.target]
path = "wit"
world = "ledger-app"

[package.metadata.component.target.dependencies]
"money:amount" = { path = "../money/wit" }
"records:store" = { path = "../record-store/wit" }
"comp:store" = { path = "../../host/wit/deps/comp-store" }
"idempotency:guard" = { path = "../idempotency-guard/wit" }
"quota:meter" = { path = "../quota/wit" }
"csv:codec" = { path = "../csv/wit" }
"outbox:dispatch" = { path = "../outbox/wit" }
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:keyvalue" = { path = "../../wit/deps/wasi-keyvalue-0.2.0-draft" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
