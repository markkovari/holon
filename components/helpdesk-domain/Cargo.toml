[package]
name = "helpdesk-domain"
description = "Helpdesk/ticketing SaaS domain composing auth-guard + record-store + fsm-workflow + id-generate + markdown (helpdesk:app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
guestfmt = { path = "../guestfmt" }
guestio = { path = "../guestio" }
wit-bindgen-rt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.component]
package = "helpdesk:component"

[package.metadata.component.target]
path = "wit"
world = "helpdesk-domain"

[package.metadata.component.target.dependencies]
"auth:identity" = { path = "../../wit" }
# auth.wit's own world imports these; needed to merge the auth:identity package.
"ratelimit:guard" = { path = "../rate-limiter/wit" }
"audit:log" = { path = "../audit-log/wit" }
"policy:guard" = { path = "../policy-guard/wit" }
"quota:meter" = { path = "../quota/wit" }
"event:bus" = { path = "../event-bus/wit" }
"notify:dispatch" = { path = "../notify-dispatch/wit" }
"email:template" = { path = "../email-render/wit" }
"i18n:catalog" = { path = "../i18n-catalog/wit" }
"idempotency:guard" = { path = "../idempotency-guard/wit" }
"webhook:sign" = { path = "../webhook-sign/wit" }
"outbox:dispatch" = { path = "../outbox/wit" }
"mail:parse" = { path = "../mail-parse/wit" }
"webhook:ingest" = { path = "../webhook-ingest/wit" }
"upload:policy" = { path = "../upload-policy/wit" }
"blob:store" = { path = "../blob-store/wit" }
"records:store" = { path = "../record-store/wit" }
"comp:store" = { path = "../../host/wit/deps/comp-store" }
"fsm:workflow" = { path = "../fsm-workflow/wit" }
"id:generate" = { path = "../id-generate/wit" }
"md:render" = { path = "../markdown/wit" }
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:keyvalue" = { path = "../../wit/deps/wasi-keyvalue-0.2.0-draft" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
