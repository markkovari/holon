[package]
name = "portfolio-value"
description = "What a collection is worth, its cost basis and its value series (portfolio:value)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# rlib too: the held-out spec tests the pure core; testing through bindings would test wit-bindgen.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[package.metadata.component]
package = "portfolio:component"

[package.metadata.component.target]
path = "wit"
world = "portfolio-value"
