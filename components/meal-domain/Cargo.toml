[package]
name = "meal-domain"
description = "POST a photo of a meal, get back items, calories and macros (vision:describe + nutrition:meal)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `rlib` as well, so the pure core (routing, media sniffing, rendering, error mapping) is
# unit-tested on the host; the generated bindings are wasm32-only.
crate-type = ["cdylib", "rlib"]

[dependencies]
guestio = { path = "../guestio" }
wit-bindgen-rt = { workspace = true }
serde_json = { workspace = true }

[package.metadata.component]
package = "meal:app"

[package.metadata.component.target]
path = "wit"
world = "meal-domain"

[package.metadata.component.target.dependencies]
"vision:describe" = { path = "../vision-describe/wit" }
"nutrition:meal" = { path = "../meal-estimate/wit" }
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
