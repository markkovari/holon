[package]
name = "driver-probe"
description = "Instrument: does the loop repair, stop on a plateau, and keep its best? (comp:driverprobe)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
guestio = { path = "../guestio" }
wit-bindgen-rt = { workspace = true }
serde_json = { workspace = true }

[package.metadata.component]
package = "comp:driverprobe"

[package.metadata.component.target]
path = "wit"
world = "driver-probe"

[package.metadata.component.target.dependencies]
"graph:run" = { path = "../graph-run/wit" }
"graph:agent" = { path = "../graph-agent/wit" }
"graph:fitness" = { path = "../graph-fitness/wit" }
"llm:inference" = { path = "../llm-inference/wit" }
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
