[package]
name = "vcs-store"
description = "holon:vcs/code-store (+ files) for components: each call is one HTTP request to the native comp-vcs daemon (ADR-0099)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# The contract's records as serde types (`holon_vcs::model`): the JSON this
# component sends comp-vcs is exactly what the daemon deserializes, from ONE
# definition. Default features only — the pure engine, no sockets, which is
# what builds for wasm32-wasip2 (ADR-0095); nothing here calls the engine.
holon-vcs = { path = "../../crates/holon-vcs" }

[package.metadata.component]
package = "holon:vcs-store"

[package.metadata.component.target]
path = "wit"
world = "component"

[package.metadata.component.target.dependencies]
"holon:vcs" = { path = "../../wit/vcs" }
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
