[package]
name = "svg-chart"
description = "Dependency-free SVG chart renderer — bar / line / donut / sparkline from one series (svg:chart)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[package.metadata.component]
package = "svg:component"

[package.metadata.component.target]
path = "wit"
world = "chart"
