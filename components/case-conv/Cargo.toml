[package]
name = "case-conv"
description = "identifier case conversion — snake, kebab, camel, pascal (case:conv)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# See `components/bytes-codec`: the bindings are gated on wasm32 so `cargo test`
# can link the crate for the held-out specification.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[package.metadata.component]
package = "case:component"

[package.metadata.component.target]
path = "wit"
world = "case-conv"
