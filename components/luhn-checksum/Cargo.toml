[package]
name = "luhn-checksum"
description = "Luhn (mod-10) checksum — validate, compute, and append (luhn:checksum)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The rlib + wasm32-gated bindings let `cargo test` link the crate for the held-out spec.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[package.metadata.component]
package = "luhn:component"

[package.metadata.component.target]
path = "wit"
world = "luhn-checksum"
