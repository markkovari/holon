[package]
name = "grocery-assets"
description = "The Grocery Shop React SPA embedded as a ui:assets capability"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[package.metadata.component]
package = "grocery-ui:component"

[package.metadata.component.target]
path = "../../wit/ui-assets"
world = "ui-assets"
