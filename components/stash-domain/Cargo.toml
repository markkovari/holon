[package]
name = "stash-domain"
description = "A note stash you export as a .zip — documents bundled to Markdown + CSV index + manifest via zip:archive (stash:app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
guestfmt = { path = "../guestfmt" }
guestio = { path = "../guestio" }
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
