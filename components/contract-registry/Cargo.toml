[package]
name = "contract-registry"
description = "The interface two parts of a decomposed goal build against, and how it got that way — versions, requests, answers (contract:registry)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.component]
package = "contract:component"

[package.metadata.component.target]
path = "wit"
world = "contract-registry"

[package.metadata.component.target.dependencies]
"knowledge:graph" = { path = "../knowledge-graph/wit" }
# Transitive: `knowledge-graph`'s world names these, so the package has to resolve.
"comp:secrets" = { path = "../../host/wit/deps/comp-secrets" }
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
