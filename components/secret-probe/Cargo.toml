[package]
name = "secret-probe"
description = "Instrument: does comp:secrets/reader hand a guest the secret its manifest granted, and only that one? (comp:secretprobe)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[package.metadata.component]
package = "comp:secretprobe"

[package.metadata.component.target]
path = "wit"
world = "secret-probe"

[package.metadata.component.target.dependencies]
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
# The host's copy IS the contract — referenced, not duplicated, so the guest and the
# host it runs on cannot drift apart.
"comp:secrets" = { path = "../../host/wit/deps/comp-secrets" }
