[package]
name = "arena-domain"
description = "Multiplayer Connect Four: server-validated moves, win detection, live board over SSE (arena:app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.component]
package = "arena:component"

[package.metadata.component.target]
path = "wit"
world = "arena-domain"

[package.metadata.component.target.dependencies]
"records:store" = { path = "../record-store/wit" }
"id:generate" = { path = "../id-generate/wit" }
"wasi:http" = { path = "../../wit/deps/wasi-http-0.2.0" }
"wasi:io" = { path = "../../wit/deps/wasi-io-0.2.0" }
"wasi:clocks" = { path = "../../wit/deps/wasi-clocks-0.2.0" }
"wasi:cli" = { path = "../../wit/deps/wasi-cli-0.2.0" }
"wasi:random" = { path = "../../wit/deps/wasi-random-0.2.0" }
"wasi:keyvalue" = { path = "../../wit/deps/wasi-keyvalue-0.2.0-draft" }
"wasi:config" = { path = "../../wit/deps/wasi-config-0.2.0-rc.1" }
