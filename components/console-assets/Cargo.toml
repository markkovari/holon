[package]
name = "console-assets"
description = "The Holon console SPA embedded as a ui:assets capability — its own bundle, kept out of the slim domain artifact"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { workspace = true }

[package.metadata.component]
package = "console-ui:component"

[package.metadata.component.target]
path = "../../wit/ui-assets"
world = "ui-assets"
