# Verify a push. Nothing did, until now.
#
# The repository has 202 component crates, four Cargo workspaces and a Playwright
# suite, and the only workflow that has ever run here is Dependabot's. Every claim
# about the tree being green has been somebody running a command locally and
# remembering the answer.
#
# ## What this is allowed to do, and what it is not
#
# It BUILDS and it TESTS. It does not deploy, it does not publish, and it does not
# touch the lattice or a model provider — every job here runs offline apart from
# fetching crates, so nothing in CI can spend money or open a pull request.
#
# ## Why the exclusions are named rather than hidden
#
# Two jobs carry an exclusion with a PR number on it. That is deliberate: a
# suppression whose removal condition is written down is a TODO, and one without
# is a permanent lie. Both come out as their PRs land.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant, and
# a 200-crate wasm build is not cheap enough to run for an answer nobody wants.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A failure is worth more than a backtrace-less panic, and this costs nothing.
  RUST_BACKTRACE: 1

jobs:
  components:
    name: components (wasm32-wasip2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # `witsurface` asks whether a shape changed WITHOUT its version, and answers
      # it by comparing against the base branch — the shape that shipped, which a
      # branch cannot rewrite by regenerating a file. `actions/checkout` fetches one
      # ref, so `origin/main` is not here and the guard would SKIP: a guard that
      # quietly does not run is worse than the hole it was written to close.
      #
      # `--depth=1` and one ref: the comparison needs the file at main's tip and
      # nothing else, so this is a few hundred kilobytes rather than the history.
      - name: Fetch main, so the surfaces guard has something to compare against
        run: git fetch --depth=1 origin main:refs/remotes/origin/main

      - name: Install the wasm target
        run: rustup target add wasm32-wasip2

      # Pinned to the version this tree is developed against. `cargo-component`
      # generates every `bindings.rs`, which are gitignored — so without this step
      # nothing in components/ even parses, and the failure looks like missing
      # modules rather than a missing tool.
      # `just` and `wasm-tools` are not conveniences here: `just build` runs a
      # `wasm-tools metadata add` pass that stamps each artifact's name back on,
      # because wasm32-wasip2 components come out anonymous. `wit-reflect`
      # asserts that name, so a raw `cargo build` produces a tree that fails its
      # own tests — which is exactly what this workflow's first run did.
      - name: Install cargo-component, wasm-tools and just
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-component@0.21.1,wasm-tools,just

      # nats-server, and it buys more than any other line in this file.
      #
      # FORTY-ONE reconciler suites spawn a fleet, and a fleet is NATS. Without the
      # binary every one of them was excluded, and this file's own note said so —
      # "drop nats-server from PATH -> 21 of the rest spawn NATS". They were not run
      # anywhere, by anything, and one of them (`gendeploy`) had been RED since #158
      # over a drifted interface version that nothing was watching (#214).
      #
      # Measured before adding it, on a machine matching this runner — nats-server
      # present, no model shim, no SurrealDB:
      #
      #     57 passed, 4 failed, 6 ignored, in 469s
      #
      # The four are `gate_dispatch`, red on purpose because goal 10's parts are
      # stubs, and they stay out of the list below for that reason.
      #
      # Not `taiki-e/install-action`: it does not carry nats-server. A pinned release
      # tarball is two lines and cannot surprise this job on a morning nobody touched
      # a workflow — the same reasoning the `actionlint` step gives for pinning.
      - name: Install nats-server
        run: |
          ver=v2.10.22
          url="https://github.com/nats-io/nats-server/releases/download/${ver}/nats-server-${ver}-linux-amd64.tar.gz"
          curl -fsSL "$url" | tar xz --strip-components=1 -C /usr/local/bin \
            "nats-server-${ver}-linux-amd64/nats-server"
          nats-server --version

      # THREE workspaces, not one. This job builds `comp-host` (for the `publish`
      # suite) and the reconciler's test binaries, and with only `components`
      # declared those two compiled from scratch on every run:
      #
      #     346s  Build the host that `publish` spawns
      #     216s  Test the reconciler suites that read built artifacts
      #
      # — 562s of a 780s job, to produce binaries the `native workspaces` jobs
      # build in 54s and 95s from their own caches. Measured on run 33107417721.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            components -> target
            host -> target
            reconciler -> target
            cli -> target

      # The project's own entry point, not an approximation of it. CI that
      # builds differently from the repo is CI that answers a question nobody
      # asked.
      # `force=1`: the incremental path keys on stamp markers under `target/`, and a
      # cache restore can bring those back alongside artifacts it did not verify.
      # CI is the one place that should always do the whole thing.
      - name: Build
        run: just build force=1

      - name: Test
        working-directory: components
        # `browser-automation` needs bindings that only exist after a component
        # build of its own.
        run: cargo test --workspace --exclude browser-automation

      # The 25 MB this job actually produced, kept so no other machine has to
      # rebuild 7.1 GB of intermediates to get them.
      #
      # These are the bytes `just build` makes — the same entry point, with the
      # `wasm-tools metadata add` name stamp already applied — so a fetched tree is
      # the one this workflow tested, not an approximation of it. `just
      # fetch-components` pulls them by commit.
      - name: Keep the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: components-wasm32-wasip2
          path: components/target/wasm32-wasip2/release/*.wasm
          # Long enough to cover a branch somebody comes back to, short enough that
          # a year of pushes is not kept at 25 MB each.
          retention-days: 30
          compression-level: 9

      # `publish` spawns `comp-host` through `tests/harness/mod.rs`, so the host
      # has to exist before the step below. Dropped once already when this
      # section was rewritten, and CI failed on
      # `missing …/comp-host — cargo build --release in host/`.
      - name: Build the host that `publish` spawns
        working-directory: host
        run: cargo build --release --bin comp-host

      # Four reconciler suites need the BUILT artifacts and nothing else.
      #
      # They live here because `components/target/wasm32-wasip2/release/*.wasm`
      # is produced by this job and CI jobs do not share a filesystem. Two of
      # them — `capsearch` and `contracts` — were red on main and had never run.
      #
      # The other integration suites are NOT here: they spawn `nats-server`,
      # and several want SurrealDB. That is a real dependency and this workflow
      # deliberately stands up neither, so they stay a local act until CI grows
      # service containers. Measured, not guessed — see the note below.
      #
      # The four added later needed nothing but a built tree, and one of them had
      # been RED ON MAIN for as long as nothing ran it:
      #
      #   capgraph_store   asserts by reading files, and says so in its own words:
      #                    "a test that has to boot Docker to notice is a test
      #                    nobody runs before shipping the mismatch". Nobody ran
      #                    this one either, and it was failing on a Justfile recipe
      #                    that had gained a namespace.
      #   capgraph_edges   reads the built catalogue.
      #   console_session  spawns comp-host, which this job has already built.
      #   compose_race     the regression test for the artifact race that made this
      #                    very job flaky. It belongs where it can catch a repeat.
      #   hostsurface      what every component may ask of its host. Reads the
      #                    built artifacts, so it can only run where they are.
      #   fixtureversions  a fixture link naming a version nothing exports. Needs
      #                    the artifacts for the same reason, and the loop could
      #                    not start for two merges because nothing checked it.
      #   derived          deriving the graph must not write into the tree, the
      #                    committed renders must not drift from the components, no
      #                    build output is tracked, and no WIT package name is
      #                    claimed by two different contracts.      #   gate_*           all thirty-one end-to-end gates, in Rust rather than bash. The last five skip
      #                    loudly here: they judge behaviour that only exists when a real
      #                    model answered, so they probe for a shim on :8787 and say so
      #                    when there is none — the same condition `gate_shim_config`
      #                    checked, moved into the test
      #                    scripts, running beside the shell ones they mirror. Same
      #                    assertions, same failure sentences. Measured warm:
      #
      #                      events   4.12s -> 0.56s     tickets  6.34s -> 0.56s
      #                      checkin  4.04s -> 0.57s     swaps    6.36s -> 0.56s
      #                      TOTAL   20.87s -> 2.25s     9.3x
      #
      #                    The tools a worker must have drop from thirteen to two, and
      #                    that is the point rather than the seconds — these are headed
      #                    for several machines with work scheduled between them. Each
      #                    skips loudly if its artifacts are absent.
      #   checks           4 tests that need NOTHING — no nats-server, no surreal,
      #                    no comp-host, no built wasm. Written, passing, and simply
      #                    never named here.
      #
      # 41 of 59 reconciler test files are absent from this workflow, 61 of 118 test
      # functions, and almost all of that is fair: they spawn a fleet.
      #
      # `checks` is the ONLY one that is not. Seven others looked addable by reading
      # them — they mention SurrealDB, and this job already runs `capgraph_store`
      # against a container, so Docker was clearly available. All seven passed
      # locally. All seven then failed here on `spawning nats-server: No such file or
      # directory`, because a development machine has nats-server lying around and
      # cannot tell you that a test needs it.
      #
      # Which is the fifth time that has happened, and the note further down in this
      # file already said so: "Four earlier attempts classified these by READING
      # them. Every one was wrong. Each dependency only became visible when it was
      # REMOVED." Re-run with nats-server and surreal off PATH and comp-host moved
      # aside, `checks` passes and the other seven panic in `fleet.rs`.
      # THE END-TO-END GATES ARE RUST, AND THIS STEP IS GONE.
      #
      # There used to be a loop here running `components/*/e2e*.sh` — 41 shell gates,
      # 5,235 lines, needing `cargo component build`, `wasm-tools`, `python3`,
      # `comp-plug` on a path, `comp-field`, and `comp-host` via COMP_HOST. Every one
      # of them is now a `#[test]` in `reconciler/tests/gate_*.rs`, run by the step
      # below with the rest of the suites, and the scripts are deleted.
      #
      # The history is worth keeping because each line of it cost a debugging session:
      #
      #   * CI ran NONE of these for a long time, so an application could break on a
      #     pull request and everything stayed green. They were assumed to need
      #     services they did not.
      #   * the loop globbed `e2e-*.sh` — with a hyphen — which matched the 31 PART
      #     gates and none of the ten `e2e.sh` COMPOSITION gates, the only ones that
      #     judge the parts together. One of those had been failing since the day
      #     after it was written and nothing noticed (#201).
      #   * `comp-field` was added to `gate-lib.sh` on a branch cut before the gate
      #     step existed, so its own CI ran no gate and it merged green, leaving main
      #     with 21 of 25 gates failing on "no comp-field". A PR that cannot exercise
      #     the step it breaks is a PR that passes for the wrong reason.
      #   * `e2e-reminders` and `notify-probe/e2e.sh` wanted MailHog, which is
      #     archived, predates Go modules and will not install on this runner — so
      #     both were skipped here and the whole notification fan-out was a local-only
      #     check. `gatelib::MailSink` is a pure-Rust SMTP server, so the ported
      #     versions run.
      #
      # What the Rust gates still need is two binaries and nothing else: `comp-host`
      # to run what they compose, and `comp-mailrelay` for the mail ones. They compose
      # IN PROCESS via `plug::compose_to` (ADR-0087), so `comp-plug` is no longer a
      # gate dependency — it is still built below because `console_session` spawns it.
      #
      # `comp-field` is no longer built here. It existed to read a JSON field for the
      # shell gates and now has no caller in the tree; it is still shipped by
      # `install.sh` and `release.yml`, so the crate stays.
      - name: Build the binaries the gates and suites spawn
        run: |
          cargo build --release --manifest-path host/Cargo.toml --bin comp-host
          cargo build --release --manifest-path reconciler/Cargo.toml --bin comp-plug
          cargo build --release --manifest-path reconciler/Cargo.toml --bin comp-mailrelay
          cargo build --release --manifest-path cli/Cargo.toml --bin holon

      # Which binaries, established by asking the suites rather than by adding one
      # per failure. The fleet suites resolve exactly two by PATH — `comp-host` and
      # `cli/.../holon` — and three more through `CARGO_BIN_EXE_*`, which cargo builds
      # for a test automatically and no step has to. `secretcli` wanted `holon` and
      # said so plainly ("cargo build --release in cli/"), which is the only reason
      # this was one round trip and not four.

      # COMP_HOST is set even though the fallback path is the one the step above
      # builds, and that is the point: with it set, `gatelib::host_bin` finds no
      # binary LOUDLY. Without it, a gate whose host is missing prints `SKIPPED`,
      # returns `None`, and every gate turns that into `return` — a pass. Twenty-one
      # gates going green because nothing was there to judge with is how a checkout
      # with no artifacts reads as a healthy one, and this file's own rule is to
      # measure by removal: move `comp-host` aside and this step must go RED, not
      # quiet.
      #
      # `gate_dispatch` is deliberately NOT in the list below. It is goal 10's gate
      # and it is supposed to FAIL — `components/dispatch-domain`'s three parts are
      # stubs answering 501, on purpose, because a goal whose gates already pass is
      # refused by the base pre-check rather than run. Add it here only when the goal
      # has landed, and expect red until then.
      - name: Test the reconciler suites that read built artifacts
        working-directory: reconciler
        env:
          COMP_HOST: ${{ github.workspace }}/host/target/release/comp-host
        run: >-
          cargo test --release
          --test capsearch --test contracts --test publish --test secrets
          --test capgraph_edges --test capgraph_store --test console_session
          --test compose_race --test witsurface --test hostsurface
          --test fixtureversions --test derived --test checks
          --test gate_events --test gate_tickets --test gate_checkin --test gate_swaps
          --test gate_clinic --test gate_triage --test gate_treasury --test gate_moderation
          --test gate_triage_assist --test gate_invoice --test gate_support_desk --test gate_docsearch
          --test gate_events_closed --test gate_courier --test gate_stepup --test gate_reminders
          --test gate_answer --test gate_copilot --test gate_verdict --test gate_reply --test gate_assist
          --test gate_relay --test gate_notify

      # THE FLEET SUITES — 41 of them, and until this commit nothing ran a single one.
      #
      # Every one spawns NATS, which is why they were all excluded and why the
      # `nats-server` step above exists. Kept as a SEPARATE step rather than folded
      # into the list above so a fleet failure is legible on its own: these are the
      # slow ones, they share a machine, and mixing them into the artifact suites
      # would make one red tick mean either.
      #
      # `gate_dispatch` is deliberately absent — goal 10's gate, stubs answering 501
      # on purpose, and adding it would make this permanently red.
      - name: Test the suites that spawn a fleet
        working-directory: reconciler
        env:
          COMP_HOST: ${{ github.workspace }}/host/target/release/comp-host
        run: >-
          cargo test --release
          --test agent --test artifacts --test bigstatement --test blink --test capgraph_stress
          --test claude_shim_live --test coldstart --test compose --test contrast_audit_live
          --test crossnode --test driver --test e2e --test envbranch --test environments
          --test fitness --test forge --test gendeploy --test generation --test graph --test ha
          --test inference --test leader --test learning --test memory --test mockllm
          --test newversion --test photo_critic_live --test projects --test reveal
          --test scaling --test search --test secretcli --test select --test slug_live
          --test staleness --test state --test tagged --test tagged_loop --test trace_live
          --test treesize --test vgit

  # An invalid workflow file does not fail loudly. GitHub schedules NO jobs, shows
  # the run named after the file path, and the log is "log not found" — which is
  # what `publish-components.yml` did on its first push, because an expression in a
  # `workflow_dispatch` input default is not allowed and nothing said so.
  #
  # `actionlint` catches exactly that, in under a second.
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # NOT `taiki-e/install-action`: it does not carry actionlint, falls back to
      # cargo-binstall, and actionlint is a Go program with no crates.io package —
      # so that path dies at "actionlint is not found" and the lint never runs.
      # Go is preinstalled on this runner. Pinned, so a new release cannot turn
      # this job red on a morning nobody touched a workflow.
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # shellcheck is preinstalled here and actionlint finds it on PATH, so this
      # also lints every `run:` block — which is where the first real finding was.
      - name: Lint every workflow
        run: actionlint

  native:
    name: native workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One red workspace should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          # `--lib` is only legal where a lib target exists: `host` and `cli`
          # are bin-only and cargo errors rather than skipping. Found by this
          # workflow's own first run, which is the argument for having it.
          # `--lib --bins` used to be the whole story here, and it hid four red
          # test suites on main: `capsearch`, `contracts`, `docs` and `guestio`.
          # None had run in CI once, and `guestio` alone was recording 20
          # components that trap mid-response on any payload over 4 KiB.
          #
          # These six pass with NOTHING available: all 196 built `.wasm` files
          # moved aside, `comp-host` moved aside, and `nats-server`/`surreal` off
          # PATH. That is the only claim being made about them.
          #
          # Four earlier attempts classified these by READING them — grepping for
          # `components/target`, then for `comp-host`. Every one was wrong,
          # because a developer's machine has all three lying around from earlier
          # work and cannot tell. Each dependency only became visible when it was
          # REMOVED:
          #
          #   delete the .wasm            -> 16 suites need a build
          #   delete comp-host too        -> 7 more spawn a host
          #   drop nats-server from PATH  -> 21 of the rest spawn NATS
          #
          # 21 integration suites want NATS and sometimes SurrealDB. They stay
          # out until CI runs service containers, which is a separate decision
          # rather than a line in a test list.
          #
          # So the exclusion is a NAMED LIST rather than a blanket skip. The
          # suites listed here need NOTHING; the ones that read built wasm run in
          # the `components` job beside the build that produces it, and the ones
          # wanting NATS/SurrealDB/a model are still out.
          #
          # `console_session` is out too: it spawns `comp-host` from
          # `host/target/release`, which this job does not build.
          - workspace: reconciler
            test-args: >-
              --lib --bins
              --test docs --test fixtures --test guestio
              --test stress_env --test stress_tree --test uideps
          # `surrealkv_test` is a goal's GATE, committed deliberately red: it
          # describes a `--kv surreal` backend that does not exist yet, and it
          # dials a real SurrealDB on :8000. The loop runs it through
          # `comp-checks`; CI has no database and no business grading an
          # unstarted goal. It comes back the moment the backend lands.
          - workspace: host
            test-args: --bins -- --skip surrealkv_test
          - workspace: cli
            test-args: --bins
          # `lattice` was in no job at all. It COMPILES here — the reconciler and the
          # host both depend on it — so nothing was red, and its nine unit tests had
          # simply never run: the wire vocabulary, the snapshot round trip, and the
          # in-memory inventory's expiry. Found by listing the workspaces against the
          # matrix rather than by anything failing, which is the only way a whole
          # workspace goes missing quietly.
          #
          # Measured by removal, as this file insists: nats-server and surreal off
          # PATH and `comp-host` moved aside, `--lib` is 9 passed, 0 failed.
          #
          # `--lib` and not the whole workspace, deliberately.
          # `tests/inventory_ttl.rs` spawns a real `nats-server` to prove that two
          # processes asking one bucket for different TTLs are told what the bucket
          # actually holds — one process cannot observe that. Without the binary it
          # SKIPS, and a skip returns `ok`, so naming it here would buy a green tick
          # for a test that did not run. It stays a local check until this runner
          # installs nats-server.
          - workspace: lattice
            test-args: --lib
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }} -> target
      - name: Build
        working-directory: ${{ matrix.workspace }}
        run: cargo build --release
      - name: Test
        working-directory: ${{ matrix.workspace }}
        # The reconciler's integration tests want NATS, SurrealDB and a model.
        # `--lib --bins` keeps CI to what it can honestly run; the rest stay a
        # local and deliberate act.
        run: cargo test --release ${{ matrix.test-args }}

      # Every app spec, checked against the renderer that will deploy it. This is
      # the one collision a single spec cannot see — two apps landing on one port,
      # domain or name — and it is cheap: a pure parse, no box and no network.
      # Rendering a spec is not deploying one, so this stays inside what the
      # header above allows.
      - name: Validate the app specs
        if: matrix.workspace == 'cli'
        working-directory: ${{ github.workspace }}
        run: ./cli/target/release/holon node validate apps/*.toml

      # The lattice lane's spec, checked the same way and for the same reason. The
      # example is the only one committed; a real `fleet.toml` names real boxes and
      # does not belong in the tree.
      - name: Validate the fleet spec
        if: matrix.workspace == 'cli'
        working-directory: ${{ github.workspace }}
        run: ./cli/target/release/holon fleet validate fleet.example.toml

  lint:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip2
      - run: rustup component add clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-component@0.21.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: components -> target
      # Clippy needs the generated bindings but not the metadata pass, so this
      # one stays a bare `cargo component check`.
      - name: Generate bindings
        working-directory: components
        run: cargo component check --release
      - name: Clippy
        working-directory: components
        # NOT `-D warnings` yet: main carries 334 of them. #112 clears the
        # backlog to 22, and this line becomes `-- -D warnings` the day it
        # lands. Until then the job reports without blocking, which is worth
        # more than a check nobody can turn green.
        run: cargo clippy --workspace --exclude browser-automation --target wasm32-wasip2

  console:
    name: console SPA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/console/ui/package-lock.json
      - working-directory: examples/console/ui
        run: npm ci
      - name: Typecheck
        working-directory: examples/console/ui
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        working-directory: examples/console/ui
        run: npm run build
