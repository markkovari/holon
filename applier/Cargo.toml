[package]
name = "applier"
version = "0.1.0"
edition = "2021"
publish = false
description = "The platform's only holder of a Kubernetes credential: server-side applies manifest sets that platform-domain renders, after re-validating them (docs/adr/0003, 0004)."

# This is a NATIVE binary, deliberately OUTSIDE the components/ (wasm32)
# workspace — same arrangement as host/. It exists because a wasm component
# cannot talk to the API server: wasi:http validates TLS against webpki roots and
# the API server presents a cluster-CA certificate.
[workspace]

[dependencies]
kube = { version = "4", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Unmaintained but still the de-facto YAML reader; only ever parses OUR renderer's
# output, never tenant input.
serde_yaml = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
