[package]
name = "comp-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Native Rust host for ANY composed wasm component: serves its wasi:http/incoming-handler over wasmtime and satisfies its wasi:keyvalue / wasi:config / wasi:blobstore imports host-side. No Kubernetes, no NATS required."

# Native binary, deliberately outside the components/ (wasm32) workspace.

[[bin]]
name = "comp-host"
path = "src/main.rs"

[dependencies]
# PINNED TO 45 BY wrpc-runtime-wasmtime, not by choice.
# wrpc 0.31 builds against 45 and two wasmtimes mean incompatible types; bump all four together with wrpc.
wasmtime = { version = "45", features = ["component-model", "async"] }
# `p3` is opt-in on 45 and implements the `0.3.0-rc-2026-03-15` WIT, so p3 guests build against that rc.
wasmtime-wasi = { version = "45", features = ["p3"] }
wasmtime-wasi-http = { version = "45", features = ["p3", "component-model-async"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# rustls: a node needs no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# For SurrealKv: values are arbitrary bytes, SurrealQL string literals are not.
base64 = "0.22"
# Sync client for KvBackend: `reqwest::blocking` panics inside a running tokio runtime.
ureq = { version = "2", features = ["json", "tls"] }
http-body-util = "0.1"
bytes = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# rustls + webpki roots: dial managed `rediss://` endpoints from a minimal container.
redis = { version = "1.5", features = ["tls-rustls", "tls-rustls-webpki-roots"] }
comp-lattice = { path = "../lattice" }
# Direct only for `--kv nats`, a store and not the transport (ADR-0027).
async-nats = "0.49"
futures = "0.3"
# `bundled`: no system libsqlite3, which keeps the static musl cross-build working.
rusqlite = { version = "0.32", features = ["bundled"] }
# Digests are verified before compiling: the object store is not a trust boundary.
sha2 = "0.10"
# Sans-IO S3 signing, so the sync `ureq` client sends from inside a KvBackend.
rusty-s3 = "0.10"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Component-model value encoding with dynamic invocation, for binding unsatisfied imports at start.
wrpc-runtime-wasmtime = "0.31"
wrpc-transport-nats = "0.31"
wrpc-transport = "0.29"
