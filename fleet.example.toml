# Copy to `fleet.toml`, edit the addresses, then `holon fleet validate` and `holon fleet render` it (docs/SELFHOST.md, lane 2).

# Separates lattices sharing one NATS (e.g. staging from production).
lattice = "prod"

# JetStream must be enabled (`nats-server -js`): inventory, artifact store and leader lease all use it.
nats_url = "nats://10.0.0.1:4222"

platform_url = "http://10.0.0.1:8080"

# Seconds between passes; activations bypass this loop (ADR-0042).
interval = 10

# Failover detection time (ADR-0035): lower and a slow node looks dead, higher and traffic goes to a corpse longer.
inventory_ttl = 15

# `addr` must be dialable by the ingress; a loopback address is refused.
[[nodes]]
name = "node-1"
addr = "10.0.0.2:3401"
# sqlite and memory are node-local, so the reconciler will not spread a stateful app onto them (ADR-0027).
kv = "nats"

[[nodes]]
name = "node-2"
addr = "10.0.0.3:3401"
kv = "nats"

[ingress]
host = "edge"
# Loopback behind Caddy, which terminates TLS (`holon node ingress <domain>` renders the site).
addr = "127.0.0.1:8088"
# Per-node in-flight bound before shedding with 503; 0 disables (ADR-0041).
max_inflight = 64

# Two reconcilers on purpose: they contend for a JetStream KV lease, so one acts and one stands by (ADR-0072).
[[reconcilers]]
host = "control-1"
# Must be well above `interval`: the lease is renewed once per pass.
lease_ttl = 30

[[reconcilers]]
host = "control-2"
lease_ttl = 30
