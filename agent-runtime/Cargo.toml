[package]
name = "agent-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The autonomous half of a Holon agent: a tool-using loop over a model, per-agent memory, schedule/event/HTTP triggers, approvals and a run log. Native on purpose (ADR-0095): a wasm component has no background, so nothing in a guest can fire a cron trigger or hold an approval open."

# Native, so kept out of the wasm32 components/ workspace.

[lib]
name = "agent_runtime"
path = "src/lib.rs"

[[bin]]
name = "agent-runtime"
path = "src/main.rs"

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tiny_http = "0.12"
sha2.workspace = true
base64.workspace = true
holon-llm.workspace = true
holon-skills.workspace = true
agent-wire.workspace = true
tempfile.workspace = true

[dev-dependencies]
# tests/contract.rs: the runtime contract (api/holon/runtime/v1, ADR-0120) compiles.
protox = "0.9"
