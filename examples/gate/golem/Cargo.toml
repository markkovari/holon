# Own workspace root — detach from examples/gate's e2e workspace so the Golem
# CLI builds it standalone for wasm32-wasip2.
[workspace]

[package]
name = "gate_agent"
version = "0.0.1"
edition = "2024"

[profile.release]
opt-level = "s"
lto = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
golem-rust = { version = "2.1.0", features = ["export_golem_agentic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
