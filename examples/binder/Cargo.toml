[package]
name = "binder-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ureq = "2"
serde_json = "1"

[dev-dependencies]
# The feature files are parsed by the component this repository ships, not by a
# second Gherkin parser written for the tests. `gherkin-validate` is an rlib as
# well as a component for exactly this.
gherkin-validate = { path = "../../components/gherkin-validate" }
