<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holon Billing</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f6f7fb; color: #1a1d29; }
  header { background: #0f2e1a; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 20px; }
  section { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  h2 { font-size: 15px; margin: 0 0 12px; color: #444; }
  input, select, button { font: inherit; padding: 8px 10px; border: 1px solid #d7d9e4; border-radius: 6px; }
  input, select { width: 100%; margin-bottom: 8px; }
  button { background: #157347; color: #fff; border: none; cursor: pointer; font-weight: 600; }
  button:hover { background: #0f5c38; }
  button.ghost { background: transparent; color: #157347; border: 1px solid #157347; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; }
  .status { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .status-draft { background: #eee; color: #555; }
  .status-sent { background: #cde7ff; color: #0a5ea8; }
  .status-paid { background: #d4f4dd; color: #157347; }
  .err { color: #b02a2a; font-size: 13px; margin-top: 6px; }
  [hidden] { display: none !important; }
  .muted { color: #888; font-size: 13px; }
</style>
</head>
<body>

<div id="auth">
  <header><h1>Holon Billing</h1><span></span></header>
  <main style="max-width:380px">
    <section>
      <h2 id="auth-title">Log in</h2>
      <input id="email" type="email" placeholder="email">
      <input id="password" type="password" placeholder="password">
      <select id="role" hidden><option value="biller">biller</option><option value="admin">admin</option></select>
      <button id="submit-btn" onclick="submitAuth()">Log in</button>
      <p class="muted" style="margin-top:10px">
        <span id="toggle-text">No account?</span>
        <a href="#" onclick="toggleMode();return false" id="toggle-link">Register</a>
      </p>
      <div id="auth-err" class="err"></div>
    </section>
  </main>
</div>

<div id="app" hidden>
  <header><h1>Holon Billing</h1><span id="who"></span> <button class="ghost" onclick="logout()" style="width:auto">Log out</button></header>
  <main>
    <section>
      <h2>New client</h2>
      <div class="row">
        <input id="c-name" placeholder="Client name">
        <input id="c-email" placeholder="Email">
        <button onclick="createClient()" style="max-width:120px">Add</button>
      </div>
    </section>

    <section>
      <h2>Clients</h2>
      <table id="clients-table"><thead><tr><th>Name</th><th>Email</th></tr></thead><tbody></tbody></table>
    </section>

    <section>
      <h2>New invoice</h2>
      <div class="row">
        <select id="i-client"></select>
        <input id="i-desc" placeholder="Line item description">
        <input id="i-amount" type="number" placeholder="Amount">
        <button onclick="createInvoice()" style="max-width:120px">Add</button>
      </div>
    </section>

    <section>
      <h2>Invoices</h2>
      <table id="invoices-table"><thead><tr><th>Client</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>
    </section>
  </main>
</div>

<script>
let token = localStorage.getItem('billing_token') || '';
let mode = 'login';
let clientsById = {};

function toggleMode() {
  mode = mode === 'login' ? 'register' : 'login';
  document.getElementById('auth-title').textContent = mode === 'login' ? 'Log in' : 'Register';
  document.getElementById('submit-btn').textContent = mode === 'login' ? 'Log in' : 'Register';
  document.getElementById('toggle-text').textContent = mode === 'login' ? 'No account?' : 'Already have one?';
  document.getElementById('toggle-link').textContent = mode === 'login' ? 'Register' : 'Log in';
  document.getElementById('role').hidden = mode === 'login';
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({'content-type': 'application/json'}, opts.headers || {});
  if (token) opts.headers['authorization'] = 'Bearer ' + token;
  const r = await fetch(path, opts);
  const text = await r.text();
  const body = text ? JSON.parse(text) : {};
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
}

async function submitAuth() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('auth-err');
  errEl.textContent = '';
  try {
    if (mode === 'register') {
      const role = document.getElementById('role').value;
      await api('/register', {method: 'POST', body: JSON.stringify({email, password, role})});
    }
    const r = await api('/login', {method: 'POST', body: JSON.stringify({email, password})});
    token = r.access_token;
    localStorage.setItem('billing_token', token);
    showApp();
  } catch (e) {
    errEl.textContent = String(e.message || e);
  }
}

function logout() {
  api('/logout', {method: 'POST'}).catch(() => {});
  token = '';
  localStorage.removeItem('billing_token');
  location.reload();
}

async function showApp() {
  document.getElementById('auth').hidden = true;
  document.getElementById('app').hidden = false;
  let me;
  try {
    me = await api('/me');
    document.getElementById('who').textContent = me.subject + ' (' + (me.roles[0] || 'biller') + ')';
  } catch (e) { logout(); return; }
  window.isAdmin = (me.roles || []).includes('admin');
  refresh();
}

async function createClient() {
  const name = document.getElementById('c-name').value;
  const email = document.getElementById('c-email').value;
  if (!name) return;
  await api('/api/clients', {method: 'POST', body: JSON.stringify({name, email})});
  document.getElementById('c-name').value = '';
  document.getElementById('c-email').value = '';
  refresh();
}

async function createInvoice() {
  const client_id = document.getElementById('i-client').value;
  const description = document.getElementById('i-desc').value;
  const amount = parseFloat(document.getElementById('i-amount').value || '0');
  if (!client_id || !description) return;
  await api('/api/invoices', {method: 'POST', body: JSON.stringify({client_id, line_items: [{description, amount}]})});
  document.getElementById('i-desc').value = '';
  document.getElementById('i-amount').value = '';
  refresh();
}

async function sendInvoice(id) {
  await api(`/api/invoices/${id}/send`, {method: 'POST'});
  refresh();
}
async function payInvoice(id) {
  await api(`/api/invoices/${id}/pay`, {method: 'POST'});
  refresh();
}

async function refresh() {
  const clients = await api('/api/clients');
  clientsById = {};
  const sel = document.getElementById('i-client');
  sel.innerHTML = (clients.clients || []).map(c => { clientsById[c.id] = c.name; return `<option value="${c.id}">${c.name}</option>`; }).join('');
  const tbody = document.querySelector('#clients-table tbody');
  tbody.innerHTML = (clients.clients || []).map(c => `<tr><td>${c.name}</td><td>${c.email || ''}</td></tr>`).join('');

  const invoices = await api('/api/invoices');
  const itbody = document.querySelector('#invoices-table tbody');
  itbody.innerHTML = (invoices.invoices || []).map(inv => {
    const clientName = clientsById[inv.client_id] || inv.client_id;
    let actions = '';
    if (inv.status === 'draft') actions += `<button onclick="sendInvoice('${inv.id}')" style="width:auto">Send</button> `;
    if (window.isAdmin && inv.status === 'sent') actions += `<button onclick="payInvoice('${inv.id}')" style="width:auto">Mark paid</button>`;
    return `<tr><td>${clientName}</td><td>$${inv.total}</td><td><span class="status status-${inv.status}">${inv.status}</span></td><td>${actions}</td></tr>`;
  }).join('');
}

if (token) { showApp(); }
</script>
</body>
</html>
