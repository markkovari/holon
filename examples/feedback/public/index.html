<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holon Feedback</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f6f7fb; color: #1a1d29; }
  header { background: #0f2e4a; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 20px; }
  section { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  h2 { font-size: 15px; margin: 0 0 12px; color: #444; }
  input, select, button, textarea { font: inherit; padding: 8px 10px; border: 1px solid #d7d9e4; border-radius: 6px; }
  input, select, textarea { width: 100%; margin-bottom: 8px; }
  button { background: #0a5ea8; color: #fff; border: none; cursor: pointer; font-weight: 600; }
  button:hover { background: #084a86; }
  button.ghost { background: transparent; color: #0a5ea8; border: 1px solid #0a5ea8; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .post { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid #eee; align-items: flex-start; }
  .vote-btn { width: 50px; height: 50px; flex: none; border-radius: 8px; background: #eef4fa; color: #0a5ea8; border: 1px solid #cfe0f0; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
  .vote-btn:hover { background: #dcebf8; }
  .post-body { flex: 1; }
  .post-title { font-weight: 600; }
  .post-desc { color: #555; font-size: 13px; margin: 2px 0 6px; }
  .status { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .status-open { background: #eee; color: #555; }
  .status-planned { background: #fff3cd; color: #916800; }
  .status-in-progress { background: #cde7ff; color: #0a5ea8; }
  .status-done { background: #d4f4dd; color: #157347; }
  .err { color: #b02a2a; font-size: 13px; margin-top: 6px; }
  [hidden] { display: none !important; }
  .muted { color: #888; font-size: 13px; }
  select.status-select { width: auto; display: inline-block; margin: 0; }
</style>
</head>
<body>

<div id="auth">
  <header><h1>Holon Feedback</h1><span></span></header>
  <main style="max-width:380px">
    <section>
      <h2 id="auth-title">Log in</h2>
      <input id="email" type="email" placeholder="email">
      <input id="password" type="password" placeholder="password">
      <select id="role" hidden><option value="member">member</option><option value="admin">admin</option></select>
      <button id="submit-btn" onclick="submitAuth()">Log in</button>
      <p class="muted" style="margin-top:10px">
        <span id="toggle-text">No account?</span>
        <a href="#" onclick="toggleMode();return false" id="toggle-link">Register</a>
      </p>
      <div id="auth-err" class="err"></div>
    </section>
  </main>
</div>

<div id="app" hidden>
  <header><h1>Holon Feedback</h1><span id="who"></span> <button class="ghost" onclick="logout()" style="width:auto">Log out</button></header>
  <main>
    <section>
      <h2>Suggest something</h2>
      <input id="p-title" placeholder="Title">
      <textarea id="p-desc" rows="2" placeholder="Description"></textarea>
      <button onclick="createPost()">Post</button>
    </section>

    <section>
      <h2>Roadmap</h2>
      <div id="posts"></div>
    </section>
  </main>
</div>

<script>
let token = localStorage.getItem('feedback_token') || '';
let mode = 'login';
const STATUSES = ['open', 'planned', 'in-progress', 'done'];

function toggleMode() {
  mode = mode === 'login' ? 'register' : 'login';
  document.getElementById('auth-title').textContent = mode === 'login' ? 'Log in' : 'Register';
  document.getElementById('submit-btn').textContent = mode === 'login' ? 'Log in' : 'Register';
  document.getElementById('toggle-text').textContent = mode === 'login' ? 'No account?' : 'Already have one?';
  document.getElementById('toggle-link').textContent = mode === 'login' ? 'Register' : 'Log in';
  document.getElementById('role').hidden = mode === 'login';
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({'content-type': 'application/json'}, opts.headers || {});
  if (token) opts.headers['authorization'] = 'Bearer ' + token;
  const r = await fetch(path, opts);
  const text = await r.text();
  const body = text ? (() => { try { return JSON.parse(text); } catch { return {}; } })() : {};
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
}

async function submitAuth() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('auth-err');
  errEl.textContent = '';
  try {
    if (mode === 'register') {
      const role = document.getElementById('role').value;
      await api('/register', {method: 'POST', body: JSON.stringify({email, password, role})});
    }
    const r = await api('/login', {method: 'POST', body: JSON.stringify({email, password})});
    token = r.access_token;
    localStorage.setItem('feedback_token', token);
    showApp();
  } catch (e) {
    errEl.textContent = String(e.message || e);
  }
}

function logout() {
  api('/logout', {method: 'POST'}).catch(() => {});
  token = '';
  localStorage.removeItem('feedback_token');
  location.reload();
}

async function showApp() {
  document.getElementById('auth').hidden = true;
  document.getElementById('app').hidden = false;
  let me;
  try {
    me = await api('/me');
    document.getElementById('who').textContent = me.subject + ' (' + (me.roles[0] || 'member') + ')';
  } catch (e) { logout(); return; }
  window.isAdmin = (me.roles || []).includes('admin');
  window.mySubject = me.subject;
  refresh();
}

async function createPost() {
  const title = document.getElementById('p-title').value;
  const description = document.getElementById('p-desc').value;
  if (!title) return;
  await api('/api/posts', {method: 'POST', body: JSON.stringify({title, description})});
  document.getElementById('p-title').value = '';
  document.getElementById('p-desc').value = '';
  refresh();
}

async function upvote(id) {
  try { await api(`/api/posts/${id}/vote`, {method: 'POST'}); } catch (e) {}
  refresh();
}

async function changeStatus(id, status) {
  await api(`/api/posts/${id}/status`, {method: 'POST', body: JSON.stringify({status})});
  refresh();
}

async function removePost(id) {
  try { await api(`/api/posts/${id}`, {method: 'DELETE'}); } catch (e) {}
  refresh();
}

async function refresh() {
  const r = await api('/api/posts');
  const el = document.getElementById('posts');
  el.innerHTML = (r.posts || []).map(p => {
    const mine = p.author === window.mySubject;
    const statusBadge = window.isAdmin
      ? `<select class="status-select" onchange="changeStatus('${p.id}', this.value)">` +
        STATUSES.map(s => `<option value="${s}" ${s === p.status ? 'selected' : ''}>${s}</option>`).join('') +
        `</select>`
      : `<span class="status status-${p.status}">${p.status}</span>`;
    const del = (mine || window.isAdmin) ? ` <button class="ghost" style="width:auto" onclick="removePost('${p.id}')">delete</button>` : '';
    return `<div class="post">
      <div class="vote-btn" onclick="upvote('${p.id}')">▲<div>${p.votes}</div></div>
      <div class="post-body">
        <div class="post-title">${p.title}</div>
        <div class="post-desc">${p.description || ''}</div>
        ${statusBadge}${del}
      </div>
    </div>`;
  }).join('') || '<p class="muted">No suggestions yet.</p>';
}

if (token) { showApp(); }
</script>
</body>
</html>
