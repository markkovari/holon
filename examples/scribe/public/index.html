<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scribe — collaborative editor on wasmCloud</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1a202c; --muted:#64748b; --line:#e2e8f0;
          --accent:#4f46e5; --accent-ink:#fff; --ok:#16a34a; --merge:#eef2ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --panel:#171a21; --ink:#e5e9f0; --muted:#8b95a7; --line:#2a2f3a;
            --accent:#818cf8; --accent-ink:#0f1115; --ok:#4ade80; --merge:#1c2030; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.55 system-ui, sans-serif; background: var(--bg); color: var(--ink);
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: .6rem; padding: .7rem 1rem;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1rem; margin: 0; }
  header h1 .dim { color: var(--muted); font-weight: 400; }
  header .grow { flex: 1; }
  header input.name { padding: .35rem .5rem; border: 1px solid var(--line); border-radius: 7px;
                 background: var(--bg); color: var(--ink); font: inherit; width: 7rem; }
  .who { color: var(--muted); font-size: .82rem; display:flex; align-items:center; gap:.3rem; }
  .pill { display:inline-block; padding:.15rem .5rem; border-radius:999px; font-size:.72rem; font-weight:600; }
  .pill.live { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.off { background: color-mix(in srgb, var(--muted) 20%, transparent); color: var(--muted); }
  main { flex:1; overflow:hidden; display:flex; }
  .scroll { flex:1; overflow-y:auto; padding: 1.2rem clamp(1rem, 4vw, 2.5rem); }
  .doc { max-width: 44rem; margin: 0 auto; }
  aside { width: 340px; flex:none; border-left:1px solid var(--line); background:var(--panel);
          overflow-y:auto; padding: 1rem 1rem 2rem; }
  aside h2 { font-size:.78rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
             margin:.2rem 0 .8rem; }
  .rev { border:1px solid var(--line); border-radius:10px; margin-bottom:.7rem; overflow:hidden; }
  .rev .hd { display:flex; justify-content:space-between; gap:.5rem; padding:.4rem .6rem;
             background:var(--bg); font-size:.76rem; color:var(--muted); }
  .rev .hd b { color:var(--ink); font-weight:600; }
  .diff { margin:0; padding:.4rem .6rem; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
          white-space:pre-wrap; word-break:break-word; }
  .diff .add { color:#16a34a; } .diff .del { color:#dc2626; } .diff .hdr { color:var(--muted); }
  @media (prefers-color-scheme: dark) { .diff .add { color:#4ade80; } .diff .del { color:#f87171; } }
  @media (max-width: 760px) { aside { display:none; } }
  .title { width:100%; font-size: 1.7rem; font-weight: 800; border:0; outline:0; background:transparent;
           color:var(--ink); padding:.2rem 0; border-bottom:2px solid transparent; }
  .title:focus { border-bottom-color: var(--accent); }
  .meta { color:var(--muted); font-size:.8rem; margin:.3rem 0 1rem; }
  .body { width:100%; min-height: 55vh; font: 15px/1.7 system-ui, sans-serif; color:var(--ink);
          border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:1rem 1.1rem;
          outline:0; resize:none; }
  .body:focus { border-color: var(--accent); }
  .flash { animation: fl 1s ease-out; }
  @keyframes fl { from { background: var(--merge); } to { background: var(--panel); } }
  .title.flash { animation: flt 1s ease-out; }
  @keyframes flt { from { background: var(--merge); } to { background: transparent; } }
</style>
</head>
<body>
  <header>
    <h1>📝 scribe <span class="dim">· <span id="docname">readme</span></span></h1>
    <span class="who"><span class="pill off" id="status">connecting…</span></span>
    <span class="grow"></span>
    <span class="who" id="online"></span>
    <input class="name" id="name" title="your name">
  </header>
  <main>
    <div class="scroll">
      <div class="doc">
        <input class="title" id="title" placeholder="Untitled document" autocomplete="off">
        <div class="meta">Title is an LWW register, body is an RGA sequence — edits merge, no lock. <span id="rev"></span></div>
        <textarea class="body" id="body" placeholder="Start writing… open this page in a second window and type in both."></textarea>
      </div>
    </div>
    <aside>
      <h2>History · diff:text</h2>
      <div id="history"></div>
    </aside>
  </main>
<script>
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const doc = qs.get("doc") || "readme";
$("docname").textContent = doc;
const api = p => `/api/docs/${encodeURIComponent(doc)}${p}`;

// a stable replica id + a display name per window. `?rid=` wins so two panes on
// the same origin (which share localStorage) can be distinct editors.
const replica = qs.get("rid") || localStorage.getItem("scribe-rid") ||
  (localStorage.setItem("scribe-rid", "r" + Math.random().toString(36).slice(2, 8)), localStorage.getItem("scribe-rid"));
let name = qs.get("name") || localStorage.getItem("scribe-name") || "guest-" + Math.floor(1000 + Math.random() * 9000);
$("name").value = name;
$("name").onchange = () => { name = $("name").value.trim() || name; localStorage.setItem("scribe-name", name); };

let rev = -1;
const els = { title: $("title"), body: $("body") };
const H = { "content-type": "application/json" };
const pad = (n, w) => String(n).padStart(w, "0");

// ---- title: a last-writer-wins register --------------------------------------
// ts captured at edit time so a delayed op still resolves correctly by LWW.
let titleTimer;
els.title.oninput = () => {
  clearTimeout(titleTimer);
  titleTimer = setTimeout(() => {
    fetch(api("/ops"), { method: "POST", headers: H,
      body: JSON.stringify({ field: "title", value: els.title.value, ts: Date.now(), replica }) }).catch(() => {});
  }, 200);
};

// ---- body: an RGA text sequence ----------------------------------------------
// We track the visible elements [{id, ch}]. A local keystroke is diffed into an
// id-anchored insert/delete op — anchored to a stable element id, NOT a position,
// so a concurrent edit elsewhere can't make it land in the wrong place. We apply
// our own op optimistically with PREDICTED ids (same formula the server uses), so
// the next keystroke anchors correctly before the round-trip returns.
let bodyEls = [];        // [{id, ch}] in order
let bodySeq = 0;         // per-client op counter (uniqueness)
const bodyText = () => bodyEls.map(e => e.ch).join("");

// Single-region diff of two strings: {pos, del, ins}.
function strDiff(a, b) {
  const max = Math.min(a.length, b.length);
  let p = 0; while (p < max && a[p] === b[p]) p++;
  let s = 0; while (s < max - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
  return { pos: p, del: a.length - p - s, ins: b.slice(p, b.length - s) };
}

els.body.oninput = () => {
  const old = bodyText(), now = els.body.value;
  if (old === now) return;
  const { pos, del, ins } = strDiff(old, now);
  if (del > 0) {
    const ids = bodyEls.slice(pos, pos + del).map(e => e.id);
    bodyEls.splice(pos, del);                                   // optimistic
    fetch(api("/ops"), { method: "POST", headers: H,
      body: JSON.stringify({ field: "body", kind: "delete", ids }) }).catch(() => {});
  }
  if (ins) {
    const after = pos > 0 ? bodyEls[pos - 1].id : "";
    const ts = Date.now(), seq = bodySeq++;
    const idBase = `${pad(ts, 13)}-${replica}-${pad(seq, 6)}`;
    const made = [...ins].map((ch, k) => ({ id: `${idBase}:${pad(k, 4)}`, ch }));
    bodyEls.splice(pos, 0, ...made);                            // optimistic (predicted ids)
    fetch(api("/ops"), { method: "POST", headers: H,
      body: JSON.stringify({ field: "body", kind: "insert", after, text: ins, ts, replica, seq }) }).catch(() => {});
  }
};

// Reconcile the textarea to the server's converged body. While THIS window has
// the body focused we freeze (never yank text out from under the caret) and
// resync on the next push after blur — so bodyEls always matches what's on
// screen and local ops anchor correctly. A window that isn't typing still shows
// the other editor's changes live.
// ponytail: freeze-on-focus keeps anchors correct without full OT; the tradeoff
// is you don't see a co-editor's keystrokes until you pause. Convergence on the
// server is always correct regardless.
function applyBody(text, elems) {
  if (document.activeElement === els.body) return;
  bodyEls = elems.slice();
  if (els.body.value !== text) els.body.value = text;
}

// Apply the merged document from the server.
function apply(d) {
  if (typeof d.rev === "number") { rev = d.rev; $("rev").textContent = `· rev ${rev}`; }
  const f = d.fields || {};
  if (document.activeElement !== els.title) {
    const t = f.title ?? "";
    if (els.title.value !== t) {
      els.title.value = t;
      els.title.classList.remove("flash"); void els.title.offsetWidth; els.title.classList.add("flash");
    }
  }
  const before = els.body.value;
  applyBody(f.body ?? "", d.body_elems ?? []);
  if (els.body.value !== before && document.activeElement !== els.body) {
    els.body.classList.remove("flash"); void els.body.offsetWidth; els.body.classList.add("flash");
  }
}

function connect() {
  const es = new EventSource(api(`/events?rev=${rev}`));
  es.onopen = () => { $("status").className = "pill live"; $("status").textContent = "● live"; };
  es.onmessage = e => { try { apply(JSON.parse(e.data)); refreshHistory(); } catch {} };
  es.onerror = () => { $("status").className = "pill off"; $("status").textContent = "reconnecting…"; };
}

// Render each revision's unified diff (from the diff:text component) with
// +added / -removed lines colored.
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function diffHtml(diff) {
  return diff.split("\n").filter(l => l && !l.startsWith("---") && !l.startsWith("+++")).map(l => {
    const cls = l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : l.startsWith("@@") ? "hdr" : "";
    return `<span class="${cls}">${esc(l)}</span>`;
  }).join("\n");
}
async function refreshHistory() {
  const d = await fetch(api("/history?limit=20")).then(r => r.json()).catch(() => ({ history: [] }));
  $("history").innerHTML = (d.history || []).map(h =>
    `<div class="rev">
       <div class="hd"><b>${esc(h.field)}</b><span>r${h.rev} · ${esc(String(h.replica || ""))}</span></div>
       <pre class="diff">${diffHtml(h.diff || "")}</pre>
     </div>`).join("") || `<div class="meta">No edits yet.</div>`;
}

async function presence() {
  await fetch(api("/presence"), { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ user: name }) }).catch(() => {});
  const d = await fetch(api("/presence")).then(r => r.json()).catch(() => ({ online: [] }));
  const who = (d.online || []);
  $("online").textContent = who.length ? `✎ ${who.join(", ")}` : "";
}

(async () => {
  const d = await fetch(api("")).then(r => r.json()).catch(() => ({}));
  apply(d);
  refreshHistory();
  connect();
  presence(); setInterval(presence, 4000);
})();
</script>
</body>
</html>
