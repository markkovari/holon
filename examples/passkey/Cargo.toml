[package]
name = "passkey-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ureq = "2"
serde_json = "1"
# The virtual authenticator: a real P-256 key, real DER-encoded ECDSA signatures.
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
base64 = "0.22"
