<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>events — two users, one component</title>
    <style>
      html, body { margin: 0; height: 100%; background: #09090b; color: #fafafa;
        font: 14px ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .wrap { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
      .pane { display: flex; flex-direction: column; min-width: 0;
        border-right: 1px solid #27272a; }
      .pane:last-child { border-right: 0; }
      .bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px;
        background: #18181b; border-bottom: 1px solid #27272a; }
      .dot { width: 9px; height: 9px; border-radius: 50%; }
      .who { font-weight: 600; }
      .sub { color: #a1a1aa; font-size: 12px; }
      iframe { flex: 1; border: 0; width: 100%; background: #09090b; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="pane">
        <div class="bar">
          <span class="dot" style="background:#60a5fa"></span>
          <span class="who">Attendee</span>
          <span class="sub">phone — claims a place, shows the code</span>
        </div>
        <iframe id="attendee" src="/?as=attendee"></iframe>
      </div>
      <div class="pane">
        <div class="bar">
          <span class="dot" style="background:#34d399"></span>
          <span class="who">Organizer</span>
          <span class="sub">door — scans it, and refuses it twice</span>
        </div>
        <iframe id="organizer" src="/?as=organizer"></iframe>
      </div>
    </div>
  </body>
</html>
