# wasi:config defaults for the example suites.
#
# These used to be hardcoded in `host/src/main.rs::build_config()`, read out of the
# process environment with `VET_*` overrides. That is gone: in a host shared by
# every tenant on a node, process environment as config is a cross-tenant read —
# one `getenv` and every app sees every other app's knobs, including the ones
# people put secrets in.
#
# They live here instead, as data, passed with `--config-file`. Nothing in the host
# knows about any of these keys, which is the point.
#
# `--config k=v` is applied AFTER this file, so a recipe overrides a line by naming
# it. `just host-<app>` sets `default-tenant` that way.

# auth-guard policy
default-tenant     = acme-vet
session-ttl        = 3600
password-min-len   = 8
audit-enabled      = true
max-attempts       = 5
lockout-window     = 300

# secrets-vault AEAD master key (base64 of 32 bytes) — seals staff 2FA secrets.
# A DEMO VALUE, and it is in git, which is exactly why real deployments take
# secrets by reference through `secrets:vault` and never through config (ADR-0010).
master-key         = dmV0LWNsaW5pYy1kZW1vLW1hc3Rlci1rZXktMzJiISE=

# upload-policy (pet photos)
allowed-types      = image/png,image/jpeg,image/webp,image/gif
max-size           = 2097152
ticket-ttl         = 300
ticket-secret      = vet-upload-secret

# pagination (cursor signing)
max-page-size      = 100
cursor-secret      = vet-cursor-secret
