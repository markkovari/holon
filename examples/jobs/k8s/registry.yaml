# In-cluster OCI registry for the jobs component image. NodePort 30501 so
# `wkg oci push --insecure localhost:30501/...` works from the laptop while the
# wasmCloud host pulls via registry.jobs.svc.cluster.local:5000.
# Storage is the container fs — a restart loses images; re-push after.
apiVersion: v1
kind: Namespace
metadata:
  name: jobs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: jobs
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:2
          ports: [{ containerPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: jobs
spec:
  type: NodePort
  selector: { app: registry }
  ports:
    - { port: 5000, targetPort: 5000, nodePort: 30501 }
