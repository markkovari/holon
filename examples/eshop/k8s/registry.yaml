# In-cluster OCI registry for the eshop component images. NodePort 30500 so
# `wkg oci push --insecure localhost:30500/...` works from the laptop while
# host pods pull via registry.eshop.svc.cluster.local:5000.
# NOTE: storage is the container filesystem — a registry restart loses images;
# re-run `just k8s-eshop-push`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: eshop
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
