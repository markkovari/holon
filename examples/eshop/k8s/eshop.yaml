# eShopOnDapr on wasmCloud v2 (runtime-operator, runtime.wasmcloud.dev/v1alpha1).
#
# One WorkloadDeployment per eShop service — the Dapr-sidecar-per-service
# topology, recreated: every service is its own wac-composed wasm (domain +
# capability components fused; byte-identical to what the native-host lane
# runs) and workloads share nothing but the host's NATS-backed wasi:keyvalue
# (bucket "default": sessions, records, and the event-bus topic log — the
# Dapr state store + pub/sub stand-ins) and plain HTTP through the gateway.
#
# HTTP is the host's :9191 virtual-host router: each workload's primary
# hostname is set on its wasi:http hostInterface; the no-selector Services are
# endpoint-maintained by the operator. hostInterface entries are per-entry
# ALL-match (see vet-domain-v2.yaml) — keyvalue store/atomics/batch stay
# separate entries.
#
# Deploy:  just k8s-eshop   (push images + kubectl apply -f this file)
# Try it (orbstack resolves cluster service DNS from the mac; port-forward
# can't attach to the operator's selector-less Services — if not on orbstack,
# port-forward the hostgroup POD on 9191 and send a Host: header):
#          open http://gateway.eshop.svc.cluster.local  (storefront)
#          GATEWAY=http://gateway.eshop.svc.cluster.local examples/eshop/smoke.sh
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: identity
  namespace: eshop
spec:
  replicas: 1
  template:
    spec:
      kubernetes:
        service:
          name: identity
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [incoming-handler]
          config:
            host: identity.eshop.svc.cluster.local
        - namespace: wasi
          package: http
          interfaces: [outgoing-handler]
        - namespace: wasi
          package: keyvalue
          interfaces: [store]
        - namespace: wasi
          package: keyvalue
          interfaces: [atomics]
        - namespace: wasi
          package: config
          interfaces: [store]
      components:
        - name: identity
          image: registry.eshop.svc.cluster.local:5000/eshop-identity:0.1.1
          poolSize: 8
          maxInvocations: 200
          localResources:
            config:
              default-tenant: "eshop"
              session-ttl: "3600"
              password-min-len: "8"
              audit-enabled: "true"
              max-attempts: "5"
              lockout-window: "300"
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: eshop
spec:
  ports: [{ name: http, port: 80, targetPort: 9191 }]
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: catalog
  namespace: eshop
spec:
  replicas: 1
  template:
    spec:
      kubernetes:
        service:
          name: catalog
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [incoming-handler]
          config:
            host: catalog.eshop.svc.cluster.local
        - namespace: wasi
          package: keyvalue
          interfaces: [store]
        - namespace: wasi
          package: keyvalue
          interfaces: [atomics]
        - namespace: wasi
          package: keyvalue
          interfaces: [batch]
        # idempotency-guard (composed in) reads its default-ttl from config.
        - namespace: wasi
          package: config
          interfaces: [store]
      components:
        - name: catalog
          image: registry.eshop.svc.cluster.local:5000/eshop-catalog:0.1.2
          poolSize: 8
          maxInvocations: 200
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: eshop
spec:
  ports: [{ name: http, port: 80, targetPort: 9191 }]
---
