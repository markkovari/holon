---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: gateway
  namespace: eshop
spec:
  replicas: 1
  template:
    spec:
      kubernetes:
        service:
          name: gateway
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [incoming-handler]
          config:
            host: gateway.eshop.svc.cluster.local
        - namespace: wasi
          package: http
          interfaces: [outgoing-handler]
        - namespace: wasi
          package: config
          interfaces: [store]
      components:
        - name: gateway
          image: registry.eshop.svc.cluster.local:5000/eshop-gateway:0.1.3
          poolSize: 8
          maxInvocations: 200
          localResources:
            # egress is fail-closed; the proxy may only dial the sibling services.
            allowedHosts: ["*.eshop.svc.cluster.local"]
            config:
              # proxy:route table — prefix=upstream, longest prefix wins;
              # upstream ending in / strips the matched prefix.
              routes: "/api/identity=http://identity.eshop.svc.cluster.local/,/api/catalog=http://catalog.eshop.svc.cluster.local,/api/basket=http://basket.eshop.svc.cluster.local,/api/orders=http://ordering.eshop.svc.cluster.local,/pump/ordering=http://ordering.eshop.svc.cluster.local/internal/pump/,/pump/catalog=http://catalog.eshop.svc.cluster.local/internal/pump/,/pump/payment=http://payment.eshop.svc.cluster.local/internal/pump/,/pump/basket=http://basket.eshop.svc.cluster.local/internal/pump/"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: eshop
spec:
  ports: [{ name: http, port: 80, targetPort: 9191 }]
---
# The choreography driver: event:bus is pull-based, so something must tick.
# One curl loop against the gateway's fan-out pump — the Dapr-subscription
# push stand-in. ponytail: a curl loop; sched:timer-driven drains if it matters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshop-pump
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels: { app: eshop-pump }
  template:
    metadata:
      labels: { app: eshop-pump }
    spec:
      containers:
        - name: pump
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - while true; do curl -s -m 10 -X POST http://gateway.eshop.svc.cluster.local/internal/pump || true; sleep 2; done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
