# REST twin of api/holon/v1/agent.proto: same resources, same fields
# (snake_case), same semantics. Streaming is Server-Sent Events.
#
# Money is integer micro-USD (1 USD = 1_000_000). Unlike Connect's JSON,
# 64-bit integers here are plain JSON numbers; every value we emit stays
# below 2^53 so JavaScript clients read them exactly.
openapi: 3.0.3
info:
  title: Holon Agent API
  version: 1.0.0
  description: >
    Sessions, tasks, a resumable event stream, and human approval of tool calls.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

paths:
  /v1/sessions:
    post:
      operationId: createSession
      summary: Open a session. Model, workspace and budget are fixed for its lifetime.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSession
      summary: Read a session, including its running spend.
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: closeSession
      summary: Stop any running task and every queued one (each ends with task_failed/cancelled) and close the session.
      responses:
        "200":
          description: The closed session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/sessions/{session_id}/tasks:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: sendTask
      summary: Start a task, or queue it behind the running one. Returns at once; progress arrives on the event stream.
      description: |
        A session runs one task at a time. With one running, the default is `409 task-running`.
        With `when_busy: queue` the task is accepted with status `queued`, `task_queued` is
        emitted, and it starts (`task_started`) when the ones before it have ended, oldest
        first. A task that never starts ends with `task_failed`: `cancelled`, or `internal`
        if the daemon restarted first, which a client resends if it still wants it.
        On an idle session a task starts at once, whatever `when_busy` says.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Resending the same key returns the original task instead of starting a second one.
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendTaskRequest" }
      responses:
        "202":
          description: Accepted. `status` is `running` if it started and `queued` if it is waiting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: |
            A task is already running and `when_busy` is `reject` (`task-running`), or the
            session is closed (`session-closed`). One task at a time per session.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: |
            `queue-full`: `when_busy: queue`, and as many tasks are already waiting as the
            daemon allows per session (`--max-queued`). Retry when one has started.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/sessions/{session_id}/tasks/{task_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: cancelTask
      summary: Stop a running task, or a queued one; it ends with task_failed/cancelled and the session stays open.
      description: |
        A queued task leaves the queue without having started. Stopping the running task
        lets the next queued one start. On a task that already ended, returns it unchanged,
        so a retry is harmless.
      responses:
        "200":
          description: The task as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/sessions/{session_id}/tasks/{task_id}/steer:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: steerTask
      summary: Add a message to the running task.
      description: |
        The message joins the conversation as a user message at the task's next
        model-call boundary: after the tool calls in flight have finished (a tool that
        is executing is never interrupted), or after the model's final answer, in which
        case the task takes another turn on it. It is not a new task and does not get
        around one task at a time.

        `task_steer_queued` is emitted when it is accepted and `task_steered` when the
        model is about to read it. A task that ends first never applies it, and nothing
        says so beyond the task ending: resend it as a task.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Resending the same key while the task runs accepts again and queues nothing.
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SteerTaskRequest" }
      responses:
        "202":
          description: Accepted. The running task, unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: |
            `task-not-running` (it ended, or is not the running task), `session-closed`,
            or `task-finishing` (it is writing its final answer; send a task instead).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/sessions/{session_id}/rewind:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: rewindSession
      summary: Put the files back as they were after an event (ADR-0121).
      description: |
        Reverts, newest first, the code-store ops that the `file_changed` events after
        `after_seq` name and that no rewind has reverted yet, then writes those files back,
        or removes one the agent created. `session_rewound` records it. The conversation is
        not rewound. Only on a daemon that records edits (`--vcs-url`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [after_seq]
              properties:
                after_seq: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Rewound.
          content:
            application/json:
              schema:
                type: object
                required: [ops, paths]
                properties:
                  ops: { type: array, items: { type: integer, format: int64 } }
                  paths: { type: array, items: { type: string } }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: |
            `session-busy` (a task is running), `edits-not-recorded`, or `rewind-refused`:
            the store refused a revert, because the file changed outside `write_file` after
            it. What was reverted until then stays reverted and is recorded.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/sessions/{session_id}/state:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSessionState
      summary: A session as a client draws it, and the cursor to keep watching it from.
      description: |
        Read this instead of replaying the event log from 0 when a client connects, or
        reconnects, to a session it was not watching. `seq` is the last event the state
        reflects, taken under the same lock as the rest, so `streamEvents` with
        `after_seq` = `seq` delivers exactly the events that came after: no gap, and
        nothing repeated.

        The transcript is folded from the events, so it includes the message the model
        is still writing (`in_progress`). It is not the provider's conversation.
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/sessions/{session_id}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: streamEvents
      summary: SSE stream of every event in the session, in seq order.
      description: |
        Each SSE frame is:

            id: <seq>
            event: <AgentEvent.type>
            data: <AgentEvent as JSON, one line>

        Resume after a disconnect with the `Last-Event-ID` header (browsers
        send it automatically) or `after_seq`; delivery restarts at seq + 1
        with no gaps or repeats. The server sends a `: keepalive` comment
        every 15 s. Clients must ignore event types they do not know.
      parameters:
        - name: after_seq
          in: query
          required: false
          description: Deliver events with seq > after_seq. Default 0 (from the start).
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: Last-Event-ID
          in: header
          required: false
          description: Same as after_seq; wins if both are given.
          schema: { type: string }
      responses:
        "200":
          description: The event stream. The schema describes each frame's `data`.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/AgentEvent" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/sessions/{session_id}/tool-calls/{call_id}/approval:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: call_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: submitApproval
      summary: Approve or deny a tool call announced by tool_approval_required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitApprovalRequest" }
      responses:
        "200":
          description: Decision recorded; the task resumes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitApprovalResponse" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: The call is not pending (already decided, expired, or task gone).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # ---- Sessions ----
    CreateSessionRequest:
      type: object
      required: [model, workspace_dir, max_budget_usd_micros]
      properties:
        model:
          type: string
          description: Model id as the provider names it.
          example: claude-sonnet-5
        workspace_dir:
          type: string
          description: Absolute path the agent may read and write. Rejected (400) if outside the server's workspace roots.
          example: /srv/holon/work/my-repo
        max_budget_usd_micros:
          type: integer
          format: int64
          minimum: 1
          description: Hard spend ceiling for the whole session, micro-USD.
          example: 5000000
        auto_approve_tools:
          type: array
          items: { type: string }
          description: Tools that run without asking. Empty or absent means every tool call needs approval.
          example: [read_file, grep]
        labels:
          type: object
          additionalProperties: { type: string }
          description: Free-form caller labels, echoed back, never interpreted.
          example: { telegram_chat_id: "12345" }

    Session:
      type: object
      required: [id, model, workspace_dir, status, usage, max_budget_usd_micros, created_at]
      properties:
        id: { type: string }
        model: { type: string }
        workspace_dir: { type: string }
        status: { $ref: "#/components/schemas/SessionStatus" }
        usage:
          $ref: "#/components/schemas/Usage"
        max_budget_usd_micros: { type: integer, format: int64 }
        auto_approve_tools:
          type: array
          items: { type: string }
        approved_tools:
          type: array
          items: { type: string }
          description: >-
            Tools a person approved beyond one call (submitApproval with scope `task` or
            `session`): for the session, or, while that task runs, for the task. Apart from
            `auto_approve_tools`, which is what the session was created with and which no answer
            changes.
        labels:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        active_task_id:
          type: string
          nullable: true
          description: Task currently running; null when idle.

    SessionStatus:
      type: string
      enum: [idle, running, awaiting_approval, closed]

    # ---- Tasks ----
    SendTaskRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          description: The instruction for the agent, plain text.
        when_busy:
          type: string
          enum: [reject, queue]
          default: reject
          description: |
            What to do if the session already has a task running: `reject` (`409`, what a
            client that does not say gets) or `queue` (accept it, to start after the ones
            before it). Ignored on an idle session.

    SteerTaskRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          description: Plain text, handed to the model as a user message. Must not be blank.

    Task:
      type: object
      required: [id, session_id, status, created_at]
      properties:
        id: { type: string }
        session_id: { type: string }
        status:
          type: string
          enum: [queued, running, completed, failed]
          description: '`queued` is accepted onto a busy session and has not started.'
        created_at: { type: string, format: date-time }

    # ---- Usage and cost ----
    Usage:
      type: object
      description: Token counts and their price. Per model call (delta) or running total.
      required: [input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, cost_usd_micros]
      properties:
        input_tokens: { type: integer, format: int64, minimum: 0 }
        output_tokens: { type: integer, format: int64, minimum: 0 }
        cache_read_tokens:
          type: integer
          format: int64
          minimum: 0
          description: Prompt-cache hits, priced differently from plain input.
        cache_write_tokens: { type: integer, format: int64, minimum: 0 }
        cost_usd_micros:
          type: integer
          format: int64
          minimum: 0
          description: Price of the tokens above, from the server's price table.

    # ---- Events ----
    AgentEvent:
      description: One domain event. `type` selects the payload shape; it is also the SSE `event:` name.
      oneOf:
        - $ref: "#/components/schemas/TaskQueuedEvent"
        - $ref: "#/components/schemas/TaskStartedEvent"
        - $ref: "#/components/schemas/TextDeltaEvent"
        - $ref: "#/components/schemas/ToolCallStartedEvent"
        - $ref: "#/components/schemas/ToolApprovalRequiredEvent"
        - $ref: "#/components/schemas/ToolApprovalResolvedEvent"
        - $ref: "#/components/schemas/ToolCallFinishedEvent"
        - $ref: "#/components/schemas/UsageUpdatedEvent"
        - $ref: "#/components/schemas/TaskCompletedEvent"
        - $ref: "#/components/schemas/TaskFailedEvent"
        - $ref: "#/components/schemas/TaskSteerQueuedEvent"
        - $ref: "#/components/schemas/TaskSteeredEvent"
        - $ref: "#/components/schemas/FileChangedEvent"
        - $ref: "#/components/schemas/SessionRewoundEvent"
      discriminator:
        propertyName: type
        mapping:
          task_queued: "#/components/schemas/TaskQueuedEvent"
          task_started: "#/components/schemas/TaskStartedEvent"
          text_delta: "#/components/schemas/TextDeltaEvent"
          tool_call_started: "#/components/schemas/ToolCallStartedEvent"
          tool_approval_required: "#/components/schemas/ToolApprovalRequiredEvent"
          tool_approval_resolved: "#/components/schemas/ToolApprovalResolvedEvent"
          tool_call_finished: "#/components/schemas/ToolCallFinishedEvent"
          usage_updated: "#/components/schemas/UsageUpdatedEvent"
          task_completed: "#/components/schemas/TaskCompletedEvent"
          task_failed: "#/components/schemas/TaskFailedEvent"
          task_steer_queued: "#/components/schemas/TaskSteerQueuedEvent"
          task_steered: "#/components/schemas/TaskSteeredEvent"
          file_changed: "#/components/schemas/FileChangedEvent"
          session_rewound: "#/components/schemas/SessionRewoundEvent"

    EventEnvelope:
      type: object
      required: [type, seq, session_id, time]
      properties:
        type: { type: string }
        seq:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic per session, no gaps. The resume cursor and SSE id.
        session_id: { type: string }
        task_id: { type: string }
        time: { type: string, format: date-time }

    TaskQueuedEvent:
      description: |
        A task was accepted onto a busy session (`sendTask` with `when_busy: queue`) and
        waits for the ones before it. `task_started` follows when it begins; if it never
        does, `task_failed` says how it ended. Its prompt joins the conversation when it
        starts, not now.
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [prompt]
          properties:
            prompt: { type: string }

    TaskStartedEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [prompt]
          properties:
            prompt: { type: string }

    TextDeltaEvent:
      description: A chunk of assistant text. Concatenate deltas with the same message_id in seq order.
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [message_id, text]
          properties:
            message_id: { type: string }
            text: { type: string }

    ToolCallStartedEvent:
      description: The model asked for a tool. If it is not auto-approved, tool_approval_required follows before it runs.
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [call_id, tool_name, input]
          properties:
            call_id: { type: string }
            tool_name: { type: string }
            input:
              type: object
              additionalProperties: true
              description: Arguments exactly as the model produced them.

    ToolApprovalRequiredEvent:
      description: The task is paused until submitApproval is called for call_id.
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [call_id, tool_name, input]
          properties:
            call_id: { type: string }
            tool_name: { type: string }
            input:
              type: object
              additionalProperties: true
            expires_at:
              type: string
              format: date-time
              nullable: true
              description: When the server auto-denies if nobody answers. Null waits forever.

    ToolApprovalResolvedEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [call_id, decision, decided_by, scope]
          properties:
            call_id: { type: string }
            decision: { $ref: "#/components/schemas/ApprovalDecision" }
            decided_by:
              type: string
              description: The approver from submitApproval, or "timeout".
            scope:
              allOf: [{ $ref: "#/components/schemas/ApprovalScope" }]
              description: How far the approval reaches. `once` for a denial, whatever it was sent with.

    ToolCallFinishedEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [call_id, output, is_error, duration_ms]
          properties:
            call_id: { type: string }
            output:
              type: string
              description: What the tool returned, as text handed back to the model.
            is_error:
              type: boolean
              description: True when the tool failed or was denied; output then holds the reason.
            duration_ms: { type: integer, format: int64, minimum: 0 }

    UsageUpdatedEvent:
      description: Emitted after every model call.
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [delta, session_total, budget_remaining_usd_micros]
          properties:
            delta: { $ref: "#/components/schemas/Usage" }
            session_total: { $ref: "#/components/schemas/Usage" }
            budget_remaining_usd_micros:
              type: integer
              format: int64
              description: May go negative on the call that crosses the ceiling, which then fails the task.

    TaskCompletedEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [result, task_usage]
          properties:
            result:
              type: string
              description: The agent's final answer.
            task_usage: { $ref: "#/components/schemas/Usage" }

    TaskFailedEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [code, message, task_usage]
          properties:
            code:
              type: string
              enum: [budget_exceeded, cancelled, model_error, max_turns, internal]
              description: Branch on this; message is not stable.
            message: { type: string }
            task_usage: { $ref: "#/components/schemas/Usage" }

    TaskSteerQueuedEvent:
      description: A steerTask was accepted. The model reads it at the next boundary.
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [steer_id, message]
          properties:
            steer_id: { type: string }
            message: { type: string }

    TaskSteeredEvent:
      description: |
        The steer joined the conversation: the next model call sees it as a user message.
        If the task ends first the steer is never applied, and no event says so.
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [steer_id]
          properties:
            steer_id: { type: string }

    FileChangedEvent:
      description: |
        `write_file` changed `path` (workspace-relative), and the code store recorded it as
        `ops` (ADR-0121). Between the call's start and finish; only with `--vcs-url`.
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [call_id, path, ops]
          properties:
            call_id: { type: string }
            path: { type: string }
            ops: { type: array, items: { type: integer, format: int64 } }

    SessionRewoundEvent:
      description: A session-level event (`task_id` empty) from `rewindSession`.
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [after_seq, ops, paths]
          properties:
            after_seq: { type: integer, format: int64 }
            ops: { type: array, items: { type: integer, format: int64 } }
            paths: { type: array, items: { type: string } }

    # ---- Session state ----
    SessionState:
      type: object
      required: [session, seq, transcript, pending_approvals, pending_steers, queued_tasks]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        seq:
          type: integer
          format: int64
          minimum: 0
          description: The last event this state reflects; 0 for a session with none. Resume streamEvents after it.
        transcript:
          type: array
          description: The conversation as a client draws it, oldest first, folded from the events.
          items: { $ref: "#/components/schemas/TranscriptEntry" }
        pending_approvals:
          type: array
          description: Tool calls waiting for submitApproval. Also in the transcript, as status awaiting_approval.
          items: { $ref: "#/components/schemas/PendingApproval" }
        pending_steers:
          type: array
          description: Steers accepted and not yet read by the model, for the running task.
          items: { $ref: "#/components/schemas/PendingSteer" }
        queued_tasks:
          type: array
          description: Tasks accepted and not yet started, in the order they will start.
          items: { $ref: "#/components/schemas/QueuedTask" }

    TranscriptEntry:
      description: One line of the conversation. `type` selects the shape.
      oneOf:
        - $ref: "#/components/schemas/UserMessageEntry"
        - $ref: "#/components/schemas/AssistantMessageEntry"
        - $ref: "#/components/schemas/ToolCallEntry"
        - $ref: "#/components/schemas/TaskEndedEntry"
      discriminator:
        propertyName: type
        mapping:
          user_message: "#/components/schemas/UserMessageEntry"
          assistant_message: "#/components/schemas/AssistantMessageEntry"
          tool_call: "#/components/schemas/ToolCallEntry"
          task_ended: "#/components/schemas/TaskEndedEntry"

    EntryEnvelope:
      type: object
      required: [type, seq, task_id]
      properties:
        type: { type: string }
        seq:
          type: integer
          format: int64
          minimum: 1
          description: The seq of the event that began this entry.
        task_id: { type: string }

    UserMessageEntry:
      description: A prompt, or a steer that joined the conversation.
      allOf:
        - $ref: "#/components/schemas/EntryEnvelope"
        - type: object
          required: [text, steered]
          properties:
            text: { type: string }
            steered: { type: boolean }

    AssistantMessageEntry:
      description: What the model said in one turn.
      allOf:
        - $ref: "#/components/schemas/EntryEnvelope"
        - type: object
          required: [message_id, text, in_progress]
          properties:
            message_id: { type: string }
            text: { type: string }
            in_progress:
              type: boolean
              description: True while its text_delta events are still arriving.

    ToolCallEntry:
      allOf:
        - $ref: "#/components/schemas/EntryEnvelope"
        - type: object
          required: [call_id, tool_name, input, status]
          properties:
            call_id: { type: string }
            tool_name: { type: string }
            input: { type: object, additionalProperties: true }
            status:
              type: string
              enum: [awaiting_approval, running, finished, cancelled]
              description: |
                `awaiting_approval` is blocked on submitApproval; `running` is approved or
                auto-approved and executing; `finished` returned, or was denied; `cancelled`
                means the task ended while it waited or ran.
            decision:
              allOf: [{ $ref: "#/components/schemas/ApprovalDecision" }]
              nullable: true
              description: Null until someone decides.
            decided_by: { type: string, nullable: true }
            expires_at: { type: string, format: date-time, nullable: true }
            output: { type: string, nullable: true, description: Set once finished. }
            is_error: { type: boolean, nullable: true }
            duration_ms: { type: integer, format: int64, minimum: 0, nullable: true }

    TaskEndedEntry:
      allOf:
        - $ref: "#/components/schemas/EntryEnvelope"
        - type: object
          required: [outcome, usage]
          properties:
            outcome:
              type: string
              enum: [completed, failed]
            result: { type: string, nullable: true, description: "completed: the agent's final answer." }
            code:
              type: string
              nullable: true
              enum: [budget_exceeded, cancelled, model_error, max_turns, internal]
              description: "failed: why. Branch on this; message is not stable."
            message: { type: string, nullable: true }
            usage: { $ref: "#/components/schemas/Usage" }

    PendingApproval:
      type: object
      required: [task_id, call_id, tool_name, input]
      properties:
        task_id: { type: string }
        call_id: { type: string }
        tool_name: { type: string }
        input: { type: object, additionalProperties: true }
        expires_at: { type: string, format: date-time, nullable: true }

    PendingSteer:
      type: object
      required: [task_id, steer_id, message]
      properties:
        task_id: { type: string }
        steer_id: { type: string }
        message: { type: string }

    QueuedTask:
      type: object
      required: [task_id, prompt]
      properties:
        task_id: { type: string }
        prompt: { type: string }

    # ---- Human in the loop ----
    ApprovalDecision:
      type: string
      enum: [approve, deny]

    ApprovalScope:
      type: string
      enum: [once, task, session]
      default: once
      description: >-
        How far an approval reaches. It is for a *tool*, not for one call's input: approving `run`
        for the session approves every command. `once`: this call, and the next call of the tool
        asks again. `task`: this call and the rest of this task's calls of the tool. `session`:
        this call and every later call of the tool in this session, in any task.

    SubmitApprovalRequest:
      type: object
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/ApprovalDecision" }
        reason:
          type: string
          description: On deny, passed to the model as the tool error so it can adapt.
        approver:
          type: string
          description: Who is deciding; recorded in tool_approval_resolved.
          example: "telegram:12345"
        scope:
          allOf: [{ $ref: "#/components/schemas/ApprovalScope" }]
          description: >-
            How far an approval reaches; `once` when absent. A denial is for this call only, so
            `deny` with `task` or `session` is a 400, not quietly narrowed.

    SubmitApprovalResponse:
      type: object
      required: [call_id, decision]
      properties:
        call_id: { type: string }
        decision: { $ref: "#/components/schemas/ApprovalDecision" }
        scope:
          allOf: [{ $ref: "#/components/schemas/ApprovalScope" }]
          description: >-
            The scope the server understood. A server that does not know scopes leaves it out,
            which is how a client finds out its "remember this" did nothing.

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "https://holon.dev/errors/task-running" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
