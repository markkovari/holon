[package]
name = "holon"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "The Holon CLI: push components, deploy apps onto the lattice, and render the files a bare-metal node needs."

# Native: deliberately outside the wasm32 components/ workspace.
[workspace]

[[bin]]
name = "holon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
# Blocking HTTP, no async runtime: a dozen one-shot calls don't warrant tokio.
ureq = { version = "2", features = ["json", "tls"] }
# Not hand-rolled: /dev/tty, terminal restore on Ctrl-C and dying mid-prompt are easy to get wrong.
rpassword = "7"
