# Workspace-wide checks on push (not commit: too slow per commit), so a WIT change cannot break other crates' callers unseen.
pre-push:
  commands:
    # `xtask bindings` first: a bare `cargo component check` would also try the p3 crates and fail.
    components-check:
      run: cargo xtask bindings --exclude browser-automation && cargo check --manifest-path components/Cargo.toml --workspace --exclude browser-automation --target wasm32-wasip2
    reconciler-check:
      root: "reconciler/"
      run: cargo check --workspace --bins
    cli-check:
      root: "cli/"
      run: cargo test
    # xtask has no CI job; this is the only thing that builds it before a push.
    xtask-check:
      root: "xtask/"
      run: cargo build
    semgrep:
      run: |
        if ! command -v semgrep >/dev/null 2>&1; then
          echo "semgrep not installed locally (brew install semgrep) — skipping; CI will still run it."
          exit 0
        fi
        semgrep --config p/rust --config p/security-audit --config p/secrets \
          --exclude '**/target/**' --exclude '**/node_modules/**' \
          --baseline-commit origin/main --error .
