# Found the same way bytes-codec was: a small, self-contained algorithm that is
# easy to get subtly wrong (wrong doubling parity, wrong fold, a panic on bad
# input) and easy to check against numbers whose validity is publicly documented
# (Wikipedia's own worked example, card networks' published test numbers).
title = "luhn:checksum — validate, compute and append a mod-10 check digit"

text = """
Implement `is_valid`, `checksum_digit` and `append_checksum` in
components/luhn-checksum/src/lib.rs. None of them is implemented — each currently
panics with `unimplemented!()`.

`tests/luhn.rs` is the specification. You can read it and you may NOT edit it.

The algorithm: from the RIGHTMOST digit, double every second digit; if doubling
pushes a digit past 9, fold it by SUBTRACTING 9 (not modulo — `9*2=18` folds to
`9`, i.e. `1+8`, which subtracting 9 also gives). Sum every digit. A number is
valid iff that sum is a multiple of 10, and its own last digit already is the
check digit, already included in that sum.

Three things a first attempt gets wrong:

  * the doubling PARITY is anchored to the right end of the string, not the
    left — a leading zero must not change which positions get doubled;
  * a non-digit character or an empty string is invalid input, not a panic —
    every function returns `false`/`None`, it never unwraps a parse;
  * `checksum_digit` solves for the digit that, once APPENDED, makes the total a
    multiple of 10 — it is not the same computation as `is_valid`'s sum, because
    the new digit becomes the new rightmost position.

No dependencies — this is arithmetic over ASCII bytes, nothing more.
"""

component = "luhn-checksum"

base_paths = [
  "components/luhn-checksum/",
  "components/Cargo.toml",
  "components/spec-gate.sh",
]
writable = ["components/luhn-checksum/src/lib.rs"]
context = ["components/luhn-checksum/tests/luhn.rs"]

# THE goal: the algorithm itself, against real, publicly-documented numbers.
[[check]]
id = "the-algorithm"
weight = 3
command = ["bash", "components/spec-gate.sh", "luhn-checksum", "luhn",
  "known_valid_numbers_pass",
  "known_invalid_numbers_fail",
  "checksum_digit_makes_the_number_valid_once_appended"]

# Bad input must not panic.
[[check]]
id = "bad-input-is-refused-not-panicked"
weight = 2
command = ["bash", "components/spec-gate.sh", "luhn-checksum", "luhn",
  "empty_string_is_not_valid",
  "a_non_digit_character_is_not_valid_and_not_a_panic"]

# The two ways a first attempt gets the arithmetic wrong.
[[check]]
id = "parity-and-folding"
weight = 2
command = ["bash", "components/spec-gate.sh", "luhn-checksum", "luhn",
  "parity_is_counted_from_the_right_not_the_left",
  "doubling_that_overflows_nine_folds_by_subtracting_nine_not_modulo",
  "a_single_digit_round_trips",
  "zero_is_trivially_valid"]
