title = "social:feed — timelines, AI flagging, and moderation FSM"

text = """
Implement components/social-feed-domain/src/handlers.rs.

Routes:
  POST   /api/posts                 {"content":<string>}              (user)
  GET    /api/feed                                                    (user)
  POST   /api/moderation/{id}/flag                                    (user, moderator)
  POST   /api/moderation/{id}/resolve {"action":<string>}             (moderator, superadmin)

Store posts in the `posts` collection. Creating a post invokes `ai:inference/inference` to preemptively check for prohibited content. Feeds are generated by `graph:recommendation/engine`. Flagging initiates a `fsm:workflow/engine` in the "Flagged" state, escalating to "Resolved" upon action.

RBAC: Resolving flags requires `moderator` or `superadmin` role. Users can only fetch their own recommended feed. Enforce via `policy:guard/guard`.
"""

component = "social-feed-domain"

base_paths = [
  "components/social-feed-domain/",
  "components/auth-guard/",
  "components/policy-guard/",
  "components/record-store/",
  "components/fsm-workflow/",
  "components/ai-inference/",
  "components/graph-recommendation/",
  "components/Cargo.toml",
  "wit/",
  "host/wit/deps/",
]
writable = ["components/social-feed-domain/src/handlers.rs"]

workspace_manifest = "components/Cargo.toml"
keep_members = [
  "social-feed-domain",
  "auth-guard",
  "policy-guard",
  "record-store",
  "fsm-workflow",
  "ai-inference",
  "graph-recommendation",
]
context = [
  "components/social-feed-domain/src/lib.rs",
  "components/social-feed-domain/wit/social-feed.wit",
  "components/policy-guard/wit/policy.wit",
  "components/record-store/wit/record.wit",
  "components/fsm-workflow/wit/fsm.wit",
  "components/ai-inference/wit/ai.wit",
  "components/graph-recommendation/wit/graph.wit",
  ".comp/context/auth-consumer.wit",
]

[[check]]
id = "behaves-under-real-http"
required = true
weight = 1
command = ["bash", "components/social-feed-domain/gate.sh"]
