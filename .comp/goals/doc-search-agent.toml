# App 2 of five (docs/measure/complex-five.md). Its hard interaction is COST rather than
# ordering: a cache and a meter that must agree, and neither half of that is visible in a
# single request.
#
# WHAT IS TOLD AND WHAT IS NOT, on the line ADR-0082 drew:
#
#   KEPT   — facts a part cannot find from a signature and that fail SILENTLY: that
#            `quota`'s `Exceeded` payload is the units left and not a duration (a part
#            that passes it through answers `retry_after: 0`, telling every caller to
#            retry immediately, forever, with no error anywhere), and that `find_by`
#            wants a JSON-encoded value (a wrong query is `Ok(vec![])`, which reads
#            exactly like "never verified").
#
#   CUT    — everything the contract states outright: the order of the checks, which
#            status each refusal gets, that a hit carries only an id and a score so the
#            title must come from the store. And every LOUD failure: `quota:meter`'s
#            binding path being `quota::meter::meter`, `Method` having no `PartialEq`.
title = "docsearch:agent — retrieval-augmented answers that know what they cost"
contract = "components/doc-search-domain/CONTRACT.md"

text = """
Finish the docsearch:agent API in components/doc-search-domain. Nothing is implemented
yet: three parts are written at the same time, by three agents, against one contract.

`CONTRACT.md` in that crate is the specification — every route, every status code, every
rule, and the shape of the state the parts share. Read it first. You may not edit it: if
it is wrong or missing something you need, write CONTRACT-REQUEST.md (first line the
subject, the rest why) and the other parts will answer between generations.

The router in src/lib.rs already exists and is not yours to change. It dispatches to the
three parts, answers /health, mints a token at POST /test/token, seeds a library at POST
/test/seed, can mark a session stepped-up at POST /test/stepup, exposes a stored document
at GET /test/doc/{id}, and gives you `crate::cfg_u64(key, default)` for the config keys.
Those fixtures exist so your part can be judged before the parts around it exist. Your
part is one file.

You are judged by real HTTP requests against the running component, not by whether it
compiles: `cargo component check` passes happily on code that does nothing.

THE POINT OF THIS GOAL: your part's world already contains the hard pieces, as
components, bound at compose time. Look at wit/docsearch.wit. The second factor, the
meter, the index, the cache and the model are each implemented, tested and composed for
you. You call them; you do not write them. A hand-rolled HMAC, a HashMap cache, a counter
in the record store or a substring match over titles will each answer correctly on the
one path you try by hand, and each fails its gate — because the gate reads which
capabilities the compiled component actually calls.
"""

writable = []
base_paths = [
  "components/doc-search-domain/",
  # The capabilities these parts compose against. Readable, none of them writable.
  "components/auth-guard/",
  # auth.wit's own world imports these two, so the manifest names them and the build
  # reads them. Nothing here calls either.
  "components/rate-limiter/",
  "components/audit-log/",
  "components/otp/",
  "components/quota/",
  "components/search-index/",
  "components/cache/",
  "components/ai-inference/",
  # ai-inference's own import: absent, `cargo component` cannot build a target world at
  # all and every branch fails before a line of Rust is compiled (run 1, app 1).
  "components/llm-inference/",
  "components/anthropic-provider/",
  "components/record-store/",
  # The gate harness a part is judged by is `reconciler/tests/gate_*.rs` now, not a
  # shell library. It is deliberately NOT in this list: a part is judged by the gate
  # and does not get to read it, which was true of `gate-lib.sh` too — that entry
  # showed the shared PLUMBING (how a gate boots a host), never the assertions.
  "components/Cargo.toml",
  "wit/",
  "host/wit/deps/",
  # The guest-side shared code every domain crate depends on by PATH. A spec that
  # keeps a member and not its path dependency ships a workspace cargo cannot load:
  # "failed to load manifest for workspace member". Eight of the nine specs here were
  # missing these — `guestio` and `guestfmt` landed after the goals were written and
  # nothing re-ran them, so nothing said so.
  "components/guestfmt/",
  "components/guestio/",
]
workspace_manifest = "components/Cargo.toml"
keep_members = [
  "doc-search-domain",
  "auth-guard",
  "rate-limiter",
  "audit-log",
  "otp",
  "quota",
  "search-index",
  "cache",
  "ai-inference",
  "llm-inference",
  "anthropic-provider",
  "record-store",
  "guestfmt",
  "guestio",
]

[[part]]
name = "library"
text = """
Implement components/doc-search-domain/src/library.rs: filing a document, reading one
back, and finding one.

Two things here fail invisibly, and your gate checks both.

A document STORED but not INDEXED answers `GET /api/docs/{id}` perfectly and is
unfindable — a library that lies. Both happen or neither counts:

    use crate::bindings::search::index::index as search;

    search::index_doc(id: &str, text: &str, tags: &[String]) -> Result<(), SearchError>
    search::query(query: &str, mode: search::Mode, tags: &[String], limit: u32)
        -> Result<Vec<Hit>, SearchError>
    pub struct Hit { pub id: String, pub score: f64 }

And a `Hit` carries an id and a score and nothing else, so `GET /api/search` has to read
each title out of the store — a caller cannot use a list of ULIDs. The gate asks with a
word that appears only in a document's BODY, which a title match cannot reach.

A query matching nothing is `200` with an empty list, never a 404: an empty library and a
question nobody wrote about are the same shape to a caller, and neither is an error.
"""
writable = ["components/doc-search-domain/src/library.rs", "CONTRACT-REQUEST.md"]
context = [
  "components/doc-search-domain/src/lib.rs",
  "components/doc-search-domain/wit/docsearch.wit",
  "components/search-index/wit/search.wit",
  "components/record-store/wit/record.wit",
  ".comp/context/auth-consumer.wit",
]
[[part.check]]
id = "library-indexes-what-it-stores"
required = true
weight = 1
command = ["bash", "-c", "cd components && cargo component build --release -p doc-search-domain -p auth-guard -p rate-limiter -p audit-log -p otp -p quota -p search-index -p cache -p ai-inference -p anthropic-provider -p record-store && cd ../reconciler && cargo test --release --test gate_docsearch a_document_is_findable_by_its_body_and_the_tag_filter_is_the_index -- --exact"]

[[part]]
name = "answer"
text = """
Implement components/doc-search-domain/src/answer.rs: the only part that spends anything.

THE ORDER OF THE CHECKS IS THE SPECIFICATION, and each one exists to stop the cost of the
next: step-up, then the cache, then retrieval, then the budget, then the model. Get the
order wrong and everything still works on the first request — the gate asks the same
question twice, and then asks it again after the budget is gone, because that is the only
way to tell your order from a plausible reordering of it.

One fact you cannot get from a signature, and it fails silently:

    use crate::bindings::quota::meter::meter;

    meter::reserve(subject, amount, limit, period_seconds) -> Result<Balance, QuotaError>
    meter::peek(subject, limit, period_seconds)            -> Result<Balance, QuotaError>
    pub struct Balance { used: u64, limit: u64, remaining: u64, resets_at: u64 }

`QuotaError::Exceeded`'s payload is the units STILL AVAILABLE — always 0 when a request
for one unit is refused. It is not a duration. Pass it through as `retry_after` and every
refusal tells the caller to retry immediately, forever, and nothing reports an error. The
seconds come from `peek`: `resets_at - now`.

The other silent one: `records::find_by` wants the value JSON-encoded (`"\\"ada\\""`, not
`ada`), and a wrong query returns `Ok(vec![])` — which reads exactly like a session that
never stepped up.

`ai::generate(prompt, context)` is the model. `prompt` is the question; `context` is the
documents retrieval found, read out of the store. A model asked without sources is this
app inventing things, so no hits is a 404 and no budget has been spent at that point.
"""
writable = ["components/doc-search-domain/src/answer.rs", "CONTRACT-REQUEST.md"]
context = [
  "components/doc-search-domain/src/lib.rs",
  "components/doc-search-domain/wit/docsearch.wit",
  "components/quota/wit/quota.wit",
  "components/cache/wit/cache.wit",
  "components/search-index/wit/search.wit",
  "components/ai-inference/wit/inference.wit",
  "components/record-store/wit/record.wit",
  ".comp/context/auth-consumer.wit",
]
[[part.check]]
id = "answer-pays-once-and-refuses-well"
required = true
weight = 1
command = ["bash", "-c", "cd components && cargo component build --release -p doc-search-domain -p auth-guard -p rate-limiter -p audit-log -p otp -p quota -p search-index -p cache -p ai-inference -p anthropic-provider -p record-store && cd ../reconciler && cargo test --release --test gate_answer an_answer_is_paid_for_once_cached_forever_and_gated_by_step_up -- --exact"]

[[part]]
name = "stepup"
text = """
Implement components/doc-search-domain/src/stepup.rs: the second factor, and the mark the
`answer` part reads.

    use crate::bindings::otp::totp::authenticator as totp;

    totp::provision(issuer: &str, account: &str) -> Result<Provisioned, OtpError>
    totp::verify(secret: &str, code: &str, period: u32, digits: u8, skew: u32)
        -> Result<bool, OtpError>
    pub struct Provisioned { pub secret: String, pub uri: String }

Your gate presents a CORRECT code, computed from the secret you provisioned — a step-up
only ever tested with a wrong one is a step-up nobody has checked, and the part that
always answers `bad_code` passes every negative test there is.

What a wrong code must NOT do is the other half: not verify, and not un-verify. Clearing
the mark on a failed attempt hands anyone a logout for somebody else's session.

The state you write is read by another part, so its shape is the contract's and not
yours: the `stepups` collection, indexed on `subject`, carrying `verified_at`. The
router's fixture writes exactly that shape, which is why `answer` can be judged while you
are still a stub — and why a shape of your own invention passes your gate and fails the
composition.
"""
writable = ["components/doc-search-domain/src/stepup.rs", "CONTRACT-REQUEST.md"]
context = [
  "components/doc-search-domain/src/lib.rs",
  "components/doc-search-domain/wit/docsearch.wit",
  "components/otp/wit/otp.wit",
  "components/record-store/wit/record.wit",
  ".comp/context/auth-consumer.wit",
]
[[part.check]]
id = "stepup-checks-a-real-code"
required = true
weight = 1
command = ["bash", "-c", "cd components && cargo component build --release -p doc-search-domain -p auth-guard -p rate-limiter -p audit-log -p otp -p quota -p search-index -p cache -p ai-inference -p anthropic-provider -p record-store && cd ../reconciler && cargo test --release --test gate_stepup enrolling_is_not_verifying_and_a_wrong_code_cannot_log_anyone_out -- --exact"]

# The join. The step-up is earned through the real routes with a real TOTP code, and the
# question is asked over a document filed through the real library route — nothing in the
# path is scaffold, so a part that invented its own shape fails here having passed alone.
[[check]]
id = "the-whole-docsearch-api-works"
required = true
weight = 1
command = ["bash", "-c", "cd components && cargo component build --release -p doc-search-domain -p auth-guard -p rate-limiter -p audit-log -p otp -p quota -p search-index -p cache -p ai-inference -p anthropic-provider -p record-store && cd ../reconciler && cargo test --release --test gate_answer the_whole_docsearch_agent_works -- --exact"]
