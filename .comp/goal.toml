# Holon's next goal on itself (goal 01, the guard — is a run over its cap?).
text = """
Add `over_budget(cap_cents, attempts)` to reconciler/src/budget.rs: true if the
run's spend exceeds the cap, false otherwise. Reuse `spent_cents` — do not
re-sum. A `cap_cents` of 0 means no cap (never over), matching the codebase's "0
is unbounded" convention; spend exactly equal to the cap is within it, only
strictly more is over. Keep the existing `spent_cents` function and all tests
exactly as they are. The tests are the exact specification and must all pass.
Write the complete file.
"""
title = "Implement over_budget() — the fuel guard"
writable = ["reconciler/src/budget.rs"]
base_paths = ["reconciler/", "lattice/"]

[[check]]
id = "budget-tests-pass"
required = true
weight = 1
command = ["cargo", "test", "--manifest-path", "reconciler/Cargo.toml", "-p", "comp-reconciler", "--lib", "budget::"]
