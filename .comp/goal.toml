text = "Implement `dollars(cents)` in reconciler/src/money.rs: whole cents to a dollar string, always two decimal places, e.g. 0 -> \"$0.00\", 5 -> \"$0.05\", 1234 -> \"$12.34\". The tests are the exact spec and must pass. Write the complete file, keeping the tests unchanged."
title = "Implement dollars() — money formatting"
writable = ["reconciler/src/money.rs"]
base_paths = ["reconciler/", "lattice/"]
[[check]]
id = "money-tests-pass"
required = true
weight = 1
command = ["cargo", "test", "--manifest-path", "reconciler/Cargo.toml", "-p", "comp-reconciler", "--lib", "money::"]
