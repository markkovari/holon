# A bigger goal: the whole run-wallet subsystem in one file (goal 01, complete).
text = """
Implement the `Wallet` type in reconciler/src/wallet.rs — a run's spending cap
and the spend against it. Fill in every method: new, cap, spent, charge,
remaining, over, can_afford. A cap of 0 is UNBOUNDED (remaining is None, never
over, can always afford). `charge` prices a completion with `cost_cents` from the
cost module and accumulates it — call cost_cents, do not re-derive prices.
`remaining` never goes below zero; `over` is strictly-more-than-the-cap (equal is
not over); `can_afford(cents)` is true only if spend plus cents does not exceed
the cap. The tests in the file are the exact and exhaustive specification and must
all pass. Write the complete file, keeping the tests unchanged.
"""
title = "Implement the run Wallet — the budgeting subsystem"
writable = ["reconciler/src/wallet.rs"]
base_paths = ["reconciler/", "lattice/"]

[[check]]
id = "wallet-tests-pass"
required = true
weight = 1
command = ["cargo", "test", "--manifest-path", "reconciler/Cargo.toml", "-p", "comp-reconciler", "--lib", "wallet::"]
