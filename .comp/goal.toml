text = """
Two halves of one small feature, agreed through `CONTRACT.md` — which is this
repository's `components/demo/wit/demo.wit`.

The COMPONENT half implements `pub fn paginate_ids(ids, size, offset) -> (Vec<String>, bool)`
in components/demo/src/lib.rs: the slice at that offset, and whether more remain
beyond it. A size of 0 and an offset past the end must not panic. Keep the WIT
export delegating to it.

The PROBE half implements `pub fn page_json(hits, has_more) -> String` in
components/demo-probe/src/lib.rs — {"hits":[...],"has_more":bool}, correctly
escaped — and answers `GET /page?size=&offset=` by calling
`demo:shape/pager.paginate` over the ids ["a","b","c","d","e"] and writing that
JSON.

Each half is judged by tests in its own crate's `tests/` directory. You cannot
edit them: they are the specification. Read them.

Neither half may edit the other's files. If the interface is missing something you
need, write CONTRACT-REQUEST.md — first line the subject, the rest why.
"""
title = "demo:shape — paginate, and the probe that calls it"
contract = "components/demo/wit/demo.wit"
writable = []
base_paths = ["components/demo/", "components/demo-probe/", "components/Cargo.toml", "wit/deps/"]
workspace_manifest = "components/Cargo.toml"
keep_members = ["demo", "demo-probe"]

[[part]]
name = "component"
text = "Implement `paginate` in components/demo/src/lib.rs, exactly as CONTRACT.md describes."
writable = ["components/demo/src/lib.rs", "CONTRACT-REQUEST.md"]
[[part.check]]
id = "component-passes-its-held-out-tests"
command = ["cargo", "component", "test", "-p", "demo", "--manifest-path", "components/Cargo.toml"]

[[part]]
name = "probe"
text = "Answer GET /page?size=&offset= in components/demo-probe/src/lib.rs by calling paginate."
writable = ["components/demo-probe/src/lib.rs", "CONTRACT-REQUEST.md"]
[[part.check]]
id = "probe-passes-its-held-out-tests"
command = ["cargo", "component", "test", "-p", "demo-probe", "--manifest-path", "components/Cargo.toml"]

[[check]]
id = "the-join"
required = true
weight = 1
command = ["cargo", "component", "test", "-p", "demo", "-p", "demo-probe", "--manifest-path", "components/Cargo.toml"]
