# Holon builds a wasm component (goal: the platform itself).
text = """
Implement `rot13(text)` in components/rot13/src/lib.rs — ROT13 every ASCII letter
(a↔n, A↔N), leaving digits, punctuation and spaces unchanged. Keep the Guest impl
and the tests exactly as they are; only fill in the pure `rot13` function. The
tests are the exact spec and must pass. Write the complete file.
"""
title = "Implement the rot13 wasm component"
writable = ["components/rot13/src/lib.rs"]
base_paths = ["components/rot13/", "components/Cargo.toml"]
workspace_manifest = "components/Cargo.toml"
keep_members = ["rot13"]
[[check]]
id = "rot13-builds-and-passes"
required = true
weight = 1
command = ["cargo", "component", "test", "--manifest-path", "components/Cargo.toml", "-p", "rot13"]
