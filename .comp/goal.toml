# Holon's next goal on itself (goal 01, second half — a run's total spend).
text = """
Implement `spent_cents(attempts)` in reconciler/src/budget.rs: the total cost in
whole cents of every attempt in a run, summing each attempt priced by
`cost_cents` from the cost module — do not re-derive prices, call cost_cents. An
empty run has spent nothing. The tests in the file are the exact specification and
must pass. Write the complete file, keeping the tests unchanged.
"""
title = "Implement spent_cents() — a run's total spend"
writable = ["reconciler/src/budget.rs"]
base_paths = ["reconciler/", "lattice/"]

[[check]]
id = "budget-tests-pass"
required = true
weight = 1
command = ["cargo", "test", "--manifest-path", "reconciler/Cargo.toml", "-p", "comp-reconciler", "--lib", "budget::"]
