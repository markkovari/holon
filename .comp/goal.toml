# The routing tier: a budget-aware model tier router (run with a bigger model).
text = """
Implement the model tier router in reconciler/src/router.rs. The `Tier` enum is
Haiku < Sonnet < Opus. Fill in Tier::model (the Anthropic id per tier), Tier::rank
(0/1/2 cheap to dear), Tier::up (escalate one tier, Opus stays Opus), Tier::of
(map a model id to its tier by the tier name in the id; an id naming no known tier
is Opus, the most capable), and the free function tier_for(attempt, ceiling): the
first attempt is Haiku, each repair escalates one tier (attempt 1 Sonnet, 2+
Opus), capped at ceiling. The tests in the file are the exact and exhaustive
specification and must all pass. Write the complete file, keeping the tests
unchanged.
"""
title = "Implement the model tier router"
writable = ["reconciler/src/router.rs"]
base_paths = ["reconciler/", "lattice/"]

[[check]]
id = "router-tests-pass"
required = true
weight = 1
command = ["cargo", "test", "--manifest-path", "reconciler/Cargo.toml", "-p", "comp-reconciler", "--lib", "router::"]
