# A big goal: a stateful token-bucket rate limiter, run wide and deep.
text = """
Implement `TokenBucket` in reconciler/src/bucket.rs — a token-bucket rate limiter.
Fill in new, available, and try_take. It starts full. `available(now_ms)` returns
current tokens plus refill since the last update, capped at capacity, WITHOUT
consuming or advancing the clock; refill is refill_per_sec * elapsed_ms / 1000,
floored (integer division); time going backwards refills nothing (never a
negative — use saturating arithmetic). `try_take(now_ms, n)` refills and advances
the clock to now_ms, then takes n only if at least n are available (returns
true), otherwise takes nothing (returns false). The tests in the file are the
exact and exhaustive specification and must all pass. Write the complete file,
keeping the tests unchanged.
"""
title = "Implement TokenBucket — a rate limiter"
writable = ["reconciler/src/bucket.rs"]
base_paths = ["reconciler/", "lattice/"]

[[check]]
id = "bucket-tests-pass"
required = true
weight = 1
command = ["cargo", "test", "--manifest-path", "reconciler/Cargo.toml", "-p", "comp-reconciler", "--lib", "bucket::"]
