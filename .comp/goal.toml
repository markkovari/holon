text = """
Add a `C` variant to the `Kind` enum and make `render(&Kind::C)` return "c".
The enum is in components/twofile/src/kind.rs; the exhaustive match is in
components/twofile/src/render.rs. BOTH files must change together — adding the
variant without its match arm (or the arm without the variant) does not compile.
Do not touch lib.rs; its tests are the exact spec.
"""
title = "Add Kind::C across two files (enum + its match)"
writable = ["components/twofile/src/kind.rs", "components/twofile/src/render.rs"]
base_paths = ["components/twofile/", "components/Cargo.toml"]
workspace_manifest = "components/Cargo.toml"
keep_members = ["twofile"]
[[check]]
id = "two-files-compile-and-pass"
required = true
weight = 1
command = ["cargo", "test", "-p", "twofile", "--manifest-path", "components/Cargo.toml"]
