# Every reconciler/ingress tunable at its default. Copy to `comp.toml` (or pass `--config` / `$COMP_CONFIG`).
# Unknown keys are an error, so a typo cannot pass for a change. Flags beat env, env beats this file.

[reconciler]
# Activations bypass this loop (ADR-0042).
interval = 10

# Passes a surplus must persist before anything stops; deficits act at once (ADR-0022).
settle_passes = 2

# Per pass, so a mass event drains instead of stampeding the survivors (ADR-0035).
max_commands = 20

# The ack means "will serve", sent after the instance is built (ADR-0037).
command_timeout = 10

# Failover detection time (ADR-0035): lower and a slow node looks dead, higher and traffic goes to a corpse longer.
inventory_ttl = 15

[ingress]
refresh_secs = 3

backend_timeout = 30

# Per-node in-flight bound before shedding with 503; 0 disables (ADR-0041).
max_inflight = 64

# Slow backends one request may try; refused connections are free and not counted (ADR-0035).
slow_budget = 2

# A ceiling for when something is wrong: a normal activation takes ~49ms (ADR-0042).
activation_timeout = 10
