# Config every app in run_all.sh is hosted with, so the suite runs offline.
# stripe-gateway's test key: a charge succeeds without calling Stripe.
stripe-api-key = sk_test_123
# mock-provider's script: a classification is "allow"; anything else gets one plain reply.
mock-script = {"rules": [{"when": "Classify", "text": "allow"}, {"when": "*", "text": "Thanks for reaching out, we are looking into it."}]}
# outbox: dead-lettered after two failures a second apart, inside pipeline.spec.js's wait.
max-attempts = 2
base-backoff = 1
