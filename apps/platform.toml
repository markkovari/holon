name = "platform"
access = "tailnet"
domain = "platform.example.com"
artifact = "components/target/platform-domain.composed.wasm"
port = 3936
kv = "sqlite"
components = ["platform-domain", "auth-guard", "policy-guard", "record-store", "audit-log", "rate-limiter", "blob-store", "quota", "wit-reflect", "secrets-vault", "event-bus"]
strategy = "fused"

# `master-key` is a fixed local-dev value, not a real secret; without it every /api/secrets write is refused.
[config]
applier-secret = "platform-applier-secret"
ingress-suffix = "apps.local"
master-key = "Y29tcC10ZXN0LW9ubHktbWFzdGVyLWtleS0zMmJ5dGU="
