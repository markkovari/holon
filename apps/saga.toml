# Generated by tools/gen-app-specs.py from this app's `host-saga` recipe.
# EDIT `domain` before deploying — the value below is a placeholder.
#
#   just selfhost-render saga            # read the unit and route first
#   just selfhost-deploy saga my-vps     # compose, ship, restart, route
name = "saga"
# tailnet is the default and is left alone on purpose: a generated file must
# never be the reason an app is reachable from the internet. Set
# access = "public" deliberately, per app.
domain = "saga.example.com"
artifact = "components/target/saga_domain.composed.wasm"

# sqlite: one file under the unit's StateDirectory, so state survives the
# restarts `Restart=always` makes routine.
kv = "sqlite"

# saga-domain imports `sched:timer`, and drains it inside `pump()`. Nothing fires a
# pull-based timer on its own, so without this table a deployed saga sits at
# `running` forever — measured: with no relay a failing trip stayed
# running/[pending,pending,pending]; with one it reached `compensated` in seconds.
[triggers]
pump = "/internal/pump"
interval = 10
