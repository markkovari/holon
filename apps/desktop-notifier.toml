# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render desktop-notifier
#   just selfhost-deploy desktop-notifier my-vps
name = "desktop-notifier"
domain = "desktop-notifier.example.com"
artifact = "components/target/desktop-notifier.composed.wasm"

kv = "sqlite"

components = ["desktop-notifier-domain"]

# `comp-uinotify` (ADR-0095) has to be started separately — deploy tooling
# renders a unit for the wasm side only, not for the native daemons behind
# the twelve host capabilities. It needs a real desktop notification bus
# (D-Bus on Linux, native APIs on macOS/Windows) — honestly `unavailable`
# headless, rather than a crash:
#   comp-uinotify --addr 127.0.0.1:8009
[config]
uinotify-url = "http://127.0.0.1:8009"
