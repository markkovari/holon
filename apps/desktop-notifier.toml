# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render desktop-notifier
#   just selfhost-deploy desktop-notifier my-vps
name = "desktop-notifier"
domain = "desktop-notifier.example.com"
artifact = "components/target/desktop-notifier.composed.wasm"

kv = "sqlite"

components = ["desktop-notifier-domain"]

# `comp-uinotify` (ADR-0095) gets its own systemd unit too — see [[daemon]]
# below. `holon node render` emits comp-uinotify.service alongside this app's unit.
[config]
uinotify-url = "http://127.0.0.1:8009"

[[daemon]]
name = "uinotify"
addr = "127.0.0.1:8009"
