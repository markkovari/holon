name = "desktop-notifier"
domain = "desktop-notifier.example.com"
artifact = "components/target/desktop-notifier.composed.wasm"

kv = "sqlite"

components = ["desktop-notifier-domain"]

[config]
uinotify-url = "http://127.0.0.1:8009"

# No `token`, so the demo runs with nothing to provision; on a shared box set it and the
# matching `<name>-token` in [config], or any local process can reach this daemon.
[[daemon]]
name = "uinotify"
addr = "127.0.0.1:8009"
