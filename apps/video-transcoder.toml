# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   holon node render apps/video-transcoder.toml --out target/selfhost   # write the unit/env/route
#   then copy target/selfhost/video-transcoder/* to the box and `systemctl enable --now comp-video-transcoder.service`
name = "video-transcoder"
domain = "video-transcoder.example.com"
artifact = "components/target/video-transcoder.composed.wasm"

kv = "sqlite"

components = ["video-transcoder-domain"]

# `comp-ffmpeg` (ADR-0095) gets its own systemd unit too — see [[daemon]]
# below. `holon node render` emits comp-ffmpeg.service alongside this app's
# unit, `--allow-path /var/lib/video-transcoder` and all.
[config]
ffmpeg-url = "http://127.0.0.1:8010"

# No `token` set here — permissive, same reasoning as the demo mock-provider
# in intent-router.toml: this is meant to compose and run with nothing extra
# to provision. A real deployment sharing a box with anything else should
# set `token` here AND the matching `<name>-token` in [config] above (kept
# in sync by `check()`) — otherwise any local process can reach this daemon
# with no check at all (see `comp_reconciler::daemon_auth`'s own doc).
[[daemon]]
name = "ffmpeg"
addr = "127.0.0.1:8010"
allow_flag = "allow-path"
allow = ["/var/lib/video-transcoder"]
