# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render video-transcoder
#   just selfhost-deploy video-transcoder my-vps
name = "video-transcoder"
domain = "video-transcoder.example.com"
artifact = "components/target/video-transcoder.composed.wasm"

kv = "sqlite"

components = ["video-transcoder-domain"]

# `comp-ffmpeg` (ADR-0095) has to be started separately — deploy tooling
# renders a unit for the wasm side only, not for the native daemons behind
# the twelve host capabilities. It needs a real `ffmpeg` binary on PATH and
# at least one `--allow-path`, or every request answers `unavailable`/
# `not-permitted`:
#   comp-ffmpeg --addr 127.0.0.1:8010 --allow-path /var/lib/video-transcoder
[config]
ffmpeg-url = "http://127.0.0.1:8010"
