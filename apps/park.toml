name = "park"
# Whoever reaches the gateway can park, wake or cancel any session's ticket.
access = "tailnet"
domain = "park.example.com"
artifact = "components/target/park_gateway.composed.wasm"
root = "park-gateway"
port = 3943
# Tickets are this app's own records, moved by compare-and-set (ADR-0132), so the store must be
# durable; on a NATS cluster use kv = "nats" with every server in kv_url and --kv-replicas 3.
kv = "sqlite"
# The sink is comp-agentd's /park/deliver (ADR-0113): until it answers, deliveries are retried
# and tickets stay `ready`.
egress = ["127.0.0.1:8016"]

# The host runs the recovery pass and hands what it resolves to the sink, every second.
[triggers]
pump = "/internal/pump"
interval = 1

[config]
park-sink-url = "http://127.0.0.1:8016/park/deliver"
