name = "pdf-generator"
domain = "pdf-generator.example.com"
artifact = "components/target/pdf-generator.composed.wasm"

kv = "sqlite"

components = ["pdf-generator-domain"]

[config]
browser-url = "http://127.0.0.1:8001"

# No `token`, so the demo runs with nothing to provision; on a shared box set it and the
# matching `<name>-token` in [config], or any local process can reach this daemon.
[[daemon]]
name = "browser"
addr = "127.0.0.1:8001"
allow_flag = "allow-host"
allow = ["example.com"]
