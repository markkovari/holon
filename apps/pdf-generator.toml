# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render pdf-generator
#   just selfhost-deploy pdf-generator my-vps
name = "pdf-generator"
domain = "pdf-generator.example.com"
artifact = "components/target/pdf-generator.composed.wasm"

kv = "sqlite"

components = ["pdf-generator-domain"]

# `comp-browser` (ADR-0095) gets its own systemd unit too — see [[daemon]]
# below. `holon node render` emits comp-browser.service alongside this app's
# unit, `--allow-host example.com` and all.
[config]
browser-url = "http://127.0.0.1:8001"

# No `token` set here — permissive, same reasoning as the demo mock-provider
# in intent-router.toml: this is meant to compose and run with nothing extra
# to provision. A real deployment sharing a box with anything else should
# set `token` here AND the matching `<name>-token` in [config] above (kept
# in sync by `check()`) — otherwise any local process can reach this daemon
# with no check at all (see `comp_reconciler::daemon_auth`'s own doc).
[[daemon]]
name = "browser"
addr = "127.0.0.1:8001"
allow_flag = "allow-host"
allow = ["example.com"]
