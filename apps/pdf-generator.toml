# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render pdf-generator
#   just selfhost-deploy pdf-generator my-vps
name = "pdf-generator"
domain = "pdf-generator.example.com"
artifact = "components/target/pdf-generator.composed.wasm"

kv = "sqlite"

components = ["pdf-generator-domain"]

# `comp-browser` (ADR-0095) has to be started separately — deploy tooling
# renders a unit for the wasm side only, not for the native daemons behind
# the twelve host capabilities. It needs a real Chrome/Chromium binary
# installed on the box, and at least one `--allow-host`, or every request
# answers `unavailable`/`not-permitted`:
#   comp-browser --addr 127.0.0.1:8001 --allow-host example.com
[config]
browser-url = "http://127.0.0.1:8001"
