# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render local-ai
#   just selfhost-deploy local-ai my-vps
name = "local-ai"
domain = "local-ai.example.com"
artifact = "components/target/local-ai.composed.wasm"

kv = "sqlite"

components = ["local-ai-domain"]

# `comp-llmlocal` (ADR-0095) has to be started separately — deploy tooling
# renders a unit for the wasm side only, not for the native daemons behind
# the twelve host capabilities. It proxies to a locally-running Ollama (or
# API-compatible) server — no bundled model, no weights shipped here:
#   comp-llmlocal --addr 127.0.0.1:8006 --ollama-url http://127.0.0.1:11434 --model llama3.2
[config]
llmlocal-url = "http://127.0.0.1:8006"
