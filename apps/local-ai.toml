# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render local-ai
#   just selfhost-deploy local-ai my-vps
name = "local-ai"
domain = "local-ai.example.com"
artifact = "components/target/local-ai.composed.wasm"

kv = "sqlite"

components = ["local-ai-domain"]

# `comp-llmlocal` (ADR-0095) gets its own systemd unit too — see [[daemon]]
# below. `holon node render` emits comp-llmlocal.service alongside this app's unit.
[config]
llmlocal-url = "http://127.0.0.1:8006"

# No `token` set here — permissive, same reasoning as the demo mock-provider
# in intent-router.toml: this is meant to compose and run with nothing extra
# to provision. A real deployment sharing a box with anything else should
# set `token` here AND the matching `<name>-token` in [config] above (kept
# in sync by `check()`) — otherwise any local process can reach this daemon
# with no check at all (see `comp_reconciler::daemon_auth`'s own doc).
[[daemon]]
name = "llmlocal"
addr = "127.0.0.1:8006"
extra_args = ["--ollama-url http://127.0.0.1:11434 --model llama3.2"]
