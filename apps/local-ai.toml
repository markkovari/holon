# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render local-ai
#   just selfhost-deploy local-ai my-vps
name = "local-ai"
domain = "local-ai.example.com"
artifact = "components/target/local-ai.composed.wasm"

kv = "sqlite"

components = ["local-ai-domain"]

# `comp-llmlocal` (ADR-0095) gets its own systemd unit too — see [[daemon]]
# below. `holon node render` emits comp-llmlocal.service alongside this app's unit.
[config]
llmlocal-url = "http://127.0.0.1:8006"

[[daemon]]
name = "llmlocal"
addr = "127.0.0.1:8006"
extra_args = ["--ollama-url http://127.0.0.1:11434 --model llama3.2"]
