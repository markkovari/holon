name = "fs-watcher"
domain = "fs-watcher.example.com"
artifact = "components/target/fs-watcher.composed.wasm"

kv = "sqlite"

[config]
fswatch-url = "http://127.0.0.1:8000"

# No `token`, so the demo runs with nothing to provision; on a shared box set it and the
# matching `<name>-token` in [config], or any local process can reach this daemon.
[[daemon]]
name = "fswatch"
addr = "127.0.0.1:8000"
allow_flag = "allow-path"
allow = ["/var/log"]
