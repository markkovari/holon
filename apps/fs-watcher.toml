# Generated by tools/gen-app-specs.py from this app's `host-fs-watcher` recipe.
# EDIT `domain` before deploying — the value below is a placeholder.
#
#   just selfhost-render fs-watcher            # read the unit and route first
#   just selfhost-deploy fs-watcher my-vps     # compose, ship, restart, route
name = "fs-watcher"
# tailnet is the default and is left alone on purpose: a generated file must
# never be the reason an app is reachable from the internet. Set
# access = "public" deliberately, per app.
domain = "fs-watcher.example.com"
artifact = "components/target/fs-watcher.composed.wasm"

# sqlite: one file under the unit's StateDirectory, so state survives the
# restarts `Restart=always` makes routine.
kv = "sqlite"

# `comp-fswatch` (ADR-0095) gets its own systemd unit too — see [[daemon]]
# below. `holon node render` emits comp-fswatch.service alongside this app's
# unit, `--allow-path /var/log` and all.
[config]
fswatch-url = "http://127.0.0.1:8000"

# No `token` set here — permissive, same reasoning as the demo mock-provider
# in intent-router.toml: this is meant to compose and run with nothing extra
# to provision. A real deployment sharing a box with anything else should
# set `token` here AND the matching `<name>-token` in [config] above (kept
# in sync by `check()`) — otherwise any local process can reach this daemon
# with no check at all (see `comp_reconciler::daemon_auth`'s own doc).
[[daemon]]
name = "fswatch"
addr = "127.0.0.1:8000"
allow_flag = "allow-path"
allow = ["/var/log"]
