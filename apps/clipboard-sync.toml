# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   holon node render apps/clipboard-sync.toml --out target/selfhost   # write the unit/env/route
#   then copy target/selfhost/clipboard-sync/* to the box and `systemctl enable --now comp-clipboard-sync.service`
name = "clipboard-sync"
domain = "clipboard-sync.example.com"
artifact = "components/target/clipboard-sync.composed.wasm"

kv = "sqlite"

components = ["clipboard-sync-domain"]

# `comp-clipboard` (ADR-0095) gets its own systemd unit too — see [[daemon]]
# below. `holon node render` emits comp-clipboard.service alongside this app's unit.
[config]
clipboard-url = "http://127.0.0.1:8003"

# No `token` set here — permissive, same reasoning as the demo mock-provider
# in intent-router.toml: this is meant to compose and run with nothing extra
# to provision. A real deployment sharing a box with anything else should
# set `token` here AND the matching `<name>-token` in [config] above (kept
# in sync by `check()`) — otherwise any local process can reach this daemon
# with no check at all (see `comp_reconciler::daemon_auth`'s own doc).
[[daemon]]
name = "clipboard"
addr = "127.0.0.1:8003"
