name = "clipboard-sync"
domain = "clipboard-sync.example.com"
artifact = "components/target/clipboard-sync.composed.wasm"

kv = "sqlite"

components = ["clipboard-sync-domain"]

[config]
clipboard-url = "http://127.0.0.1:8003"

# No `token`, so the demo runs with nothing to provision; on a shared box set it and the
# matching `<name>-token` in [config], or any local process can reach this daemon.
[[daemon]]
name = "clipboard"
addr = "127.0.0.1:8003"
