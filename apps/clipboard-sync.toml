# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render clipboard-sync
#   just selfhost-deploy clipboard-sync my-vps
name = "clipboard-sync"
domain = "clipboard-sync.example.com"
artifact = "components/target/clipboard-sync.composed.wasm"

kv = "sqlite"

components = ["clipboard-sync-domain"]

# `comp-clipboard` (ADR-0095) has to be started separately — deploy tooling
# renders a unit for the wasm side only, not for the native daemons behind
# the twelve host capabilities. It needs a real desktop session (X11/Wayland/
# macOS pasteboard/Windows clipboard) — it will honestly answer `unavailable`
# on a headless box rather than crash:
#   comp-clipboard --addr 127.0.0.1:8003
[config]
clipboard-url = "http://127.0.0.1:8003"
