# Generated by tools/gen-app-specs.py from this app's `host-image-optimizer` recipe.
# EDIT `domain` before deploying — the value below is a placeholder.
#
#   just selfhost-render image-optimizer            # read the unit and route first
#   just selfhost-deploy image-optimizer my-vps     # compose, ship, restart, route
name = "image-optimizer"
# tailnet is the default and is left alone on purpose: a generated file must
# never be the reason an app is reachable from the internet. Set
# access = "public" deliberately, per app.
domain = "image-optimizer.example.com"
artifact = "components/target/image-optimizer.composed.wasm"

# sqlite: one file under the unit's StateDirectory, so state survives the
# restarts `Restart=always` makes routine.
kv = "sqlite"

# `comp-imageopt` (ADR-0095) gets its own systemd unit too — see [[daemon]]
# below. `holon node render` emits comp-imageopt.service alongside this app's
# unit, `--allow-path /var/lib/image-optimizer` and all.
[config]
imageopt-url = "http://127.0.0.1:8004"

[[daemon]]
name = "imageopt"
addr = "127.0.0.1:8004"
allow_flag = "allow-path"
allow = ["/var/lib/image-optimizer"]
