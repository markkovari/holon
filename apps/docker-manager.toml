name = "docker-manager"
domain = "docker-manager.example.com"
artifact = "components/target/docker-manager.composed.wasm"

kv = "sqlite"

components = ["docker-manager-domain"]

[config]
docker-url = "http://127.0.0.1:8002"

# No `token`, so the demo runs with nothing to provision; on a shared box set it and the
# matching `<name>-token` in [config], or any local process can reach this daemon.
[[daemon]]
name = "docker"
addr = "127.0.0.1:8002"
