# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render docker-manager
#   just selfhost-deploy docker-manager my-vps
name = "docker-manager"
domain = "docker-manager.example.com"
artifact = "components/target/docker-manager.composed.wasm"

kv = "sqlite"

components = ["docker-manager-domain"]

# `comp-docker` (ADR-0095) has to be started separately — deploy tooling
# renders a unit for the wasm side only, not for the native daemons behind
# the twelve host capabilities. It needs a real Docker (or Docker-API-
# compatible, e.g. OrbStack) socket reachable on the box:
#   comp-docker --addr 127.0.0.1:8002
[config]
docker-url = "http://127.0.0.1:8002"
