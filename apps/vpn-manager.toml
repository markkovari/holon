name = "vpn-manager"
domain = "vpn-manager.example.com"
artifact = "components/target/vpn-manager.composed.wasm"

kv = "sqlite"

components = ["vpn-manager-domain"]

[config]
wireguard-url = "http://127.0.0.1:8011"

# No `token`, so the demo runs with nothing to provision; on a shared box set it and the
# matching `<name>-token` in [config], or any local process can reach this daemon.
[[daemon]]
name = "wireguard"
addr = "127.0.0.1:8011"
allow_flag = "allow-interface"
allow = ["wg0"]
