# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render vpn-manager
#   just selfhost-deploy vpn-manager my-vps
name = "vpn-manager"
domain = "vpn-manager.example.com"
artifact = "components/target/vpn-manager.composed.wasm"

kv = "sqlite"

components = ["vpn-manager-domain"]

# `comp-wireguard` (ADR-0095) gets its own systemd unit too — see [[daemon]]
# below. `holon node render` emits comp-wireguard.service alongside this app's
# unit, `--allow-interface wg0` and all.
[config]
wireguard-url = "http://127.0.0.1:8011"

# No `token` set here — permissive, same reasoning as the demo mock-provider
# in intent-router.toml: this is meant to compose and run with nothing extra
# to provision. A real deployment sharing a box with anything else should
# set `token` here AND the matching `<name>-token` in [config] above (kept
# in sync by `check()`) — otherwise any local process can reach this daemon
# with no check at all (see `comp_reconciler::daemon_auth`'s own doc).
[[daemon]]
name = "wireguard"
addr = "127.0.0.1:8011"
allow_flag = "allow-interface"
allow = ["wg0"]
