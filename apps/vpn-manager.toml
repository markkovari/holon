# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render vpn-manager
#   just selfhost-deploy vpn-manager my-vps
name = "vpn-manager"
domain = "vpn-manager.example.com"
artifact = "components/target/vpn-manager.composed.wasm"

kv = "sqlite"

components = ["vpn-manager-domain"]

# `comp-wireguard` (ADR-0095) has to be started separately — deploy tooling
# renders a unit for the wasm side only, not for the native daemons behind
# the twelve host capabilities. It needs a real `wg` binary and at least one
# `--allow-interface`, or it reports zero peers rather than failing:
#   comp-wireguard --addr 127.0.0.1:8011 --allow-interface wg0
[config]
wireguard-url = "http://127.0.0.1:8011"
