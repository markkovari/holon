name = "lan-scanner"
domain = "lan-scanner.local"
artifact = "components/target/lan-scanner.composed.wasm"

kv = "sqlite"

# Read by the wasmCloud lanes to name the root component and derive its links.
components = ["lan-scanner"]

[config]
lanscan-url = "http://127.0.0.1:8005"

# No `token`, so the demo runs with nothing to provision; on a shared box set it and the
# matching `<name>-token` in [config], or any local process can reach this daemon.
[[daemon]]
name = "lanscan"
addr = "127.0.0.1:8005"
allow_flag = "allow-cidr"
allow = ["192.168.1.0/24"]
