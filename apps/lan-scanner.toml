# Generated by tools/gen-app-specs.py from this app's `host-lan-scanner` recipe.
# EDIT `domain` before deploying — the value below is a placeholder.
#
#   just selfhost-render lan-scanner            # read the unit and route first
#   just selfhost-deploy lan-scanner my-vps     # compose, ship, restart, route
name = "lan-scanner"
# tailnet is the default and is left alone on purpose: a generated file must
# never be the reason an app is reachable from the internet. Set
# access = "public" deliberately, per app.
domain = "lan-scanner.local"
artifact = "components/target/lan-scanner.composed.wasm"

# sqlite: one file under the unit's StateDirectory, so state survives the
# restarts `Restart=always` makes routine.
kv = "sqlite"

# The component this app is, as `comp-capgraph` names it. Read by the wasmCloud
# lanes to name the root and derive its links.
components = ["lan-scanner"]

# `comp-lanscan` (ADR-0095) gets its own systemd unit too — see [[daemon]]
# below. `holon node render` emits comp-lanscan.service alongside this app's
# unit, `--allow-cidr 192.168.1.0/24` and all.
[config]
lanscan-url = "http://127.0.0.1:8005"

[[daemon]]
name = "lanscan"
addr = "127.0.0.1:8005"
allow_flag = "allow-cidr"
allow = ["192.168.1.0/24"]
