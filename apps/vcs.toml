name = "vcs"
# Whoever reaches the gateway can edit every workspace.
access = "tailnet"
domain = "vcs.example.com"
artifact = "components/target/vcs_gateway.composed.wasm"
root = "vcs-gateway"
port = 3942
# All state lives in comp-vcs.
kv = "memory"

[config]
vcs-url = "http://127.0.0.1:8014"

# No `token`: demo only; a real deployment sets it and the matching `vcs-token` in [config].
# SurrealDB's :8000 clashes with comp-fswatch in fs-watcher.toml; they cannot share a box as written.
[[daemon]]
name = "vcs"
addr = "127.0.0.1:8014"
allow_flag = "allow-path"
allow = ["/var/lib/vcs/checkouts"]
extra_args = [
    "--nats-url nats://127.0.0.1:4222",
    "--surreal-url 127.0.0.1:8000 --surreal-ns holon --surreal-db vcs",
]
