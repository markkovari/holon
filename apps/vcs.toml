name = "vcs"
# Whoever reaches the gateway can edit every workspace.
access = "tailnet"
domain = "vcs.example.com"
artifact = "components/target/vcs_gateway.composed.wasm"
root = "vcs-gateway"
port = 3942
# The code store is this app's own records, moved by compare-and-set (ADR-0134), so the store must
# be durable; on a NATS cluster use kv = "nats" with every server in kv_url and --kv-replicas 3.
kv = "sqlite"
# Where `materialize` may write a checkout: the host opens it to the app at the same path.
dirs = ["/var/lib/vcs/checkouts"]
mem_cap_mb = 256
