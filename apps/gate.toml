name = "gate"
access = "tailnet"
# Must resolve to the box's Tailscale address (custom DNS or split DNS): MagicDNS gives one name per machine.
domain = "gate.example.com"
artifact = "components/target/gate_domain.composed.wasm"

kv = "sqlite"

# Read only by the Kubernetes lane (tier 3), so moving up a tier is an edit, not a rewrite.
components = ["gate-domain", "record-store", "shaper"]
strategy = "fused"

# Tables last: every key after a `[table]` header belongs to that table.
[config]
grace-period-secs = "5"
