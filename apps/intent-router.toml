name = "intent-router"
access = "tailnet"
domain = "intent-router.example.com"
artifact = "components/target/intent_router.composed.wasm"

kv = "sqlite"

# `mock-provider` keeps the demo free and offline; a real deployment plugs in openai-/anthropic-provider.
components = ["intent-router", "mock-provider"]
strategy = "fused"

[config]
mock-model = "mock-intent-router"
# First match wins. Not keyed on domain names: the system prompt lists all four, so such a rule matches every request.
mock-script = '''{"rules": [
  {"when": "printer",           "text": "{\"domain\": \"helpdesk-domain\", \"confidence\": 0.92}"},
  {"when": "password reset",    "text": "{\"domain\": \"helpdesk-domain\", \"confidence\": 0.9}"},
  {"when": "vet appointment",   "text": "{\"domain\": \"clinic-domain\", \"confidence\": 0.9}"},
  {"when": "see a doctor",      "text": "{\"domain\": \"clinic-domain\", \"confidence\": 0.88}"},
  {"when": "book a studio",     "text": "{\"domain\": \"studio-domain\", \"confidence\": 0.9}"},
  {"when": "rehearsal space",   "text": "{\"domain\": \"studio-domain\", \"confidence\": 0.85}"},
  {"when": "order groceries",   "text": "{\"domain\": \"grocery-domain\", \"confidence\": 0.92}"},
  {"when": "buy some milk",     "text": "{\"domain\": \"grocery-domain\", \"confidence\": 0.87}"},
  {"when": "*",                 "text": "{\"domain\": \"unknown\", \"confidence\": 0.0}"}
]}'''
