name = "events"
# MagicDNS name: routed by `tailscale serve` (one hostname and real cert per machine), not Caddy.
domain = "malna.tail3a9c.ts.net"
artifact = "components/target/events_domain.composed.wasm"
port = 3230
# The SPA uses absolute /api and /assets paths, so the default /events mount would break it.
mount = "/"
static_dir = "examples/events/dist"

kv = "sqlite"

[config]
# Registration grants only "attendee", so without this nobody can create events. EDIT THIS.
organizer-emails = "mark.kovari@attrecto.com"
# An empty allowlist allows no poster uploads at all.
allowed-types = "image/png,image/jpeg,image/webp"
max-size = "2097152"
# allow-test-routes is deliberately absent: /test/seed hands out bearers.
