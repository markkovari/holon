# Generated by tools/gen-app-specs.py from this app's `host-events` recipe.
# EDIT `domain` before deploying — the value below is a placeholder.
#
#   just selfhost-render events            # read the unit and route first
#   just selfhost-deploy events my-vps     # compose, ship, restart, route
name = "events"
# tailnet is the default and is left alone on purpose: a generated file must
# never be the reason an app is reachable from the internet. Set
# access = "public" deliberately, per app.
#
# malna's own MagicDNS name, because this app is routed by `tailscale serve`
# rather than by Caddy. That router gives ONE hostname per machine and a real
# cert with it — no DNS record to add, no `tls internal` root to trust on every
# device, and nothing listening on a public interface. The cost is that a second
# app on this box would have to live under a path.
domain = "malna.tail3a9c.ts.net"
artifact = "components/target/events_domain.composed.wasm"
# The port this app is run on locally, kept so a deployed app matches the
# recipe. Omit it and one is derived from the name, stably.
port = 3230
# This app owns the box, and it is a SPA: its /api and /assets paths are absolute,
# so the router default of /events would load the page and break everything on it.
mount = "/"
static_dir = "examples/events/dist"

# sqlite: one file under the unit's StateDirectory, so state survives the
# restarts `Restart=always` makes routine.
kv = "sqlite"
