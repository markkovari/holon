name = "photoquest"
access = "tailnet"
domain = "photoquest.example.com"
artifact = "components/target/photoquest_domain.composed.wasm"
port = 3941
static_dir = "examples/photoquest/public"
kv = "sqlite"
components = ["photoquest-domain", "auth-guard", "record-store", "audit-log", "rate-limiter", "media-pipeline", "webhook-sign"]
strategy = "fused"

# `public-callback-base` must be reachable by comp-media; loopback only while they share a box.
# `media-callback-secret` is a local-dev value that must equal the daemon's `--callback-secret`; change both for real.
# `allow-test-routes` is deliberately absent: it lets anyone move the game's clock.
[config]
media-url = "http://127.0.0.1:8013"
public-callback-base = "http://127.0.0.1:3941"
media-callback-secret = "photoquest-local-dev-callback-secret"

# No `token`: demo only; a real deployment sets it and the matching `media-token` in [config].
# No `allow`: comp-media builds its own object keys, so there is no caller-steered path to bound.
# RustFS answers CORS from MEDIA_CORS_ORIGINS, which must include this app's origin for the browser to read ETags.
# `--callback-allow` pins the only host:port a result may be POSTed to (an open callback would be an SSRF).
[[daemon]]
name = "media"
addr = "127.0.0.1:8013"
extra_args = [
    "--s3-endpoint http://127.0.0.1:9000",
    "--s3-access-key rustfsadmin --s3-secret-key rustfsadmin",
    "--callback-secret photoquest-local-dev-callback-secret",
    "--cors-origin http://127.0.0.1:3941 --cors-origin http://localhost:3941",
    "--callback-allow 127.0.0.1:3941",
    "--apple-helper reconciler/target/comp-media-apple",
]
