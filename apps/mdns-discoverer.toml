name = "mdns-discoverer"
domain = "mdns-discoverer.local"
artifact = "components/target/mdns-discoverer.composed.wasm"

kv = "sqlite"

components = ["mdns-discoverer-domain"]

[config]
mdns-url = "http://127.0.0.1:8007"

# No `token`, so the demo runs with nothing to provision; on a shared box set it and the
# matching `<name>-token` in [config], or any local process can reach this daemon.
[[daemon]]
name = "mdns"
addr = "127.0.0.1:8007"
