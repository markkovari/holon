# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render mdns-discoverer
#   just selfhost-deploy mdns-discoverer my-vps
name = "mdns-discoverer"
domain = "mdns-discoverer.local"
artifact = "components/target/mdns-discoverer.composed.wasm"

kv = "sqlite"

components = ["mdns-discoverer-domain"]

# `comp-mdns` (ADR-0095) has to be started separately — deploy tooling
# renders a unit for the wasm side only, not for the native daemons behind
# the twelve host capabilities. It needs multicast on the host's network
# interface, which a container or a tailnet-only box may not have:
#   comp-mdns --addr 127.0.0.1:8007
[config]
mdns-url = "http://127.0.0.1:8007"
