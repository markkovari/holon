# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   holon node render apps/mdns-discoverer.toml --out target/selfhost   # write the unit/env/route
#   then copy target/selfhost/mdns-discoverer/* to the box and `systemctl enable --now comp-mdns-discoverer.service`
name = "mdns-discoverer"
domain = "mdns-discoverer.local"
artifact = "components/target/mdns-discoverer.composed.wasm"

kv = "sqlite"

components = ["mdns-discoverer-domain"]

# `comp-mdns` (ADR-0095) gets its own systemd unit too — see [[daemon]]
# below. `holon node render` emits comp-mdns.service alongside this app's unit.
[config]
mdns-url = "http://127.0.0.1:8007"

# No `token` set here — permissive, same reasoning as the demo mock-provider
# in intent-router.toml: this is meant to compose and run with nothing extra
# to provision. A real deployment sharing a box with anything else should
# set `token` here AND the matching `<name>-token` in [config] above (kept
# in sync by `check()`) — otherwise any local process can reach this daemon
# with no check at all (see `comp_reconciler::daemon_auth`'s own doc).
[[daemon]]
name = "mdns"
addr = "127.0.0.1:8007"
