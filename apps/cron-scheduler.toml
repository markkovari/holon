name = "cron-scheduler"
domain = "cron-scheduler.example.com"
artifact = "components/target/cron-scheduler.composed.wasm"

kv = "sqlite"

components = ["cron-scheduler-domain"]

[config]
cron-url = "http://127.0.0.1:8008"

# No `token`, so the demo runs with nothing to provision; on a shared box set it and the
# matching `<name>-token` in [config], or any local process can reach this daemon.
[[daemon]]
name = "cron"
addr = "127.0.0.1:8008"
