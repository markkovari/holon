# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render cron-scheduler
#   just selfhost-deploy cron-scheduler my-vps
name = "cron-scheduler"
domain = "cron-scheduler.example.com"
artifact = "components/target/cron-scheduler.composed.wasm"

kv = "sqlite"

components = ["cron-scheduler-domain"]

# `comp-cron` (ADR-0095) has to be started separately — deploy tooling
# renders a unit for the wasm side only, not for the native daemons behind
# the twelve host capabilities. It reads the deploying user's own crontab —
# no crontab is a real, non-error answer (an empty job list):
#   comp-cron --addr 127.0.0.1:8008
[config]
cron-url = "http://127.0.0.1:8008"
