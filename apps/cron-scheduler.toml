# Hand-authored — same shape as gate.toml/fs-watcher.toml.
#
#   just selfhost-render cron-scheduler
#   just selfhost-deploy cron-scheduler my-vps
name = "cron-scheduler"
domain = "cron-scheduler.example.com"
artifact = "components/target/cron-scheduler.composed.wasm"

kv = "sqlite"

components = ["cron-scheduler-domain"]

# `comp-cron` (ADR-0095) gets its own systemd unit too — see [[daemon]]
# below. `holon node render` emits comp-cron.service alongside this app's unit.
[config]
cron-url = "http://127.0.0.1:8008"

[[daemon]]
name = "cron"
addr = "127.0.0.1:8008"
