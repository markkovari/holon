[package]
name = "agent-matrix"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Matrix bridge for agent-runtime: every agent is a Matrix user, every project a Space. Chat with an agent in its room, add an agent to a project by inviting it, approve tool calls with a poll."

# The bridge's logic, with no I/O of its own: `components/matrix-bridge` runs it on comp-host,
# handing it wasi:http and the app's keyvalue; the e2e test hands it reqwest and a file.

[dependencies]
agent-wire.workspace = true
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The e2e test starts a real runtime with scripted agents, in-process.
agent-runtime.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tiny_http = "0.12"
