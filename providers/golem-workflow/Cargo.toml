[package]
name = "golem-workflow-provider"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native wasmCloud v2 capability provider bridging durable:workflow/orchestrator (wRPC) to durable Golem workers"

# Standalone crate — a NATIVE binary/lib, NOT part of the components wasm
# workspace (which targets wasm32). Kept out so its heavy native deps
# (wasmtime, golem-client, wrpc) never touch the component builds.
# standalone crate; `golem-agent` is a Golem app scaffolded here for the live
# e2e (gitignored) — exclude it so cargo doesn't treat it as a workspace member.
[workspace]
exclude = ["golem-agent"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "golem-workflow-provider"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.33"
# rung 1 only needs the Value type for the mapping — no-default-features keeps
# wasmtime (the `host` feature) out, so the mapping unit tests build fast.
# rung 2 adds the binary + wasmcloud-provider-sdk / wit-bindgen-wrpc /
# wrpc-transport-nats / golem-client and enables the host feature there.
# golem-wasm-rpc's native path requires the `host` feature (it re-exports the
# generated golem_rpc bindings only there) — which pulls wasmtime. There's no
# light native build; this is the same heavy tree the provider binary needs, so
# rung 1's tests and rung 2's provider share it.
golem-wasm-rpc = { version = "1.3.1" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wasmcloud-provider-sdk = "0.17"
wit-bindgen-wrpc = "0.10"
