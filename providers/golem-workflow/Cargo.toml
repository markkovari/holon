[package]
name = "golem-workflow-provider"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native wasmCloud v2 capability provider bridging durable:workflow/orchestrator (wRPC) to durable Golem workers"

# Standalone native crate, kept out of the wasm32 components workspace;
# `golem-agent` is the gitignored Golem app `e2e.sh` scaffolds.
[workspace]
exclude = ["golem-agent"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "golem-workflow-provider"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.33"
# Default features: the native path needs `host` (and so wasmtime); there is no lighter build.
golem-wasm-rpc = { version = "1.3.1" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wasmcloud-provider-sdk = "0.17"
wit-bindgen-wrpc = "0.10"
